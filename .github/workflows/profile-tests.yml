name: Profile tests

# Checks that the published example profiles, CBOMs and validator still behave
# as the methodology documentation describes. Runs on any change to the
# methodology artifacts or to the tests themselves.

on:
  push:
    branches: [main]
    paths:
      - 'docs/methodology/**'
      - 'tests/**'
      - '.github/workflows/profile-tests.yml'
  pull_request:
    paths:
      - 'docs/methodology/**'
      - 'tests/**'
      - '.github/workflows/profile-tests.yml'
  workflow_dispatch:

jobs:
  profile-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node
        # tests/check-demo.py runs the demonstration page's own script to compare
        # its results with the reference validator's. It skips itself with a
        # message when Node is absent, which is right for a contributor's machine
        # and would quietly drop a check here.
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the schema validator
        # Only the published-schema checks need it. tests/check-schemas.py skips
        # itself with a message when it is absent, so a contributor without it
        # can still run the rest of the suite.
        run: python -m pip install --quiet jsonschema

      - name: Run profile tests
        run: bash tests/run-profile-tests.sh
