<svg width="720" height="195" viewBox="0 0 720 195" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="12"><title>Two endpoint boxes, each listing support for ML-KEM-768 and X25519, joined by a link labelled negotiated X25519 only and marked classical</title><rect width="100%" height="100%" fill="#ffffff"/>
      <rect x="16" y="56" width="180" height="76" rx="12" fill="#eefaf1" stroke="#15803d"></rect>
      <text x="106" y="79" fill="#1a2230" text-anchor="middle" font-weight="600">Endpoint A</text>
      <text x="106" y="98" fill="#15803d" text-anchor="middle" font-size="10.5" font-family="monospace">supports ML-KEM-768</text>
      <text x="106" y="115" fill="#15803d" text-anchor="middle" font-size="10.5" font-family="monospace">supports X25519</text>
      <rect x="524" y="56" width="180" height="76" rx="12" fill="#eefaf1" stroke="#15803d"></rect>
      <text x="614" y="79" fill="#1a2230" text-anchor="middle" font-weight="600">Endpoint B</text>
      <text x="614" y="98" fill="#15803d" text-anchor="middle" font-size="10.5" font-family="monospace">supports ML-KEM-768</text>
      <text x="614" y="115" fill="#15803d" text-anchor="middle" font-size="10.5" font-family="monospace">supports X25519</text>
      <line x1="196" y1="94" x2="524" y2="94" stroke="#dc2626" stroke-width="2"></line>
      <rect x="266" y="76" width="188" height="38" rx="19" fill="#fdeeee" stroke="#dc2626"></rect>
      <text x="360" y="93" fill="#dc2626" text-anchor="middle" font-size="11" font-weight="600">negotiated: X25519 only</text>
      <text x="360" y="107" fill="#7f1d1d" text-anchor="middle" font-size="10">classical</text>
      <text x="360" y="150" fill="#5b6472" text-anchor="middle" font-size="11">both node records are correct</text>
      <text x="360" y="170" fill="#5b6472" text-anchor="middle" font-size="11">the true state of the connection appears on neither of them</text>
    </svg>
