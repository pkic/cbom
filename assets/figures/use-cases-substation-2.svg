<svg width="720" height="350" viewBox="0 0 720 350" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="11"><title>Five paths, each traced from the message to what protects it to where its keys or trust come from, with its post-quantum status. GOOSE and sampled values are protected by HMAC or GMAC with a group key that comes from the GDOI key server over IKEv1 phase 1: the data plane is already quantum-resistant and the key plane is blocked by a standard. MMS is protected by TLS under IEC 62351-3 with ECDHE and ECDSA, keyed by a device certificate enrolled over EST or SCEP: blocked by a standard. Role-based access tokens under IEC 62351-8 are protected by a token signature from the token issuer's key: blocked by a standard. A firmware image is protected by a signature checked at boot against a key and algorithm in boot ROM or the loader: blocked by the product, or replaced at refurbishment. The control-centre link under IEC 60870-5-104 is protected by TLS inside a tunnel set up by the WAN router with IKEv2: it can move first, with hybrid ML-KEM at the conduit.</title><rect width="100%" height="100%" fill="#ffffff"/>
      <g fill="#5b6472" font-weight="600" text-anchor="middle">
        <text x="95" y="38">what is sent</text>
        <text x="280" y="38">protected by</text>
        <text x="465" y="38">keys or trust from</text>
        <text x="639" y="38">post-quantum status</text>
      </g>
      <rect x="10" y="52" width="170" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"></rect><text x="95.0" y="71" text-anchor="middle" fill="#1a2230">GOOSE and SV</text><text x="95.0" y="86" text-anchor="middle" fill="#5b6472">trip, sampled values</text><line x1="180" y1="74" x2="200" y2="74" stroke="#5b6472" stroke-width="1.3"></line><rect x="200" y="52" width="160" height="44" rx="6" fill="#dcfce7" stroke="#0f7a52" stroke-width="1.4"></rect><text x="280.0" y="71" text-anchor="middle" fill="#1a2230">HMAC or GMAC</text><text x="280.0" y="86" text-anchor="middle" fill="#5b6472">with a group key</text><line x1="360" y1="74" x2="380" y2="74" stroke="#5b6472" stroke-width="1.3" stroke-dasharray="4 3"></line><rect x="380" y="52" width="170" height="44" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"></rect><text x="465.0" y="71" text-anchor="middle" fill="#1a2230">GDOI key server</text><text x="465.0" y="86" text-anchor="middle" fill="#5b6472">IKEv1 phase 1</text><rect x="565" y="52" width="148" height="44" rx="22" fill="#ffffff" stroke="#b45309" stroke-width="2"></rect><text x="639.0" y="71" text-anchor="middle" fill="#b45309" font-weight="600">data plane resistant</text><text x="639.0" y="86" text-anchor="middle" fill="#b45309">key plane: standard</text><rect x="10" y="108" width="170" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"></rect><text x="95.0" y="127" text-anchor="middle" fill="#1a2230">MMS</text><text x="95.0" y="142" text-anchor="middle" fill="#5b6472">control, settings</text><line x1="180" y1="130" x2="200" y2="130" stroke="#5b6472" stroke-width="1.3"></line><rect x="200" y="108" width="160" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"></rect><text x="280.0" y="127" text-anchor="middle" fill="#1a2230">TLS, IEC 62351-3</text><text x="280.0" y="142" text-anchor="middle" fill="#5b6472">ECDHE, ECDSA</text><line x1="360" y1="130" x2="380" y2="130" stroke="#5b6472" stroke-width="1.3" stroke-dasharray="4 3"></line><rect x="380" y="108" width="170" height="44" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"></rect><text x="465.0" y="127" text-anchor="middle" fill="#1a2230">device certificate</text><text x="465.0" y="142" text-anchor="middle" fill="#5b6472">EST or SCEP</text><rect x="565" y="108" width="148" height="44" rx="22" fill="#ffffff" stroke="#b45309" stroke-width="2"></rect><text x="639.0" y="134" text-anchor="middle" fill="#b45309" font-weight="600">blocked: standard</text><rect x="10" y="164" width="170" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"></rect><text x="95.0" y="183" text-anchor="middle" fill="#1a2230">Role-based access</text><text x="95.0" y="198" text-anchor="middle" fill="#5b6472">IEC 62351-8</text><line x1="180" y1="186" x2="200" y2="186" stroke="#5b6472" stroke-width="1.3"></line><rect x="200" y="164" width="160" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"></rect><text x="280.0" y="190" text-anchor="middle" fill="#1a2230">token signature</text><line x1="360" y1="186" x2="380" y2="186" stroke="#5b6472" stroke-width="1.3" stroke-dasharray="4 3"></line><rect x="380" y="164" width="170" height="44" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"></rect><text x="465.0" y="190" text-anchor="middle" fill="#1a2230">token issuer key</text><rect x="565" y="164" width="148" height="44" rx="22" fill="#ffffff" stroke="#b45309" stroke-width="2"></rect><text x="639.0" y="190" text-anchor="middle" fill="#b45309" font-weight="600">blocked: standard</text><rect x="10" y="220" width="170" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"></rect><text x="95.0" y="246" text-anchor="middle" fill="#1a2230">Firmware image</text><line x1="180" y1="242" x2="200" y2="242" stroke="#5b6472" stroke-width="1.3"></line><rect x="200" y="220" width="160" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"></rect><text x="280.0" y="246" text-anchor="middle" fill="#1a2230">signature at boot</text><line x1="360" y1="242" x2="380" y2="242" stroke="#5b6472" stroke-width="1.3" stroke-dasharray="4 3"></line><rect x="380" y="220" width="170" height="44" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"></rect><text x="465.0" y="239" text-anchor="middle" fill="#1a2230">key and algorithm</text><text x="465.0" y="254" text-anchor="middle" fill="#5b6472">in boot ROM or loader</text><rect x="565" y="220" width="148" height="44" rx="22" fill="#ffffff" stroke="#b91c1c" stroke-width="2"></rect><text x="639.0" y="239" text-anchor="middle" fill="#b91c1c" font-weight="600">blocked: product</text><text x="639.0" y="254" text-anchor="middle" fill="#b91c1c">or replace at refit</text><rect x="10" y="276" width="170" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"></rect><text x="95.0" y="295" text-anchor="middle" fill="#1a2230">Control-centre link</text><text x="95.0" y="310" text-anchor="middle" fill="#5b6472">IEC 60870-5-104</text><line x1="180" y1="298" x2="200" y2="298" stroke="#5b6472" stroke-width="1.3"></line><rect x="200" y="276" width="160" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"></rect><text x="280.0" y="302" text-anchor="middle" fill="#1a2230">TLS inside a tunnel</text><line x1="360" y1="298" x2="380" y2="298" stroke="#5b6472" stroke-width="1.3" stroke-dasharray="4 3"></line><rect x="380" y="276" width="170" height="44" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"></rect><text x="465.0" y="295" text-anchor="middle" fill="#1a2230">WAN router</text><text x="465.0" y="310" text-anchor="middle" fill="#5b6472">IKEv2, the conduit</text><rect x="565" y="276" width="148" height="44" rx="22" fill="#ffffff" stroke="#0369a1" stroke-width="2"></rect><text x="639.0" y="295" text-anchor="middle" fill="#0369a1" font-weight="600">can move first</text><text x="639.0" y="310" text-anchor="middle" fill="#0369a1">hybrid ML-KEM</text>
    </svg>
