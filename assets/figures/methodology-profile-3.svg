<svg width="720" height="235" viewBox="0 0 720 235" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="12"><title>Independent evaluation produces separate verdicts; extension produces a derived profile whose conformance implies the base</title><rect width="100%" height="100%" fill="#ffffff"/>
      <title>Independent evaluation compared with extension</title>
      <text x="180" y="20" fill="#5b6472" text-anchor="middle" font-size="11" font-family="monospace">INDEPENDENT EVALUATION</text>
      <rect x="16" y="80" width="104" height="46" rx="10" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="68" y="108" fill="#1a2230" text-anchor="middle">one CBOM</text>
      <rect x="196" y="38" width="128" height="34" rx="8" fill="#ffffff" stroke="#1c5fd6"></rect>
      <text x="260" y="60" fill="#1a2230" text-anchor="middle" font-size="11">procurement</text>
      <rect x="196" y="86" width="128" height="34" rx="8" fill="#ffffff" stroke="#1c5fd6"></rect>
      <text x="260" y="108" fill="#1a2230" text-anchor="middle" font-size="11">migration</text>
      <rect x="196" y="134" width="128" height="34" rx="8" fill="#ffffff" stroke="#1c5fd6"></rect>
      <text x="260" y="156" fill="#1a2230" text-anchor="middle" font-size="11">vulnerability</text>
      <g stroke="#c9d3e0" stroke-width="2" fill="none">
        <line x1="120" y1="97" x2="196" y2="55"></line><line x1="120" y1="103" x2="196" y2="103"></line><line x1="120" y1="109" x2="196" y2="151"></line>
      </g>
      <text x="180" y="196" fill="#5b6472" text-anchor="middle" font-size="11">three separate verdicts</text>
      <text x="180" y="212" fill="#5b6472" text-anchor="middle" font-size="11">no profile knows about the others</text>

      <line x1="376" y1="30" x2="376" y2="215" stroke="#e4e8ee" stroke-width="2"></line>

      <text x="548" y="20" fill="#5b6472" text-anchor="middle" font-size="11" font-family="monospace">EXTENSION</text>
      <rect x="470" y="42" width="156" height="42" rx="10" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="548" y="62" fill="#1a2230" text-anchor="middle" font-size="11.5">base profile</text>
      <text x="548" y="77" fill="#5b6472" text-anchor="middle" font-size="10">interface disclosure v0.7</text>
      <rect x="470" y="120" width="156" height="42" rx="10" fill="#eafaf1" stroke="#0f7a52"></rect>
      <text x="548" y="140" fill="#1a2230" text-anchor="middle" font-size="11.5">derived profile</text>
      <text x="548" y="155" fill="#5b6472" text-anchor="middle" font-size="10">adds and tightens only</text>
      <line x1="548" y1="84" x2="548" y2="120" stroke="#0f7a52" stroke-width="2"></line>
      <polygon points="548,84 543,94 553,94" fill="#0f7a52"></polygon>
      <text x="548" y="196" fill="#0f7a52" text-anchor="middle" font-size="11">conforming to the derived profile</text>
      <text x="548" y="212" fill="#0f7a52" text-anchor="middle" font-size="11">means conforming to the base</text>
    </svg>
