<svg width="720" height="260" viewBox="0 0 720 260" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="12"><title>Two panels showing interfaces with identical cryptography. The left carries a public status page over the internet with a confidentiality lifetime under one year and low exposure. The right carries clinical records over the internet with a lifetime over fifteen years and high exposure</title><rect width="100%" height="100%" fill="#ffffff"/>
      <rect x="20" y="30" width="320" height="200" rx="12" fill="#eefaf1" stroke="#15803d"></rect>
      <rect x="380" y="30" width="320" height="200" rx="12" fill="#fdeeee" stroke="#dc2626"></rect>

      <text x="180" y="54" fill="#14532d" text-anchor="middle" font-weight="700">Interface A</text>
      <text x="540" y="54" fill="#7f1d1d" text-anchor="middle" font-weight="700">Interface B</text>

      <text x="180" y="76" fill="#39424f" text-anchor="middle" font-size="11">public status page</text>
      <text x="540" y="76" fill="#39424f" text-anchor="middle" font-size="11">clinical records</text>

      <rect x="44" y="90" width="272" height="60" rx="8" fill="#ffffff" stroke="#c9d3e0"></rect>
      <rect x="404" y="90" width="272" height="60" rx="8" fill="#ffffff" stroke="#c9d3e0"></rect>
      <text x="180" y="110" fill="#5b6472" text-anchor="middle" font-size="10.5" font-family="monospace">TLS 1.3 · X25519</text>
      <text x="180" y="126" fill="#5b6472" text-anchor="middle" font-size="10.5" font-family="monospace">AES-256-GCM · RSA-2048</text>
      <text x="180" y="142" fill="#1a2230" text-anchor="middle" font-size="10.5" font-weight="600">identical disclosure</text>
      <text x="540" y="110" fill="#5b6472" text-anchor="middle" font-size="10.5" font-family="monospace">TLS 1.3 · X25519</text>
      <text x="540" y="126" fill="#5b6472" text-anchor="middle" font-size="10.5" font-family="monospace">AES-256-GCM · RSA-2048</text>
      <text x="540" y="142" fill="#1a2230" text-anchor="middle" font-size="10.5" font-weight="600">identical disclosure</text>

      <text x="44" y="176" fill="#5b6472" font-size="11">confidentiality lifetime</text>
      <text x="316" y="176" fill="#14532d" text-anchor="end" font-size="11" font-weight="600">under 1 year</text>
      <text x="404" y="176" fill="#5b6472" font-size="11">confidentiality lifetime</text>
      <text x="676" y="176" fill="#7f1d1d" text-anchor="end" font-size="11" font-weight="600">over 15 years</text>

      <text x="44" y="196" fill="#5b6472" font-size="11">exposure</text>
      <text x="316" y="196" fill="#39424f" text-anchor="end" font-size="11">public internet</text>
      <text x="404" y="196" fill="#5b6472" font-size="11">exposure</text>
      <text x="676" y="196" fill="#39424f" text-anchor="end" font-size="11">public internet</text>

      <text x="180" y="220" fill="#15803d" text-anchor="middle" font-size="11" font-weight="700">little affected</text>
      <text x="540" y="220" fill="#dc2626" text-anchor="middle" font-size="11" font-weight="700">exposed today</text>

      <text x="360" y="18" fill="#1a2230" text-anchor="middle" font-size="11" font-weight="600">the cryptography is the same; the exposure is not</text>
    </svg>
