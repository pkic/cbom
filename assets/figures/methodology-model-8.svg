<svg width="720" height="180" viewBox="0 0 720 180" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="12"><title>A modern gateway supporting ML-KEM and AES-256-GCM linked to a legacy controller with a fixed algorithm set and no firmware path, the link labelled posture set by the weaker end</title><rect width="100%" height="100%" fill="#ffffff"/>
      <rect x="16" y="58" width="190" height="74" rx="12" fill="#eefaf1" stroke="#15803d"></rect>
      <text x="111" y="82" fill="#1a2230" text-anchor="middle" font-weight="600">Modern gateway</text>
      <text x="111" y="100" fill="#15803d" text-anchor="middle" font-size="10.5" font-family="monospace">ML-KEM, AES-256-GCM</text>
      <text x="111" y="117" fill="#5b6472" text-anchor="middle" font-size="10">upgradeable</text>
      <rect x="514" y="58" width="190" height="74" rx="12" fill="#fdeeee" stroke="#dc2626"></rect>
      <text x="609" y="82" fill="#1a2230" text-anchor="middle" font-weight="600">Legacy controller</text>
      <text x="609" y="100" fill="#dc2626" text-anchor="middle" font-size="10.5" font-family="monospace">fixed algorithm set</text>
      <text x="609" y="117" fill="#b45309" text-anchor="middle" font-size="10">no firmware path</text>
      <line x1="206" y1="95" x2="514" y2="95" stroke="#b45309" stroke-width="2"></line>
      <rect x="272" y="78" width="176" height="34" rx="17" fill="#fff7ec" stroke="#b45309"></rect>
      <text x="360" y="99" fill="#6b4a12" text-anchor="middle" font-size="11">posture set by the weaker end</text>
      <text x="360" y="146" fill="#5b6472" text-anchor="middle" font-size="11">upgrading the gateway does not change this relationship</text>
      <text x="360" y="166" fill="#5b6472" text-anchor="middle" font-size="11">the remediation is replacement of the controller</text>
    </svg>
