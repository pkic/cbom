<svg width="720" height="170" viewBox="0 0 720 170" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="13"><title>A central Profile box holding one attribute table, with an arrow from a producer labelled specification and an arrow to a consumer labelled checklist</title><rect width="100%" height="100%" fill="#ffffff"/>
      <rect x="285" y="60" width="150" height="48" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"></rect>
      <text x="360" y="80" fill="#1a2230" text-anchor="middle" font-weight="700">Profile</text>
      <text x="360" y="97" fill="#5b6472" text-anchor="middle" font-size="11">one attribute table</text>
      <rect x="24" y="54" width="180" height="60" rx="12" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="114" y="78" fill="#1a2230" text-anchor="middle" font-weight="600">Producer</text>
      <text x="114" y="96" fill="#5b6472" text-anchor="middle" font-size="11">build / scanner → CBOM</text>
      <line x1="204" y1="84" x2="285" y2="84" stroke="#15803d" stroke-width="2"></line>
      <polygon points="285,84 273,79 273,89" fill="#15803d"></polygon>
      <text x="244" y="74" fill="#15803d" text-anchor="middle" font-size="11" font-weight="600">specification</text>
      <rect x="516" y="54" width="180" height="60" rx="12" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="606" y="78" fill="#1a2230" text-anchor="middle" font-weight="600">Consumer</text>
      <text x="606" y="96" fill="#5b6472" text-anchor="middle" font-size="11">CI gate validates CBOM</text>
      <line x1="435" y1="84" x2="516" y2="84" stroke="#b45309" stroke-width="2"></line>
      <polygon points="516,84 504,79 504,89" fill="#b45309"></polygon>
      <text x="475" y="74" fill="#b45309" text-anchor="middle" font-size="11" font-weight="600">checklist</text>
    </svg>
