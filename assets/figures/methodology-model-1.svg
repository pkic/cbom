<svg width="720" height="250" viewBox="0 0 720 250" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="13"><title>Two endpoint boxes, a client browser and a server running nginx, joined by an edge labelled cryptographic relationship that branches down to key exchange, encryption and certificate assets</title><rect width="100%" height="100%" fill="#ffffff"/>
      <rect x="24" y="70" width="170" height="70" rx="12" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="109" y="98" fill="#0284c7" font-size="11" font-weight="700" text-anchor="middle" font-family="monospace">ENDPOINT · client</text>
      <text x="109" y="120" fill="#1a2230" font-weight="600" text-anchor="middle">Browser</text>
      <rect x="526" y="70" width="170" height="70" rx="12" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="611" y="98" fill="#7c3aed" font-size="11" font-weight="700" text-anchor="middle" font-family="monospace">ENDPOINT · server</text>
      <text x="611" y="120" fill="#1a2230" font-weight="600" text-anchor="middle">nginx</text>
      <line x1="194" y1="105" x2="526" y2="105" stroke="#2563eb" stroke-width="2"></line>
      <polygon points="526,105 514,100 514,110" fill="#2563eb"></polygon>
      <polygon points="194,105 206,100 206,110" fill="#2563eb"></polygon>
      <rect x="286" y="86" width="148" height="38" rx="19" fill="#ffffff" stroke="#2563eb"></rect>
      <text x="360" y="103" fill="#1a2230" text-anchor="middle" font-size="12" font-weight="600">cryptographic</text>
      <text x="360" y="117" fill="#5b6472" text-anchor="middle" font-size="11">relationship (edge)</text>
      <line x1="360" y1="124" x2="360" y2="158" stroke="#c9d3e0"></line>
      <line x1="230" y1="158" x2="490" y2="158" stroke="#c9d3e0"></line>
      <line x1="230" y1="158" x2="230" y2="178" stroke="#c9d3e0"></line>
      <line x1="360" y1="158" x2="360" y2="178" stroke="#c9d3e0"></line>
      <line x1="490" y1="158" x2="490" y2="178" stroke="#c9d3e0"></line>
      <g font-size="11" font-family="monospace">
        <rect x="168" y="178" width="124" height="30" rx="8" fill="#eef2f8" stroke="#d5dbe6"></rect>
        <text x="230" y="197" fill="#1f3a8a" text-anchor="middle">key exchange</text>
        <rect x="300" y="178" width="120" height="30" rx="8" fill="#eef2f8" stroke="#d5dbe6"></rect>
        <text x="360" y="197" fill="#1f3a8a" text-anchor="middle">encryption</text>
        <rect x="428" y="178" width="124" height="30" rx="8" fill="#eef2f8" stroke="#d5dbe6"></rect>
        <text x="490" y="197" fill="#1f3a8a" text-anchor="middle">certificate</text>
      </g>
      <text x="360" y="232" fill="#5b6472" text-anchor="middle" font-size="12">assets (nodes) are referenced by the relationship — they are not the relationship</text>
    </svg>
