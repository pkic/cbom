<svg width="720" height="190" viewBox="0 0 720 190" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="12"><title>A time axis with a writer backing up today and a reader restoring years later, joined by a relationship spanning the retention period, labelled AES-256 data encryption and RSA-2048 key wrapping</title><rect width="100%" height="100%" fill="#ffffff"/>
      <line x1="30" y1="150" x2="690" y2="150" stroke="#c9d3e0" stroke-width="2"></line>
      <polygon points="690,150 680,145 680,155" fill="#c9d3e0"></polygon>
      <text x="360" y="172" fill="#5b6472" text-anchor="middle" font-size="11">time</text>
      <circle cx="120" cy="150" r="6" fill="#2563eb"></circle>
      <circle cx="600" cy="150" r="6" fill="#7c3aed"></circle>
      <rect x="45" y="66" width="150" height="50" rx="10" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="120" y="88" fill="#1a2230" text-anchor="middle" font-weight="600">Writer</text>
      <text x="120" y="105" fill="#5b6472" text-anchor="middle" font-size="10.5">backup job, today</text>
      <rect x="525" y="66" width="150" height="50" rx="10" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="600" y="88" fill="#1a2230" text-anchor="middle" font-weight="600">Reader</text>
      <text x="600" y="105" fill="#5b6472" text-anchor="middle" font-size="10.5">restore, years later</text>
      <line x1="120" y1="116" x2="120" y2="144" stroke="#c9d3e0"></line>
      <line x1="600" y1="116" x2="600" y2="144" stroke="#c9d3e0"></line>
      <line x1="195" y1="91" x2="525" y2="91" stroke="#2563eb" stroke-width="2"></line>
      <rect x="268" y="76" width="184" height="30" rx="15" fill="#ffffff" stroke="#2563eb"></rect>
      <text x="360" y="95" fill="#1a2230" text-anchor="middle" font-size="11">relationship spans the retention period</text>
      <rect x="180" y="18" width="160" height="26" rx="8" fill="#eefaf1" stroke="#15803d"></rect>
      <text x="260" y="36" fill="#15803d" text-anchor="middle" font-size="10.5">AES-256 data encryption</text>
      <rect x="370" y="18" width="180" height="26" rx="8" fill="#fdeeee" stroke="#dc2626"></rect>
      <text x="460" y="36" fill="#dc2626" text-anchor="middle" font-size="10.5">RSA-2048 key wrapping</text>
    </svg>
