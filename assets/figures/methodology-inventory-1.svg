<svg width="720" height="250" viewBox="0 0 720 250" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="12"><title>Three source boxes, vendor CBOM, build CBOM and runtime or config scan, feeding a normalization step, then the cryptographic inventory, which feeds risk, compliance, migration and supply-chain uses</title><rect width="100%" height="100%" fill="#ffffff"/>
      <!-- sources -->
      <text x="95" y="30" fill="#5b6472" text-anchor="middle" font-size="11" font-family="monospace">SOURCES</text>
      <rect x="20" y="42" width="150" height="34" rx="8" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="95" y="63" fill="#1a2230" text-anchor="middle">Vendor CBOM</text>
      <rect x="20" y="88" width="150" height="34" rx="8" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="95" y="109" fill="#1a2230" text-anchor="middle">Build CBOM</text>
      <rect x="20" y="134" width="150" height="34" rx="8" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="95" y="155" fill="#1a2230" text-anchor="middle">Runtime / config scan</text>
      <!-- normalization -->
      <rect x="250" y="80" width="130" height="90" rx="10" fill="#ffffff" stroke="#2563eb"></rect>
      <text x="315" y="118" fill="#1a2230" text-anchor="middle" font-weight="600">Normalization</text>
      <text x="315" y="136" fill="#5b6472" text-anchor="middle" font-size="10.5">profiles + registry</text>
      <!-- inventory -->
      <rect x="450" y="80" width="150" height="90" rx="10" fill="#eefaf1" stroke="#15803d"></rect>
      <text x="525" y="112" fill="#14532d" text-anchor="middle" font-weight="700">Cryptographic</text>
      <text x="525" y="130" fill="#14532d" text-anchor="middle" font-weight="700">inventory</text>
      <text x="525" y="150" fill="#5b6472" text-anchor="middle" font-size="10.5">queryable, maintained</text>
      <!-- uses -->
      <text x="662" y="30" fill="#5b6472" text-anchor="middle" font-size="11" font-family="monospace">USES</text>
      <rect x="620" y="42" width="90" height="34" rx="8" fill="#f2f6fc" stroke="#c9d3e0"></rect>
      <text x="665" y="63" fill="#1a2230" text-anchor="middle" font-size="11">Risk</text>
      <rect x="620" y="88" width="90" height="34" rx="8" fill="#f2f6fc" stroke="#c9d3e0"></rect>
      <text x="665" y="109" fill="#1a2230" text-anchor="middle" font-size="11">Compliance</text>
      <rect x="620" y="134" width="90" height="34" rx="8" fill="#f2f6fc" stroke="#c9d3e0"></rect>
      <text x="665" y="155" fill="#1a2230" text-anchor="middle" font-size="11">Migration</text>
      <rect x="620" y="180" width="90" height="36" rx="8" fill="#f2f6fc" stroke="#c9d3e0"></rect>
      <text x="665" y="197" fill="#1a2230" text-anchor="middle" font-size="10">Supply-chain</text>
      <text x="665" y="209" fill="#1a2230" text-anchor="middle" font-size="10">request</text>
      <!-- arrows -->
      <g stroke="#2563eb" stroke-width="2" fill="none">
        <line x1="170" y1="59" x2="250" y2="110"></line><line x1="170" y1="105" x2="250" y2="120"></line><line x1="170" y1="151" x2="250" y2="132"></line>
        <line x1="380" y1="125" x2="450" y2="125"></line><polygon points="450,125 440,120 440,130" fill="#2563eb"></polygon>
        <line x1="600" y1="110" x2="620" y2="63"></line><line x1="600" y1="123" x2="620" y2="105"></line><line x1="600" y1="138" x2="620" y2="151"></line><line x1="600" y1="150" x2="620" y2="197"></line>
      </g>
    </svg>
