<svg width="720" height="210" viewBox="0 0 720 210" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="12"><title>A format-independent Profile box branching down to two panels, CycloneDX 1.7 and SPDX 3.0.1, each listing what that format supports for cryptographic data today</title><rect width="100%" height="100%" fill="#ffffff"/>
      <rect x="280" y="16" width="160" height="46" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"></rect>
      <text x="360" y="37" fill="#1a2230" text-anchor="middle" font-weight="700">Profile</text>
      <text x="360" y="53" fill="#5b6472" text-anchor="middle" font-size="10.5">format-independent</text>
      <line x1="330" y1="62" x2="190" y2="104" stroke="#c9d3e0" stroke-width="2"></line>
      <line x1="390" y1="62" x2="530" y2="104" stroke="#c9d3e0" stroke-width="2"></line>
      <rect x="40" y="104" width="300" height="90" rx="12" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="58" y="126" fill="#1a2230" font-weight="700">CycloneDX 1.7</text>
      <text x="58" y="146" fill="#15803d" font-size="11.5" font-family="monospace">✓ native crypto model (assets)</text>
      <text x="58" y="164" fill="#b45309" font-size="11.5" font-family="monospace">~ edge attrs in component.properties</text>
      <text x="58" y="182" fill="#5b6472" font-size="11.5" font-family="monospace">+ Cryptography Registry (1.7)</text>
      <rect x="400" y="104" width="280" height="90" rx="12" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="418" y="126" fill="#1a2230" font-weight="700">SPDX 3.0.1</text>
      <text x="418" y="146" fill="#b45309" font-size="11.5" font-family="monospace">~ crypto model in development</text>
      <text x="418" y="164" fill="#5b6472" font-size="11.5" font-family="monospace">→ link the CycloneDX CBOM today</text>
      <text x="418" y="182" fill="#15803d" font-size="11.5" font-family="monospace">✓ package identity via purl</text>
    </svg>
