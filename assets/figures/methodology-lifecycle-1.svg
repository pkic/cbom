<svg width="720" height="300" viewBox="0 0 720 300" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="12"><title>A left-to-right timeline of four lifecycle stages, Design, Build, Deploy and Runtime, each box giving the stage name, who produces it and the data source, with a bracket linking Build to Runtime</title><rect width="100%" height="100%" fill="#ffffff"/>
      <line x1="40" y1="60" x2="680" y2="60" stroke="#c9d3e0" stroke-width="2"></line>
      <g text-anchor="middle">
        <circle cx="120" cy="60" r="7" fill="#7c3aed"></circle>
        <text x="120" y="40" fill="#1a2230" font-weight="700">Design</text>
        <rect x="55" y="78" width="130" height="150" rx="10" fill="#ffffff" stroke="#e2e7ef"></rect>
        <text x="120" y="100" fill="#7c3aed" font-weight="700" font-family="monospace" font-size="11">intended</text>
        <text x="120" y="122" fill="#5b6472" font-size="11">planned crypto</text>
        <text x="120" y="150" fill="#39424f" font-size="10.5">who: architects</text>
        <text x="120" y="167" fill="#39424f" font-size="10.5">source: design docs,</text>
        <text x="120" y="181" fill="#39424f" font-size="10.5">threat models</text>
        <text x="120" y="206" fill="#5b6472" font-size="10">confidence: aspirational</text>
        <circle cx="290" cy="60" r="7" fill="#2563eb"></circle>
        <text x="290" y="40" fill="#1a2230" font-weight="700">Build</text>
        <rect x="225" y="78" width="130" height="150" rx="10" fill="#ffffff" stroke="#e2e7ef"></rect>
        <text x="290" y="100" fill="#2563eb" font-weight="700" font-family="monospace" font-size="11">implemented</text>
        <text x="290" y="122" fill="#5b6472" font-size="11">crypto in the binary</text>
        <text x="290" y="150" fill="#39424f" font-size="10.5">who: dev / build</text>
        <text x="290" y="167" fill="#39424f" font-size="10.5">source: source scan,</text>
        <text x="290" y="181" fill="#39424f" font-size="10.5">build pipeline</text>
        <text x="290" y="206" fill="#5b6472" font-size="10">confidence: capability</text>
        <circle cx="460" cy="60" r="7" fill="#0284c7"></circle>
        <text x="460" y="40" fill="#1a2230" font-weight="700">Deploy</text>
        <rect x="395" y="78" width="130" height="150" rx="10" fill="#ffffff" stroke="#e2e7ef"></rect>
        <text x="460" y="100" fill="#0284c7" font-weight="700" font-family="monospace" font-size="11">configured</text>
        <text x="460" y="122" fill="#5b6472" font-size="11">what deploy enables</text>
        <text x="460" y="150" fill="#39424f" font-size="10.5">who: integrator / ops</text>
        <text x="460" y="167" fill="#39424f" font-size="10.5">source: config files,</text>
        <text x="460" y="181" fill="#39424f" font-size="10.5">policy bundles</text>
        <text x="460" y="206" fill="#5b6472" font-size="10">confidence: intent-in-place</text>
        <circle cx="630" cy="60" r="7" fill="#15803d"></circle>
        <text x="630" y="40" fill="#1a2230" font-weight="700">Runtime</text>
        <rect x="565" y="78" width="130" height="150" rx="10" fill="#ffffff" stroke="#e2e7ef"></rect>
        <text x="630" y="100" fill="#15803d" font-weight="700" font-family="monospace" font-size="11">observed</text>
        <text x="630" y="122" fill="#5b6472" font-size="11">negotiated on the wire</text>
        <text x="630" y="150" fill="#39424f" font-size="10.5">who: ops / monitoring</text>
        <text x="630" y="167" fill="#39424f" font-size="10.5">source: TLS scan,</text>
        <text x="630" y="181" fill="#39424f" font-size="10.5">telemetry</text>
        <text x="630" y="206" fill="#5b6472" font-size="10">confidence: actuality</text>
      </g>
      <path d="M290 250 L290 262 L630 262 L630 250" fill="none" stroke="#b45309" stroke-width="1.5"></path>
      <text x="460" y="282" fill="#b45309" text-anchor="middle" font-size="11.5" font-weight="600">the readiness gap: capability ≠ what is actually running</text>
    </svg>
