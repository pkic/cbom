<svg width="720" height="210" viewBox="0 0 720 210" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="12"><title>Five stages: Scope, Content, Rules, Realisation, Proof, with a feedback loop from Proof back to Content</title><rect width="100%" height="100%" fill="#ffffff"/>
      <title>The five stages of defining a profile</title>
      <g>
        <rect x="10" y="52" width="126" height="62" rx="10" fill="#eef2f8" stroke="#c9d3e0"></rect>
        <text x="73" y="76" fill="#1a2230" text-anchor="middle" font-weight="600">1 · Scope</text>
        <text x="73" y="94" fill="#5b6472" text-anchor="middle" font-size="10.5">consumer, decision,</text>
        <text x="73" y="107" fill="#5b6472" text-anchor="middle" font-size="10.5">subject, boundary</text>

        <rect x="152" y="52" width="126" height="62" rx="10" fill="#ffffff" stroke="#1c5fd6"></rect>
        <text x="215" y="76" fill="#1a2230" text-anchor="middle" font-weight="600">2 · Content</text>
        <text x="215" y="94" fill="#5b6472" text-anchor="middle" font-size="10.5">questions, attributes,</text>
        <text x="215" y="107" fill="#5b6472" text-anchor="middle" font-size="10.5">facts and judgements</text>

        <rect x="294" y="52" width="126" height="62" rx="10" fill="#ffffff" stroke="#1c5fd6"></rect>
        <text x="357" y="76" fill="#1a2230" text-anchor="middle" font-weight="600">3 · Rules</text>
        <text x="357" y="94" fill="#5b6472" text-anchor="middle" font-size="10.5">levels, structure,</text>
        <text x="357" y="107" fill="#5b6472" text-anchor="middle" font-size="10.5">exclusions</text>

        <rect x="436" y="52" width="126" height="62" rx="10" fill="#ffffff" stroke="#1c5fd6"></rect>
        <text x="499" y="76" fill="#1a2230" text-anchor="middle" font-weight="600">4 · Realisation</text>
        <text x="499" y="94" fill="#5b6472" text-anchor="middle" font-size="10.5">mapping, versions,</text>
        <text x="499" y="107" fill="#5b6472" text-anchor="middle" font-size="10.5">decisions</text>

        <rect x="578" y="52" width="132" height="62" rx="10" fill="#eafaf1" stroke="#0f7a52"></rect>
        <text x="644" y="76" fill="#1a2230" text-anchor="middle" font-weight="600">5 · Proof</text>
        <text x="644" y="94" fill="#5b6472" text-anchor="middle" font-size="10.5">examples and</text>
        <text x="644" y="107" fill="#5b6472" text-anchor="middle" font-size="10.5">a running validator</text>
      </g>
      <g stroke="#1c5fd6" stroke-width="2" fill="none">
        <line x1="136" y1="83" x2="152" y2="83"></line><polygon points="152,83 143,78 143,88" fill="#1c5fd6"></polygon>
        <line x1="278" y1="83" x2="294" y2="83"></line><polygon points="294,83 285,78 285,88" fill="#1c5fd6"></polygon>
        <line x1="420" y1="83" x2="436" y2="83"></line><polygon points="436,83 427,78 427,88" fill="#1c5fd6"></polygon>
        <line x1="562" y1="83" x2="578" y2="83"></line><polygon points="578,83 569,78 569,88" fill="#1c5fd6"></polygon>
      </g>
      <path d="M644 114 L644 152 L215 152 L215 114" fill="none" stroke="#9a6300" stroke-width="2" stroke-dasharray="6 4"></path>
      <polygon points="215,114 210,124 220,124" fill="#9a6300"></polygon>
      <text x="430" y="170" fill="#9a6300" text-anchor="middle" font-size="11">building the examples usually sends you back to the attributes</text>
      <text x="430" y="190" fill="#5b6472" text-anchor="middle" font-size="11">the procedure is iterative; stage 5 is a test of stages 2 and 3, not a formality</text>
    </svg>
