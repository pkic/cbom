<svg width="720" height="205" viewBox="0 0 720 205" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="12"><title>Originator, gateway and service in a row, with a separate TLS relationship on each hop and a signature relationship bracketing the whole path from originator to service</title><rect width="100%" height="100%" fill="#ffffff"/>
      <rect x="16" y="76" width="150" height="50" rx="10" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="91" y="97" fill="#1a2230" text-anchor="middle" font-weight="600">Originator</text>
      <text x="91" y="113" fill="#5b6472" text-anchor="middle" font-size="10.5">signs the token</text>
      <rect x="285" y="76" width="150" height="50" rx="10" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="360" y="97" fill="#1a2230" text-anchor="middle" font-weight="600">Gateway</text>
      <text x="360" y="113" fill="#5b6472" text-anchor="middle" font-size="10.5">terminates TLS</text>
      <rect x="554" y="76" width="150" height="50" rx="10" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="629" y="97" fill="#1a2230" text-anchor="middle" font-weight="600">Service</text>
      <text x="629" y="113" fill="#5b6472" text-anchor="middle" font-size="10.5">verifies the token</text>
      <line x1="166" y1="101" x2="285" y2="101" stroke="#0284c7" stroke-width="2"></line>
      <line x1="435" y1="101" x2="554" y2="101" stroke="#0284c7" stroke-width="2"></line>
      <rect x="176" y="40" width="100" height="24" rx="12" fill="#e8f4fd" stroke="#0284c7"></rect>
      <text x="226" y="56" fill="#0284c7" text-anchor="middle" font-size="10.5">TLS relationship</text>
      <rect x="444" y="40" width="100" height="24" rx="12" fill="#e8f4fd" stroke="#0284c7"></rect>
      <text x="494" y="56" fill="#0284c7" text-anchor="middle" font-size="10.5">TLS relationship</text>
      <path d="M91 140 L91 158 L629 158 L629 140" fill="none" stroke="#7c3aed" stroke-width="2"></path>
      <rect x="250" y="146" width="220" height="26" rx="13" fill="#f5eeff" stroke="#7c3aed"></rect>
      <text x="360" y="163" fill="#7c3aed" text-anchor="middle" font-size="11">signature relationship, originator to service</text>
      <text x="360" y="192" fill="#5b6472" text-anchor="middle" font-size="11">three relationships, two layers, different endpoint pairs</text>
    </svg>
