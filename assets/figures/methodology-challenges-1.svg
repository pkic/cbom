<svg width="720" height="170" viewBox="0 0 720 170" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="13"><title>Two side-by-side panels: assets as nodes, covering algorithms, keys, certificates and protocols, marked as well modelled today, and relationships as edges, marked as having no first-class object</title><rect width="100%" height="100%" fill="#ffffff"/>
      <rect x="40" y="40" width="290" height="92" rx="12" fill="#eefaf1" stroke="#15803d"></rect>
      <text x="185" y="68" fill="#14532d" text-anchor="middle" font-weight="700">Assets (nodes)</text>
      <text x="185" y="90" fill="#39424f" text-anchor="middle" font-size="12">algorithms · keys · certificates · protocols</text>
      <text x="185" y="112" fill="#15803d" text-anchor="middle" font-size="12" font-family="monospace">✓ well modeled today</text>
      <rect x="390" y="40" width="290" height="92" rx="12" fill="#fdeeee" stroke="#dc2626"></rect>
      <text x="535" y="68" fill="#7f1d1d" text-anchor="middle" font-weight="700">Relationships (edges)</text>
      <text x="535" y="90" fill="#39424f" text-anchor="middle" font-size="12">where crypto is applied between parties</text>
      <text x="535" y="112" fill="#dc2626" text-anchor="middle" font-size="12" font-family="monospace">✗ no first-class object</text>
    </svg>
