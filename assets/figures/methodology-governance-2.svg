<svg width="720" height="210" viewBox="0 0 720 210" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="11.5"><title>Four arrangements side by side: a unified document holding software components and crypto assets, a standalone CBOM, a CBOM with an arrow to an SBOM, and an SBOM with an arrow to a CBOM</title><rect width="100%" height="100%" fill="#ffffff"/>
      <text x="88" y="18" fill="#5b6472" text-anchor="middle" font-size="11" font-family="monospace">A · UNIFIED</text>
      <rect x="16" y="30" width="144" height="104" rx="10" fill="#ffffff" stroke="#1c5fd6"></rect>
      <rect x="30" y="46" width="116" height="34" rx="7" fill="#eaf1fe" stroke="#c9d3e0"></rect>
      <text x="88" y="67" fill="#1a2230" text-anchor="middle">software components</text>
      <rect x="30" y="88" width="116" height="34" rx="7" fill="#eafaf1" stroke="#c9d3e0"></rect>
      <text x="88" y="109" fill="#1a2230" text-anchor="middle">crypto assets</text>
      <text x="88" y="152" fill="#5b6472" text-anchor="middle">one document</text>
      <text x="88" y="168" fill="#5b6472" text-anchor="middle">one signature</text>

      <text x="264" y="18" fill="#5b6472" text-anchor="middle" font-size="11" font-family="monospace">B · STANDALONE</text>
      <rect x="192" y="30" width="144" height="104" rx="10" fill="#ffffff" stroke="#9a6300"></rect>
      <rect x="206" y="67" width="116" height="34" rx="7" fill="#eafaf1" stroke="#c9d3e0"></rect>
      <text x="264" y="88" fill="#1a2230" text-anchor="middle">crypto assets only</text>
      <text x="264" y="152" fill="#9a6300" text-anchor="middle">no component context</text>
      <text x="264" y="168" fill="#5b6472" text-anchor="middle">self-contained</text>

      <text x="440" y="18" fill="#5b6472" text-anchor="middle" font-size="11" font-family="monospace">C · CBOM → SBOM</text>
      <rect x="368" y="30" width="144" height="46" rx="10" fill="#eafaf1" stroke="#0f7a52"></rect>
      <text x="440" y="58" fill="#1a2230" text-anchor="middle">CBOM</text>
      <rect x="368" y="100" width="144" height="46" rx="10" fill="#eaf1fe" stroke="#1c5fd6"></rect>
      <text x="440" y="128" fill="#1a2230" text-anchor="middle">SBOM</text>
      <line x1="440" y1="76" x2="440" y2="100" stroke="#0f7a52" stroke-width="2"></line>
      <polygon points="440,100 435,90 445,90" fill="#0f7a52"></polygon>
      <text x="440" y="168" fill="#5b6472" text-anchor="middle">crypto is primary</text>

      <text x="616" y="18" fill="#5b6472" text-anchor="middle" font-size="11" font-family="monospace">D · SBOM → CBOM</text>
      <rect x="544" y="30" width="144" height="46" rx="10" fill="#eaf1fe" stroke="#1c5fd6"></rect>
      <text x="616" y="58" fill="#1a2230" text-anchor="middle">SBOM</text>
      <rect x="544" y="100" width="144" height="46" rx="10" fill="#eafaf1" stroke="#0f7a52"></rect>
      <text x="616" y="128" fill="#1a2230" text-anchor="middle">CBOM</text>
      <line x1="616" y1="76" x2="616" y2="100" stroke="#1c5fd6" stroke-width="2"></line>
      <polygon points="616,100 611,90 621,90" fill="#1c5fd6"></polygon>
      <text x="616" y="168" fill="#5b6472" text-anchor="middle">software is primary</text>

      <text x="360" y="198" fill="#5b6472" text-anchor="middle" font-size="11">the arrow shows which document holds the reference, and therefore which one a consumer fetches first</text>
    </svg>
