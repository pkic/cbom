<svg width="720" height="180" viewBox="0 0 720 180" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="12"><title>An application box linked to an HSM or TEE holding a private key that never leaves it, the two-way link labelled custody relationship carrying sign and unwrap requests</title><rect width="100%" height="100%" fill="#ffffff"/>
      <rect x="40" y="56" width="180" height="70" rx="12" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="130" y="82" fill="#1a2230" text-anchor="middle" font-weight="600">Application</text>
      <text x="130" y="101" fill="#5b6472" text-anchor="middle" font-size="10.5">requests operations</text>
      <rect x="500" y="46" width="180" height="90" rx="12" fill="#f5eeff" stroke="#7c3aed"></rect>
      <text x="590" y="72" fill="#1a2230" text-anchor="middle" font-weight="600">HSM or TEE</text>
      <rect x="536" y="84" width="108" height="34" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-dasharray="4 3"></rect>
      <text x="590" y="99" fill="#7c3aed" text-anchor="middle" font-size="10.5">private key</text>
      <text x="590" y="112" fill="#5b6472" text-anchor="middle" font-size="9.5">never leaves</text>
      <line x1="220" y1="91" x2="500" y2="91" stroke="#2563eb" stroke-width="2"></line>
      <polygon points="500,91 490,86 490,96" fill="#2563eb"></polygon>
      <polygon points="220,91 230,86 230,96" fill="#2563eb"></polygon>
      <rect x="272" y="73" width="176" height="36" rx="18" fill="#ffffff" stroke="#2563eb"></rect>
      <text x="360" y="90" fill="#1a2230" text-anchor="middle" font-size="11">custody relationship</text>
      <text x="360" y="103" fill="#5b6472" text-anchor="middle" font-size="10">sign and unwrap requests</text>
      <text x="360" y="152" fill="#5b6472" text-anchor="middle" font-size="11">algorithm support here is a hardware property, so migration may mean replacement</text>
    </svg>
