<svg width="720" height="310" viewBox="0 0 720 310" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="11.5"><title>Keycloak interfaces by layer. OIDC token issuance, SAML assertions and the Admin API ride on HTTPS on port 8443, which rides on the TLS interface tls-https. Health and metrics ride on HTTPS on port 9000 over the TLS interface tls-mgmt. Brokered token verification rides on outbound HTTPS over the TLS interface int-broker. Plain HTTP on port 8080 rides on nothing.</title><rect width="100%" height="100%" fill="#ffffff"/>
      <text x="120" y="22" fill="#5b6472" text-anchor="middle" font-weight="600">application layer</text>
      <text x="360" y="22" fill="#5b6472" text-anchor="middle" font-weight="600">carried by</text>
      <text x="600" y="22" fill="#5b6472" text-anchor="middle" font-weight="600">transport</text>
      <g stroke-width="1.6">
        <rect x="20" y="38" width="200" height="28" rx="6" fill="#e0f2fe" stroke="#0284c7"></rect>
        <rect x="20" y="74" width="200" height="28" rx="6" fill="#e0f2fe" stroke="#0284c7"></rect>
        <rect x="20" y="110" width="200" height="28" rx="6" fill="#ede9fe" stroke="#6d28d9"></rect>
        <rect x="290" y="38" width="140" height="100" rx="6" fill="#f3f4f6" stroke="#8a94a1" stroke-dasharray="4 3"></rect>
        <rect x="500" y="38" width="200" height="100" rx="6" fill="#e0f2fe" stroke="#0284c7"></rect>
        <rect x="20" y="158" width="200" height="28" rx="6" fill="#f3f4f6" stroke="#8a94a1" stroke-dasharray="4 3"></rect>
        <rect x="290" y="158" width="140" height="28" rx="6" fill="#f3f4f6" stroke="#8a94a1" stroke-dasharray="4 3"></rect>
        <rect x="500" y="158" width="200" height="28" rx="6" fill="#ede9fe" stroke="#6d28d9"></rect>
        <rect x="20" y="202" width="200" height="28" rx="6" fill="#dcfce7" stroke="#0f7a52"></rect>
        <rect x="290" y="202" width="140" height="28" rx="6" fill="#f3f4f6" stroke="#8a94a1" stroke-dasharray="4 3"></rect>
        <rect x="500" y="202" width="200" height="28" rx="6" fill="#dcfce7" stroke="#0f7a52"></rect>
        <rect x="20" y="246" width="200" height="28" rx="6" fill="#e0f2fe" stroke="#0284c7"></rect>
      </g>
      <g stroke="#5b6472" stroke-width="1.3">
        <line x1="220" y1="52" x2="290" y2="72"></line><line x1="220" y1="88" x2="290" y2="88"></line><line x1="220" y1="124" x2="290" y2="104"></line>
        <line x1="430" y1="88" x2="500" y2="88"></line>
        <line x1="220" y1="172" x2="290" y2="172"></line><line x1="430" y1="172" x2="500" y2="172"></line>
        <line x1="220" y1="216" x2="290" y2="216"></line><line x1="430" y1="216" x2="500" y2="216"></line>
      </g>
      <line x1="220" y1="260" x2="500" y2="260" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="5 4"></line>
      <g fill="#1a2230">
        <text x="30" y="56">OIDC token issuance · <tspan font-family="monospace" font-size="10.5">svc-oidc</tspan></text>
        <text x="30" y="92">SAML assertions · <tspan font-family="monospace" font-size="10.5">svc-saml</tspan></text>
        <text x="30" y="128">Admin API · <tspan font-family="monospace" font-size="10.5">mgmt-admin</tspan></text>
        <text x="360" y="84" text-anchor="middle">HTTPS</text>
        <text x="360" y="100" text-anchor="middle" fill="#5b6472">port 8443</text>
        <text x="600" y="84" text-anchor="middle">TLS 1.2 / 1.3</text>
        <text x="600" y="100" text-anchor="middle" font-family="monospace" font-size="10.5">tls-https</text>
        <text x="30" y="176" fill="#5b6472">Health and metrics</text>
        <text x="360" y="176" text-anchor="middle" fill="#5b6472">HTTPS · port 9000</text>
        <text x="510" y="176">TLS · <tspan font-family="monospace" font-size="10.5">tls-mgmt</tspan></text>
        <text x="30" y="220">Brokered token verification</text>
        <text x="360" y="220" text-anchor="middle" fill="#5b6472">HTTPS · outbound</text>
        <text x="510" y="220">TLS · <tspan font-family="monospace" font-size="10.5">int-broker</tspan></text>
        <text x="30" y="264">Plain HTTP · port 8080 · <tspan font-family="monospace" font-size="10.5">svc-http</tspan></text>
        <text x="510" y="264" fill="#b91c1c">no transport protection</text>
      </g>
      <text x="360" y="296" fill="#5b6472" text-anchor="middle" font-size="10.5">Solid boxes are interfaces. Dashed grey boxes are declared only to show what carries what. JDBC, LDAP, SMTP and JGroups ride their own TLS interfaces in the same way.</text>
    </svg>
