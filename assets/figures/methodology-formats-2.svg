<svg width="720" height="300" viewBox="0 0 720 300" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="12"><title>One fact in two CycloneDX encodings side by side, X25519 reached through a cipher suite and X25519 in a flat reference list, converging on a single canonical location</title><rect width="100%" height="100%" fill="#ffffff"/>
      <text x="20" y="20" fill="#5b6472" font-size="11" font-family="monospace">FACT: the HTTPS interface uses X25519 for key exchange</text>
      <rect x="20" y="34" width="320" height="120" rx="10" fill="#ffffff" stroke="#0284c7"></rect>
      <text x="36" y="54" fill="#0284c7" font-size="11" font-weight="700" font-family="monospace">ENCODING A — inside the cipher suite</text>
      <text x="36" y="76" fill="#1f2937" font-size="10.5" font-family="monospace">protocolProperties:</text>
      <text x="36" y="92" fill="#1f2937" font-size="10.5" font-family="monospace">  cipherSuites:</text>
      <text x="36" y="108" fill="#1f2937" font-size="10.5" font-family="monospace">  - name: TLS_AES_256_GCM_SHA384</text>
      <text x="36" y="124" fill="#15803d" font-size="10.5" font-family="monospace">    algorithms: [crypto:algo:x25519]</text>
      <text x="36" y="144" fill="#5b6472" font-size="10">the algorithm is reached through the suite</text>
      <rect x="380" y="34" width="320" height="120" rx="10" fill="#ffffff" stroke="#7c3aed"></rect>
      <text x="396" y="54" fill="#7c3aed" font-size="11" font-weight="700" font-family="monospace">ENCODING B — flat reference list</text>
      <text x="396" y="76" fill="#1f2937" font-size="10.5" font-family="monospace">protocolProperties:</text>
      <text x="396" y="92" fill="#1f2937" font-size="10.5" font-family="monospace">  cryptoRefArray:</text>
      <text x="396" y="108" fill="#15803d" font-size="10.5" font-family="monospace">  - crypto:algo:x25519</text>
      <text x="396" y="124" fill="#1f2937" font-size="10.5" font-family="monospace">  - crypto:algo:aes-256-gcm</text>
      <text x="396" y="144" fill="#5b6472" font-size="10">the algorithm is referenced directly</text>
      <line x1="180" y1="154" x2="300" y2="196" stroke="#c9d3e0" stroke-width="2"></line>
      <line x1="540" y1="154" x2="420" y2="196" stroke="#c9d3e0" stroke-width="2"></line>
      <rect x="230" y="196" width="260" height="42" rx="10" fill="#eef2f8" stroke="#c9d3e0"></rect>
      <text x="360" y="222" fill="#1a2230" text-anchor="middle" font-weight="600">Same fact, two locations</text>
      <rect x="150" y="252" width="420" height="36" rx="10" fill="#fff7ec" stroke="#b45309"></rect>
      <text x="360" y="268" fill="#6b4a12" text-anchor="middle" font-size="11">A consumer must read both, or the mapping must name one</text>
      <text x="360" y="282" fill="#6b4a12" text-anchor="middle" font-size="10.5">the profile mapping selects the canonical location</text>
    </svg>
