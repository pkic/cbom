<svg width="720" height="350" viewBox="0 0 720 350" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial" font-size="11"><title>A dark box labelled Keycloak 26.7.3, container image, internals not disclosed. On its left edge, six inbound interfaces: TLS on the main listener, OIDC token issuance, SAML assertions and plain HTTP, all of type service, and the Admin API and TLS on the management port, of type management. On its right edge, five outbound interconnect interfaces: TLS to the database, the directory, external identity providers and the mail server, and brokered token verification. On its bottom edge, the cluster transport of type peer and the realm key store of type storage.</title><rect width="100%" height="100%" fill="#ffffff"/>
      <text x="360" y="24" fill="#1a2230" text-anchor="middle" font-weight="600" font-size="12">the profile describes the boundary, not the box</text>

      <rect x="250" y="44" width="220" height="214" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"></rect>
      <text x="360" y="136" fill="#1a2230" text-anchor="middle" font-weight="700" font-size="15">Keycloak 26.7.3</text>
      <text x="360" y="156" fill="#475569" text-anchor="middle" font-size="11">container image</text>
      <text x="360" y="176" fill="#64748b" text-anchor="middle" font-size="10.5">internals not disclosed</text>
      <text x="360" y="191" fill="#64748b" text-anchor="middle" font-size="10.5">and not required</text>

      <!-- inbound, left edge -->
      <rect x="240" y="56" width="20" height="18" rx="4" fill="#0284c7"></rect>
      <rect x="240" y="84" width="20" height="18" rx="4" fill="#0284c7"></rect>
      <rect x="240" y="112" width="20" height="18" rx="4" fill="#0284c7"></rect>
      <rect x="240" y="140" width="20" height="18" rx="4" fill="#0284c7" stroke="#b91c1c" stroke-width="2"></rect>
      <rect x="240" y="180" width="20" height="18" rx="4" fill="#6d28d9"></rect>
      <rect x="240" y="208" width="20" height="18" rx="4" fill="#6d28d9"></rect>
      <g fill="#1a2230" text-anchor="end">
        <text x="232" y="69">TLS, main listener (tls-https)</text>
        <text x="232" y="97">OIDC token issuance (svc-oidc)</text>
        <text x="232" y="125">SAML assertions (svc-saml)</text>
        <text x="232" y="153">plain HTTP, no protection (svc-http)</text>
        <text x="232" y="193">Admin API and realm keys (mgmt-admin)</text>
        <text x="232" y="221">TLS, health and metrics (tls-mgmt)</text>
      </g>

      <!-- outbound, right edge -->
      <rect x="460" y="62" width="20" height="18" rx="4" fill="#0f7a52"></rect>
      <rect x="460" y="94" width="20" height="18" rx="4" fill="#0f7a52"></rect>
      <rect x="460" y="126" width="20" height="18" rx="4" fill="#0f7a52"></rect>
      <rect x="460" y="158" width="20" height="18" rx="4" fill="#0f7a52"></rect>
      <rect x="460" y="190" width="20" height="18" rx="4" fill="#0f7a52"></rect>
      <g fill="#1a2230">
        <text x="488" y="75">TLS to the database (int-db)</text>
        <text x="488" y="107">TLS to the directory (int-ldap)</text>
        <text x="488" y="139">TLS to identity providers (int-broker)</text>
        <text x="488" y="171">token verification (svc-broker-tokens)</text>
        <text x="488" y="203">TLS to the mail server (int-smtp)</text>
      </g>

      <!-- bottom edge -->
      <rect x="280" y="248" width="20" height="18" rx="4" fill="#b45309"></rect>
      <rect x="420" y="248" width="20" height="18" rx="4" fill="#475569"></rect>
      <g fill="#1a2230" text-anchor="middle">
        <text x="290" y="284">cluster transport</text>
        <text x="290" y="298" font-family="monospace" font-size="10">int-cache</text>
        <text x="430" y="284">realm keys, unwrapped</text>
        <text x="430" y="298" font-family="monospace" font-size="10">sto-realm-keys</text>
      </g>

      <!-- legend -->
      <g font-size="10.5" fill="#5b6472">
        <rect x="70" y="318" width="12" height="11" rx="2" fill="#0284c7"></rect><text x="87" y="327">service</text>
        <rect x="150" y="318" width="12" height="11" rx="2" fill="#6d28d9"></rect><text x="167" y="327">management</text>
        <rect x="255" y="318" width="12" height="11" rx="2" fill="#0f7a52"></rect><text x="272" y="327">interconnect</text>
        <rect x="360" y="318" width="12" height="11" rx="2" fill="#b45309"></rect><text x="377" y="327">peer</text>
        <rect x="420" y="318" width="12" height="11" rx="2" fill="#475569"></rect><text x="437" y="327">storage</text>
        <rect x="500" y="318" width="12" height="11" rx="2" fill="#0284c7" stroke="#b91c1c" stroke-width="2"></rect><text x="517" y="327">no cryptography</text>
      </g>
    </svg>
