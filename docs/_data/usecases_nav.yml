# Navigation for the Use Cases section.
#
# Same arrangement as _data/methodology_nav.yml and rendered the same way, by
# _includes/usecases-nav.html. 'id' must match the 'nav:' value in the target
# page's front matter. Ids here are prefixed 'uc-' so that a page in this
# section can never be marked current by the methodology's rail, or the
# reverse.
#
# The second group points back into the methodology and is navigation only:
# those pages belong to the other section and are not part of this section's
# reading order. Nothing here is read by tools/renumber-pagenav.py, which
# manages the methodology's footer links only — this section has few enough
# pages that its previous/next links are written by hand.
#
# Groups follow draft decision 0023: each group opens with its group page, then
# its worked use cases. Adding a worked use case means adding one line to its
# group, and linking it from the register on index.html and from its group page.
# The Template has a group of its own: it is the blank the others are copied
# from, not a use case.

- group: Use cases
  items:
    - { id: uc-index,       title: Overview,              url: index.html }

- group: Disclosure
  items:
    - { id: uc-disclosure,  title: The group,             url: disclosure.html }
    - { id: uc-procurement, title: Procurement,           url: procurement.html }

- group: Change planning
  items:
    - { id: uc-change,      title: The group,             url: change-planning.html }
    - { id: uc-pqc,         title: PQC Migration,         url: pqc-migration.html }
    - { id: uc-iot,         title: IoT Device Estate,     url: iot.html }
    - { id: uc-substation,  title: Substation Automation (OT), url: substation.html }

- group: Writing one
  items:
    - { id: uc-proposing,   title: Proposing a Use Case,  url: proposing.html }
    - { id: uc-template,    title: Template,              url: template.html }

- group: In the methodology
  items:
    - { id: uc-purposes,  title: Starting from a Use Case, url: ../methodology/use-cases.html }
    - { id: uc-method,    title: Method,             url: ../methodology/method.html }
    - { id: uc-profile,   title: Profile,            url: ../methodology/profile.html }
    - { id: uc-terms,     title: Terms,              url: ../methodology/terms.html }
