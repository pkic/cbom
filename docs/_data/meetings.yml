  - number: 2
    date: 2026-07-22
    time: "18:00"
    timezone: Europe/Zurich
    duration: 60
    title: Rolling CBOMs, tool diversity and what a profile is for
    agenda:
      - Access to the draft document, and whether the files it references are public
      - "Rolling CBOMs — a continuously updated inventory, and discovering assets kept in non-default locations"
      - An inventory of discovery tools, and the inconsistent output between them
      - Standardising CBOM fields and naming, and the CycloneDX cryptography registry
      - "What a profile is for — required fields and validation rules — and how CBOMs relate to SBOMs"
      - Enterprise and vendor use cases, and identifying high-value assets for migration
    summary: >-
      A profile defines the fields a CBOM must carry and the rules it is validated against; it
      does not generate data, and it has to serve enterprise production environments as well as
      vendors, across hardware and software. Tools produce CBOMs with different formats and
      naming, so members will compile an inventory of discovery tools and look at standardising
      or mapping their output. Whether high-value assets can be identified automatically or need
      manual review was left open, with profiles expected to carry the fields that analysis needs.

  - number: 1
    date: 2026-07-15
    time: "09:00"
    timezone: Europe/Zurich
    duration: 60
    title: Introductions, and the case for CBOM profiles
    agenda:
      - Introductions, and members' backgrounds and interests
      - "Lessons from SBOMs — minimum elements that depend on purpose, sensitive content, and inconsistency between formats"
      - "The CBOM profile concept — minimum data per use case, industry profiles, quality gates, and mappings to CycloneDX and SPDX"
      - Whether data inventory and context belong in a CBOM
      - Guidance for existing standards rather than new ones, and how cryptography is represented in CycloneDX
      - Timeline, milestones and meeting cadence
    summary: >-
      The group will not create new standards. It will define industry-neutral profiles stating
      the minimum data a use case needs, mapped to CycloneDX and SPDX so that CBOMs can be
      quality-checked and automated, and industries are encouraged to write their own. The
      December workshop at the PKI Consortium conference in Amsterdam is the first milestone,
      with a basic example profile and a proposed timeline to be prepared.
