    title: Position paper chapters, lifecycle stages and BOM relationships
    agenda:
      - Collecting questions and feedback into information pages, and a position paper on CBOMs
      - An end-to-end CBOM use case demonstration for the PKI Consortium conference workshop
      - "CBOM lifecycle stages — design, build, deploy and runtime — and data quality and false positives"
      - How CBOMs relate to other BOM types, and unified data models mapped to CycloneDX and SPDX
