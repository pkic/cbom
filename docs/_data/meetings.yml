      - How adoption will work, and what makes an aspect ready for it
      - Any other business

  - number: 6
    date: 2026-08-19
    time: "18:00"
    timezone: Europe/Zurich
    duration: 60
    title: Standards evolution, use cases and governance
    recording_members_only: true
    agenda:
      - Welcome, and introductions from new participants
      - "CBOM standards evolution — CycloneDX 2.0, cryptography support in SPDX, and industry work with ANSI X9 and PQFF"
      - Aligning profiles with use cases, and a registry of industry organisations working on CBOM
      - "Governance, policy and tooling — rule enforcement and exceptions, signing rules files, composite CBOMs, and verification tooling"
      - "Use cases from energy, financial services and autonomous vehicles, and an empirical study of diversity between CBOMs"
      - "Methodology and documentation — chapter structure, tracking suggestions as GitHub issues, and a prototype profile-selection tool"
      - How CBOMs relate to SBOMs, AI BOMs and inventory
      - The CBOM life cycle, and anchoring profiles in a defined purpose
      - Open forum for questions
    summary: >-
      The group's role is to orchestrate requirements at the business level and map them to
      existing standards rather than create new ones, with profiles anchored in defined use
      cases. Suggestions from meetings will be tracked as GitHub issues, a registry of industry
      organisations working on CBOM will be started, and members will contribute use cases from
      energy, financial services and autonomous vehicles, including a grid operator's PKI
      migration as a test case for the methodology. A prototype profile-selection tool and a
      demonstration of an authenticity layer were proposed for future meetings.

