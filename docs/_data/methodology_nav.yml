# Navigation for the methodology section.
#
# This file is the single source of truth. Adding a section means adding one
# line here; every page picks it up through _includes/methodology-nav.html.
# Before this existed the navigation was copied into each page, so adding one
# section meant editing twenty files.
#
# 'id' must match the 'nav:' value in the target page's front matter, which is
# how the current page is marked. 'url' is relative, since every page in this
# section sits in the same directory.
#
# Order is also the reading order used by the previous and next links at the
# foot of each page. Changing the order here does not change those links; they
# are per-page and would need updating to match.

