    - { id: profile,      title: 6 · Profiles and rules, url: profile.html }
    - { id: maturity,     title: 8 · Depth families, url: maturity.html }
    - { id: conformance,  title: 9 · Conformance,   url: conformance.html }
    - { id: policyeval,   title: 10 · Policy evaluation, url: policy-evaluation.html }
    - { id: vulns,        title: 10 · Vulnerabilities, url: vulnerabilities.html }
    - { id: confidentiality, title: 11 · Confidentiality, url: confidentiality.html }
    - { id: dataexp,      title: 11 · Data exposure, url: data-exposure.html }
    - { id: context,      title: 12 · Context pointers, url: context.html }

- group: Publication 3 · Applying the methodology
  items:
    - { id: method,       title: 13 · Writing a profile, url: method.html }
    - { id: usecases,     title: 13 · Starting from a use case, url: use-cases.html }
