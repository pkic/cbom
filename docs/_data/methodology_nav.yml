# Navigation for the methodology section.
#
# This file is the single source of truth. Adding a section means adding one
# line here; every page picks it up through _includes/methodology-nav.html.
# Before this existed the navigation was copied into each page, so adding one
# section meant editing twenty files.
#
# 'id' must match the 'nav:' value in the target page's front matter, which is
# how the current page is marked. 'url' is relative, since every page in this
# section sits in the same directory.
#
# Order is also the reading order used by the previous and next links at the
# foot of each page. The two are kept in step by tools/renumber-pagenav.py,
# which rewrites every page's footer links from this file. Run it after any
# change to the order below.
#
# This order is a READING order, for someone meeting the material for the
# first time. It is deliberately not the clause order of the numbered draft,
# where Scope, Terms and Conformance appear early because a normative document
# has to be self-contained. Concrete before abstract here; self-contained
# there. See docs/methodology/index.html.

- group: Start here
  items:
    - { id: introduction, title: Introduction,      url: introduction.html }
    - { id: index,        title: Overview,          url: index.html }
    - { id: demo,         title: Demo,              url: demo.html }
    - { id: usecases,     title: Use Cases,         url: use-cases.html }

- group: Background
  items:
    - { id: challenges,   title: Challenges,        url: challenges.html }
    - { id: inventory,    title: Inventory,         url: inventory.html }
    - { id: lifecycle,    title: Lifecycle Data,    url: lifecycle.html }

- group: Concepts
  items:
    - { id: model,        title: Model,             url: model.html }
    - { id: objects,      title: Objects,           url: objects.html }
    - { id: profile,      title: Profile,           url: profile.html }
    - { id: conformance,  title: Conformance,       url: conformance.html }
    - { id: maturity,     title: Maturity,          url: maturity.html }
    - { id: confidentiality, title: Confidentiality, url: confidentiality.html }
    - { id: policyeval,   title: Policy Evaluation, url: policy-evaluation.html }
    - { id: vulns,        title: Vulnerabilities,   url: vulnerabilities.html }

- group: Applying it
  items:
    - { id: method,       title: Method,            url: method.html }
    - { id: formats,      title: Formats,           url: formats.html }
    - { id: dataexp,      title: Data Exposure,     url: data-exposure.html }

- group: Operations
  items:
    - { id: versioning,   title: Versioning,        url: versioning.html }
    - { id: governance,   title: Governance,        url: governance.html }

- group: Reference
  items:
    - { id: terms,        title: Terms,             url: terms.html }
    - { id: related,      title: Related Work,      url: related-work.html }
    - { id: files,        title: Files,             url: files.html }
    - { id: references,   title: References,        url: ../references/ }

# A pointer out of the section, kept last so that no page's previous or next
# link lands on it: tools/renumber-pagenav.py skips entries whose url is not a
# local .html page, and the page before a skipped entry keeps the neighbour it
# had. Worked use cases live in their own section; see use-cases/index.html for
# why.
- group: Other sections
  items:
    - { id: ucsection,    title: Worked use cases,  url: ../use-cases/ }
