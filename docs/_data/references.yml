  - id: M10
    doc: PQCMM v1.0.1
    title: PQC Maturity Model
    org: PKI Consortium (Post-Quantum Cryptography Working Group)
    category: methodology
    jurisdiction: global
    status: current
    url: https://pkic.org/wg/pqc/pqcmm/
    tags: [pkic, maturity, cbom, inventory]
    notes: >-
      Assesses products and services in the supply chain rather than an organisation's
      internal posture, which makes its subject the same as this methodology's. Level 3
      requires a cryptographic inventory and SBOM support; Level 4 requires CBOM support
      without defining what a CBOM must contain, and names no format. That undefined
      requirement is the dependency the profile methodology addresses.

  - id: M11
    doc: PQCCM
    title: PQC Capabilities Matrix
    org: PKI Consortium (Post-Quantum Cryptography Working Group)
    category: methodology
    jurisdiction: global
    status: current
    url: https://pkic.org/wg/pqc/pqccm/
    tags: [pkic, capabilities]
    verify: true
    notes: >-
      Aggregates vendor-declared post-quantum capability across products, recording support
      for ML-KEM, ML-DSA, SLH-DSA, LMS and XMSS as available, planned, unavailable or not
      applicable. Its subject overlaps the migration profile's declared capability
      attributes. No version or release date is published for the matrix itself.

  - id: M12
    doc: PKIMM v1.0.0
    title: PKI Maturity Model
    org: PKI Consortium (PKI Maturity Model Working Group)
    category: methodology
    jurisdiction: global
    status: current
    url: https://pkic.org/wg/pkimm/
    tags: [pkic, maturity]
    notes: >-
      Assesses an organisation's PKI operation across five levels, with a separate PQC
      Readiness Extension. Its subject is the operator rather than the product, so it sits at
      a different level from both the PQCMM [M10] and this methodology.

  - id: M13
    doc: FS-ISAC PQC Working Group
    title: >-
      Post-Quantum Cryptography Working Group papers, including Infrastructure Inventory and
      Building Cryptographic Agility in the Financial Sector
    org: FS-ISAC
    category: methodology
    jurisdiction: global
    status: current
    url: https://www.fsisac.com/knowledge/pqc
    tags: [finance, inventory, sector-profile, agility]
