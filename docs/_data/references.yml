    doc: CycloneDX CBOM
    title: Cryptography Bill of Materials (CBOM) capability
    org: OWASP CycloneDX
    category: formats
    jurisdiction: global
    status: current
    url: https://cyclonedx.org/capabilities/cbom/
    tags: [cyclonedx, cbom]

