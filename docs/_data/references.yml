      competing specification. Individual papers are undated on the landing page; take dates
      from each paper before citing.

  - id: M14
    doc: PCI DSS v4.0.1, requirement 12.3.3
    title: Payment Card Industry Data Security Standard
    org: PCI Security Standards Council
    category: methodology
    jurisdiction: global
    status: current
    url: https://www.pcisecuritystandards.org/document_library/
    tags: [finance, inventory, compliance]
    verify: true
    notes: >-
      Requirement 12.3.3 obliges an entity to document an inventory of the cryptographic
      cipher suites and protocols in use, with where and why each is used, and to review it
      at least every twelve months; it became mandatory on 31 March 2025. A binding
      commercial inventory mandate that names no format. Confirm the requirement text and the
      current DSS revision against the PCI SSC library before citing.

  - id: M15
    doc: ETSI TR 103 619 V1.1.1
    title: CYBER; Migration strategies and recommendations to Quantum Safe schemes
    org: ETSI
    date: 2020-07
    category: methodology
    jurisdiction: global
    status: current
    url: https://www.etsi.org/deliver/etsi_tr/103600_103699/103619/01.01.01_60/tr_103619v010101p.pdf
    tags: [etsi, inventory, migration]
    notes: >-
      Frames the move to a fully quantum-safe state in three stages, of which the first is
      compiling an inventory of cryptographic assets. The earliest inventory-first migration
      framework this register carries, predating the national roadmaps by several years, and
      it names no format.

