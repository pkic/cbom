    org: OWASP CycloneDX
    category: formats
    jurisdiction: global
    status: current
    url: https://cyclonedx.org/guides/OWASP_CycloneDX-Authoritative-Guide-to-CBOM-en.pdf
    tags: [cyclonedx, cbom, guide]

  - id: F6
    doc: SPDX 3.0.1
    title: SPDX Specification
    org: Linux Foundation
    category: formats
    jurisdiction: global
    status: draft
    url: https://spdx.dev/
    tags: [spdx]
    verify: true
    notes: >-
      No dedicated cryptographic-asset object model equivalent to CycloneDX CBOM in the
      released 3.0.1 line. Work has since become concrete: an SPDX Cryptography Group now
