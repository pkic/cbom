    date: 1997-03
    category: formats
    jurisdiction: global
    status: current
    url: https://www.rfc-editor.org/rfc/rfc8174
    tags: [ietf, conformance]
    notes: Normative keyword vocabulary for profile conformance language.

  - id: F9
    doc: SPDX Cryptographic Algorithm List
    title: SPDX Cryptographic Algorithm List
    org: SPDX Cryptography Group (Linux Foundation)
    category: formats
    jurisdiction: global
    status: draft
    url: https://github.com/spdx/cryptographic-algorithm-list
    tags: [spdx, registry, normalisation]
    verify: true
    notes: >-
      A community-curated vocabulary of cryptographic algorithms, modelled on the SPDX
      License List and maintained alongside the specification rather than inside it. It is
      the SPDX-side counterpart to the CycloneDX Cryptography Registry [F3], and therefore
      the normalisation target an SPDX mapping would have to use. No numbered release; its
      normative standing within SPDX is not established. Confirm both before citing.

