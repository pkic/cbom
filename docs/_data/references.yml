    tags: [nist, agility]
    verify: true
    notes: >-
      The reference OMB M-26-15 [U15] cites for cryptographic agility. Relevant because
      agility is a judgement formed from disclosed facts rather than an attribute a CBOM
      records, which is the separation decision 0002 rests on. An updated revision (upd1)
      exists; confirm which revision and date apply before citing.

  - id: U17
    doc: NTIA minimum elements (2021)
    title: The Minimum Elements For a Software Bill of Materials (SBOM)
    org: National Telecommunications and Information Administration (United States)
    date: 2021-07
    category: policy
    jurisdiction: us
    status: superseded
    url: https://www.ntia.gov/report/2021/minimum-elements-software-bill-materials-sbom
    tags: [sbom, minimum-elements]
    notes: >-
      Issued under EO 14028 [U4] and the origin of the seven baseline SBOM data fields.
      Updated and replaced by the 2026 minimum elements [X1]. Retained because procurement
      language and existing tooling still cite it by name.

  # -------------------------------------------------- policy — Asia-Pacific
  - id: A1
    doc: CERT-In Technical Guidelines v2.0
    title: Technical Guidelines on SBOM, QBOM & CBOM, AIBOM and HBOM
    org: CERT-In / MeitY (India)
    date: 2025-07-09
    category: policy
    jurisdiction: india
    status: current
    url: https://www.cert-in.org.in/PDF/TechnicalGuidelines-on-SBOM,QBOM&CBOM,AIBOM_and_HBOM_ver2.0.pdf
    tags: [cbom, qbom, inventory]
    notes: >-
      The most CBOM-explicit national guideline published to date. Defines five BOM types;
      the CBOM is an inventory of cryptographic assets carrying metadata such as usage
      patterns and expiry, with a separate QBOM for quantum algorithms and quantum-safe
      technologies. Currently voluntary, addressed to the public sector, government,
      essential services and the software export industry. A strong candidate consumer of a
      PKIC-defined profile.

  - id: A2
    doc: MAS Circular MAS/TCRS/2024/01
    title: Advisory on Addressing the Cybersecurity Risks Associated with Quantum
    org: Monetary Authority of Singapore
    date: 2024-02
    category: policy
    jurisdiction: singapore
    status: current
    url: https://www.mas.gov.sg/-/media/mas-media-library/regulation/circulars/trpd/mas-quantum-advisory/mas-quantum-advisory.pdf
    tags: [inventory, finance]
    notes: >-
      Directs financial institutions to maintain an inventory of all cryptographic assets
      and identify priority assets for migration. Names no format.

  - id: A3
    doc: CSA Quantum-Safe Handbook
    title: Quantum-Safe Handbook and Quantum Readiness Index
    org: Cyber Security Agency of Singapore
    category: policy
    jurisdiction: singapore
    status: current
    url: https://www.csa.gov.sg/
    tags: [inventory, maturity]
    notes: >-
      Handbook covers discovery of cryptographic assets, risk-based prioritisation, phased
      migration, testing and post-migration monitoring. The Readiness Index is a
      five-domain self-assessment: governance, risk assessment, training and capability,
      external engagement, technology and agility.

  - id: A4
    doc: CyberSecurity Malaysia PQC framework
    title: Post-Quantum Cryptography Migration Framework
    org: CyberSecurity Malaysia
    category: policy
    jurisdiction: malaysia
    status: current
    url: https://www.cybersecurity.my/portal-main/services/post-quantum-overview
    tags: [migration]

  - id: A5
    doc: ASD ISM / ACSC guidance
    title: Planning for post-quantum cryptography; Information Security Manual
    org: Australian Signals Directorate
    category: policy
    jurisdiction: australia
    status: current
    url: https://www.cyber.gov.au/business-government/secure-design/planning-for-post-quantum-cryptography
    tags: [pqc, timeline, procurement]
    notes: >-
      The most aggressive timeline of any jurisdiction: traditional asymmetric cryptography
      to cease by end 2030, pure PQC rather than hybrid, ML-KEM-1024 preferred. Control
      ISM-1917 already requires cryptographic dependencies to be considered in procurement.

  - id: A6
    doc: NCO interim report / CRYPTREC guidelines
    title: >-
      National Cyber Command Office PQC transition target; CRYPTREC Cryptographic
      Technology Guidelines (Post-Quantum Cryptography), 2024 Edition
    org: NCO / CRYPTREC (Japan)
    date: 2025-03
    category: policy
    jurisdiction: japan
    status: current
    tags: [pqc, timeline]
    notes: >-
      Sets a 2035 government PQC transition target; CRYPTREC will fold NIST PQC algorithms
      into Japan's recommended-algorithm lists.

  - id: A7
    doc: ASEAN — no regional framework
    title: Absence of a regional ASEAN PQC or CBOM framework
    org: ASEAN
    category: policy
    jurisdiction: asean
    status: gap
    tags: [gap, engagement]
    notes: >-
      No regional ASEAN PQC or CBOM framework exists; the ASEAN Digital Masterplan 2025
      does not mention quantum. Activity is national — Singapore leads (nationwide
      quantum-safe network; MAS quantum-safe sandbox with DBS, HSBC, OCBC and UOB), with
      Malaysia and Indonesia (BSSN) following. Recorded as an engagement opportunity for
      the working group rather than a citable reference.

  - id: A8
    doc: KpqC master plan
    title: Master plan for the transition to post-quantum cryptography
    org: National Intelligence Service and Ministry of Science and ICT (Republic of Korea)
    date: 2023
    category: policy
    jurisdiction: korea
    status: current
    tags: [pqc, timeline, algorithms]
    verify: true
    notes: >-
      Sets a 2035 target for transitioning national cryptographic systems, organised in six
      tracks covering technology, regulation, procedure, transition support, assurance
      infrastructure and industrial base. Korea also runs its own KpqC algorithm selection
      alongside the NIST standards, so a profile applied here must carry algorithm names that
      are not in either carrier's registry. Primary sources are Korean-language and the
      document designation is not confirmed against them.

  # ------------------------------------------------------ policy — multilateral
  - id: X1
    doc: 2026 SBOM Minimum Elements
    title: 2026 Minimum Elements for a Software Bill of Materials (SBOM)
    org: >-
      CISA, NSA and FBI, co-sealed with ACSC, Cyber Centre, NÚKIB, ANSSI, BSI, CERT-In,
      ACN, METI, NCO, NIS/NCSC, KISA, NCSC-NL, NCSC-NZ, NASK and NBU
    date: 2026-07-29
    category: policy
    jurisdiction: global
    status: current
    url: https://media.defense.gov/2026/Jul/29/2003971159/-1/-1/1/CSI_2026_cisa_sbom_minimum_elements_508c.PDF
    tags: [sbom, minimum-elements, provenance, signing]
    notes: >-
      Updates the 2021 NTIA minimum elements. Adds SBOM Generation Context (the lifecycle
      phase at which the data was captured), SBOM Author Signature, data format name and
      version, and tool provenance. Requires authors to distinguish information that is
      unknown from information deliberately withheld, and states that supporting automation
      means supporting all widely used formats rather than mandating one — both positions
      the profile methodology depends on. Updates and replaces the 2021 NTIA minimum
      elements [U17].

