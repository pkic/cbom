      implements it two days later.

  - id: U15
    doc: OMB M-26-15
    title: Execution of the Migration to Post-Quantum Cryptography
    org: Office of Management and Budget (United States)
    date: 2026-06-24
    category: policy
    jurisdiction: us
    status: current
    url: https://www.whitehouse.gov/wp-content/uploads/2026/06/M-26-15-Execution-of-the-Migration-to-Post-Quantum-Cryptography.pdf
    tags: [inventory, pqc, cbom, discovery]
    notes: >-
      Implements EO 14412 [U14] and discharges OMB's duty under the Quantum Computing
      Cybersecurity Preparedness Act [U6]. Sets five migration phases from 2026 to 2035, and
      requires each agency's plan to state "the methodologies and automated tools used for
      the cryptographic inventory". Of that inventory it says the data "should populate a
      central Cryptographic Bill of Materials (CBOM)" — and names no CBOM format, which makes
      it the most direct statement to date of the gap this working group exists to fill.
      Excludes national security systems.

