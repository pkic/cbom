# CBOM Reference Register — PKI Consortium CBOM Profiles Working Group
#
# Single source of truth for the references page. Add or amend entries here;
# the rendered page is generated from this data. See CONTRIBUTING-references.md.
#
# Fields:
#   id           (required) stable citation key, e.g. F1, M3, E5. Never reuse or renumber.
#   doc          (required) document/standard number or short designation
#   title        (required) full title
#   org          (required) publishing organisation
#   date         (optional) YYYY-MM-DD or YYYY-MM or YYYY
#   category     (required) formats | methodology | policy | specs
#   jurisdiction (required) see _config.yml labels
#   status       (required) current | draft | superseded | gap
#   url          (optional) canonical link
#   tags         (optional) list of free-text tags
#   notes        (optional) why this matters for CBOM work; 1–3 sentences
#   verify       (optional) true if the entry needs confirming against a primary source

meta:
  updated: 2026-09-12

references:

  # ----------------------------------------------------------------- formats
  - id: F1
    doc: ECMA-424, 2nd edition
    title: CycloneDX Bill of Materials Standard
    org: Ecma International
    date: 2025-12
    category: formats
    jurisdiction: global
    status: current
    url: https://ecma-international.org/publications-and-standards/standards/ecma-424/
    tags: [cyclonedx, standard]
    notes: >-
      Second edition aligns to CycloneDX v1.7. The first edition (June 2024) aligned to
      v1.6 — cite the edition, not just the ECMA number.

  - id: F2
    doc: CycloneDX v1.7
    title: CycloneDX Specification v1.7
    org: OWASP CycloneDX
    date: 2025-10
    category: formats
    jurisdiction: global
    status: current
    url: https://cyclonedx.org/specification/overview/
    tags: [cyclonedx, cbom]
    notes: >-
      Released 21 October 2025; final release of the 1.x line and backward compatible with
      1.4–1.6. Adds the algorithm-family and elliptic-curve properties `algorithmFamily` and
      `ellipticCurve`, both constrained to enumerations held in the `cryptography-defs`
      subschema, and deprecates the free-text `curve` property carried since v1.6. Field
      names confirmed against the published 1.7 schema.

  - id: F3
    doc: CycloneDX Cryptography Registry
    title: Cryptography Registry
    org: OWASP CycloneDX
    date: 2025-10
    category: formats
    jurisdiction: global
    status: current
    url: https://cyclonedx.org/registry/cryptography/
    tags: [cyclonedx, registry, normalisation]
    notes: >-
      Authoritative machine-readable registry of algorithm families and curves, published as
      the `cryptography-defs` JSON Schema and carrying its own `lastUpdated` timestamp rather
      than the specification's version. Enumerates 93 algorithm families and 246 elliptic
      curves, and records per-curve aliases tagged by category — which is the naming problem
      of Q20 expressed as data, and what makes it the natural normalisation target for a
      format-independent profile.

