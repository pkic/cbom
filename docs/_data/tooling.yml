# CBOM Tooling Registry — PKI Consortium CBOM Profiles Working Group
#
# Single source of truth for the tooling page. Add or amend entries here; the
# rendered page is generated from this data. See CONTRIBUTING-tooling.md.
#
# A tool is listed only when its maintainer's own material — repository, documentation
# or product page — states that it works with CBOMs. That statement is `evidence`.
# A listing is not an endorsement, and no entry has been tested against the methodology
# or any profile.
#
# Fields:
#   id           (required) stable slug, lowercase with hyphens, e.g. cbomkit. It is the
#                page anchor. Never reuse or rename.
#   name         (required) the tool's name as its maintainer writes it
#   maintainer   (required) organisation or project that maintains it
#   url          (required) primary link: the repository or the product page
#   licensing    (required) open-source | commercial | freemium (labels in _config.yml)
#   license      (optional) SPDX licence id, expected when licensing is open-source
#   functions    (required) list, from: generate | consume | validate | convert | analyse |
#                visualise | store
#   methods      (optional) how a generator finds cryptography, from: source-code | binary |
#                container | filesystem | network | runtime | configuration | cloud | keystore.
#                Only on a tool whose functions include generate.
#   formats      (optional) list of BOM formats and versions the source states, e.g.
#                "CycloneDX 1.6". Leave out rather than guess.
#   status       (required) active | archived | unknown
#   summary      (optional) one or two neutral sentences on what it does with a CBOM
#   evidence     (required) URL where the maintainer states CBOM support
#   checked      (required) YYYY-MM-DD the entry was last checked against its evidence
#   verify       (optional) true if a detail could not be confirmed against the primary source
#   tags         (optional) list of free-text tags

