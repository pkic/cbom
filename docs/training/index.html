<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBOM Profiles — Training</title>
<meta name="description" content="Short interactive training modules on cryptographic bills of materials and the PKI Consortium CBOM profiles methodology.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: course hub of module cards, then one course screen at a time inside a PKIC CBOM Profiles shell.
   Tokens follow the methodology site's stylesheet (navy + blue on a light paper ground), with a dark set added. */
:root{
  --ink:#0f1b2d; --body:#29323d; --muted:#5f6b7a; --faint:#8a94a1;
  --line:#e4e8ee; --line-strong:#c9d3e0; --line-soft:#eef1f5;
  --bg:#f7f9fc; --panel:#ffffff; --panel2:#f2f5fa;
  --mark-bg:#0f1b2d; --mark-fg:#ffffff;
  --accent:#1c5fd6; --accent-h:#174fb4; --accent-ink:#16409a; --accent-soft:#eaf1fe; --on-accent:#ffffff;
  --pass:#0f7a52; --pass-soft:#e3f4ec; --fail:#b02a2a; --fail-soft:#fbe9e9; --warn:#9a6300; --warn-soft:#fbf1dc;
  --svc:#0369a1; --svc-soft:#e3f1fa; --mgmt:#6d28d9; --mgmt-soft:#f1eafd;
  --font-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:10px; --radius-lg:16px;
  --shadow:0 1px 2px rgba(15,27,45,.06),0 1px 3px rgba(15,27,45,.04);
  --shadow-md:0 4px 14px rgba(15,27,45,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#eef3fa; --body:#cfd8e3; --muted:#9aa8ba; --faint:#6f7d90;
  --line:#26354b; --line-strong:#3a4c66; --line-soft:#1b2a3f;
  --bg:#0c1421; --panel:#132033; --panel2:#18273d;
  --mark-bg:#e9eef6; --mark-fg:#0f1b2d;
  --accent:#6f9dff; --accent-h:#8fb3ff; --accent-ink:#a9c4ff; --accent-soft:#182b4f; --on-accent:#0b1324;
  --pass:#4cc38a; --pass-soft:#123326; --fail:#f07a7a; --fail-soft:#3a1719; --warn:#e3a94c; --warn-soft:#3a2a10;
  --svc:#4ab3ea; --svc-soft:#0f2c40; --mgmt:#ad8cf7; --mgmt-soft:#271c45;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 14px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#eef3fa; --body:#cfd8e3; --muted:#9aa8ba; --faint:#6f7d90;
  --line:#26354b; --line-strong:#3a4c66; --line-soft:#1b2a3f;
  --bg:#0c1421; --panel:#132033; --panel2:#18273d;
  --mark-bg:#e9eef6; --mark-fg:#0f1b2d;
  --accent:#6f9dff; --accent-h:#8fb3ff; --accent-ink:#a9c4ff; --accent-soft:#182b4f; --on-accent:#0b1324;
  --pass:#4cc38a; --pass-soft:#123326; --fail:#f07a7a; --fail-soft:#3a1719; --warn:#e3a94c; --warn-soft:#3a2a10;
  --svc:#4ab3ea; --svc-soft:#0f2c40; --mgmt:#ad8cf7; --mgmt-soft:#271c45;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 14px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--body);font-family:var(--font-ui);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font-family:var(--font-ui);font-size:15px;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{color:var(--ink);text-wrap:balance}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(30px,4.4vw,44px);line-height:1.15;margin:0;letter-spacing:-.01em}
h2{font-family:var(--font-display);font-weight:600;font-size:clamp(23px,3vw,30px);line-height:1.2;margin:0}
h3{font-size:17px;font-weight:600;margin:0 0 10px}
h4{font-size:15px;font-weight:600;color:var(--ink);margin:16px 0 4px}
p{margin:0 0 14px;max-width:70ch}
.mono{font-family:var(--mono);font-size:.88em}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--panel)}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
.hbar{max-width:1080px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--ink)}
.brand-mark{font-family:var(--mono);font-weight:500;font-size:12.5px;letter-spacing:.05em;color:var(--mark-fg);background:var(--mark-bg);padding:5px 8px;border-radius:6px}
.brand-text{font-family:var(--font-display);font-weight:600;font-size:17px}
.hsep{color:var(--faint)}
.hsection{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--muted)}
.hright{margin-left:auto;display:flex;gap:18px;flex-wrap:wrap}
.hback{background:none;border:0;color:var(--muted);font-size:14px;padding:4px 0;text-decoration:none}
.hlink{background:none;border:0;padding:0;cursor:pointer}
.brand{text-decoration:none}
.hback:hover{color:var(--accent)}

.wrap{max-width:1080px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* hub */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:32px;align-items:end;padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:24px}
.hero .lede{font-size:18px;color:var(--body);margin-top:12px;max-width:62ch}
.pilot{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;font-size:14px;box-shadow:var(--shadow)}
.pilot b{color:var(--ink)}
.paths{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.pathbtn{background:var(--panel);border:1px solid var(--line-strong);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--body)}
.pathbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pathnote{font-size:14px;color:var(--muted);min-height:1.6em;margin-bottom:20px}
.track{margin-top:30px}
.track-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.track-head h2{font-size:22px}
.track-head span{font-size:14px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;text-align:left;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s,opacity .2s}
button.card:hover{border-color:var(--accent);box-shadow:var(--shadow-md)}
.card .ico{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center}
.card .ico svg{width:26px;height:26px}
.card.planned .ico{background:var(--panel2);color:var(--muted)}
.card .code{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.card h3{font-size:16.5px;margin:2px 0 4px;line-height:1.35}
.card p{font-size:14px;color:var(--muted);margin:0 0 10px}
.card .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.card.dim{opacity:.38}
.status{font-weight:600;font-size:13px}
.status.go{color:var(--accent)}.status.done{color:var(--pass)}.status.plan{color:var(--faint);font-weight:500}

/* course shell */
.progress{display:flex;gap:4px;margin-bottom:18px}
.progress span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress span.on{background:var(--accent)}
.meta-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:22px}
.meta-top b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.head{display:flex;gap:20px;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:24px}
.head .hico{flex:none;width:60px;height:60px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center}
.head .hico svg{width:34px;height:34px}
.head .sub{color:var(--muted);font-size:16px;margin-top:4px}
.titlebox{padding:12px 0 4px}
.titlebox .sub{font-size:18px;color:var(--muted);margin-top:12px;max-width:64ch}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.two>*{min-width:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);min-width:0}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0 8px;padding:20px 0 0;border-top:1px solid var(--line)}
.facts small{display:block;color:var(--muted);font-size:13px}
.facts b{font-size:15px;color:var(--ink);font-weight:600}
ul.dash{list-style:none;padding:0;margin:0}
ul.dash li{position:relative;padding-left:22px;margin:7px 0}
ul.dash li::before{content:"";position:absolute;left:2px;top:.72em;width:10px;height:2px;background:var(--accent)}
.checks{list-style:none;padding:0;margin:0}
.checks li{padding-left:30px;position:relative;margin:11px 0}
.checks li::before{content:"";position:absolute;left:7px;top:4px;width:6px;height:12px;border:solid var(--pass);border-width:0 2px 2px 0;transform:rotate(45deg)}
.concept{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0;padding:18px 22px;margin-top:22px;color:var(--ink)}
.concept small{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--accent-ink);margin-bottom:6px}
.cue{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink);margin:6px 0 16px}
.cue svg{width:22px;height:22px;color:var(--accent)}
.note{font-size:14px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;margin-top:36px;padding-top:22px;border-top:1px solid var(--line);gap:12px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:12px 24px;min-width:120px;font-weight:600}
.btn:hover{background:var(--accent-h)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-strong);font-weight:500}
.btn.ghost:hover{border-color:var(--ink)}

/* tables + chips */
.tbl{overflow-x:auto;margin:8px 0 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
.tbl.wide table{min-width:680px}
th{background:var(--panel2);text-align:left;padding:11px 14px;font-weight:600;color:var(--ink);font-size:13.5px}
td{padding:12px 14px;vertical-align:top;border-top:1px solid var(--line)}
td:first-child{color:var(--ink)}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;margin:2px 4px 2px 0;white-space:nowrap}
.c-pass{background:var(--pass-soft);color:var(--pass)}.c-fail{background:var(--fail-soft);color:var(--fail)}
.c-warn{background:var(--warn-soft);color:var(--warn)}.c-info{background:var(--accent-soft);color:var(--accent-ink)}
.c-mute{background:var(--panel2);color:var(--muted)}.c-mgmt{background:var(--mgmt-soft);color:var(--mgmt)}.c-svc{background:var(--svc-soft);color:var(--svc)}

/* figures: inline SVG drawn from tokens so both themes work */
figure{margin:20px 0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 18px 14px;box-shadow:var(--shadow)}
figure .scroll{overflow-x:auto}
figure svg{display:block;width:100%;height:auto;min-width:560px}
figcaption{font-size:13.5px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)}
figcaption b{color:var(--ink);font-weight:600}
svg text{font-family:var(--font-ui)}
.s-panel{fill:var(--panel);stroke:var(--line-strong);stroke-width:1.2}
.s-soft{fill:var(--panel2);stroke:var(--line-strong);stroke-width:1.2}
.s-key{fill:var(--panel);stroke:var(--accent);stroke-width:1.8}
.s-svcbox{fill:var(--svc-soft);stroke:var(--svc);stroke-width:1.4}
.s-mgmtbox{fill:var(--mgmt-soft);stroke:var(--mgmt);stroke-width:1.4;stroke-dasharray:5 4}
.s-failbox{fill:var(--fail-soft);stroke:var(--fail);stroke-width:1.2;stroke-dasharray:4 3}
.s-passbox{fill:var(--pass-soft);stroke:var(--pass);stroke-width:1.2}
.t-ink{fill:var(--ink)}.t-muted{fill:var(--muted)}.t-svc{fill:var(--svc)}.t-mgmt{fill:var(--mgmt)}.t-pass{fill:var(--pass)}.t-fail{fill:var(--fail)}.t-acc{fill:var(--accent-ink)}.t-warn{fill:var(--warn)}
.t-mono{font-family:var(--mono)!important}
.l-svc{stroke:var(--svc);stroke-width:2;fill:none}.l-mgmt{stroke:var(--mgmt);stroke-width:2;fill:none;stroke-dasharray:6 5}
.l-pass{stroke:var(--pass);stroke-width:2;fill:none}.l-fail{stroke:var(--fail);stroke-width:2;fill:none;stroke-dasharray:6 5}
.l-warn{stroke:var(--warn);stroke-width:2;fill:none}.l-mute{stroke:var(--line-strong);stroke-width:1.5;fill:none;stroke-dasharray:3 4}
.l-acc{stroke:var(--accent);stroke-width:2;fill:none}
.f-svc{fill:var(--svc)}.f-mgmt{fill:var(--mgmt)}.f-pass{fill:var(--pass)}.f-fail{fill:var(--fail)}.f-warn{fill:var(--warn)}.f-acc{fill:var(--accent)}

/* document listing */
.doc{background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.65;overflow-x:auto;white-space:pre;color:var(--ink);margin:0}
.doc .k{color:var(--muted)}.doc .s{color:var(--svc)}.doc .m{color:var(--mgmt)}.doc .x{color:var(--fail)}.doc .w{color:var(--warn)}
.doc-title{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}

/* do / don't */
.dd{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
.dd>div{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;min-width:0;border-top:4px solid}
.dont{border-top-color:var(--fail)!important}.do{border-top-color:var(--pass)!important}
.dd h3{display:flex;align-items:center;gap:10px}
.dont h3{color:var(--fail)}.do h3{color:var(--pass)}
.ic{width:20px;height:20px;flex:none}
.quote{font-family:var(--font-display);font-size:18px;color:var(--ink);margin:14px 0 4px}

/* numbered steps */
.steps{list-style:none;padding:0;margin:6px 0 20px;display:grid;gap:14px}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px}
.steps .n{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:600;font-size:14px}
.steps b{display:block;color:var(--ink)}

/* explore (circles) */
.explore{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:36px}
.circles{display:grid;grid-template-columns:1fr 1fr;gap:24px 12px;align-content:start}
.circ{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600;font-size:14px;text-align:center;position:relative;color:var(--ink)}
.circ .c{width:104px;height:104px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;color:var(--accent-ink);box-shadow:var(--shadow);transition:border-color .15s}
.circ .c svg{width:40px;height:40px}
.circ[aria-pressed="true"] .c{border-color:var(--accent);background:var(--accent-soft)}
.circ .done{position:absolute;top:2px;right:16px;width:22px;height:22px;border-radius:50%;background:var(--pass);display:none}
.circ .done::after{content:"";position:absolute;left:8px;top:4px;width:5px;height:10px;border:solid var(--panel);border-width:0 2px 2px 0;transform:rotate(45deg)}
.circ.seen .done{display:block}
.detail{border-left:1px solid var(--line);padding-left:36px;min-width:0}

/* segmented tabs */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:16px;max-width:100%}
.seg button{background:none;border:0;border-radius:7px;padding:8px 14px;font-size:14px;color:var(--muted);text-align:left}
.seg button[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

/* rule explorer */
.rules{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px}
.rgroup{margin-bottom:18px}
.rgroup .eyebrow{margin-bottom:8px}
.rgrid{display:flex;flex-wrap:wrap;gap:8px}
.rbtn{font-family:var(--mono);font-size:14px;font-weight:500;width:58px;height:44px;border-radius:8px;background:var(--panel);border:1px solid var(--line-strong);color:var(--ink);position:relative}
.rbtn.p{border-left:4px solid var(--accent)}
.rbtn.i{border-left:4px solid var(--svc)}
.rbtn.r{border-left:4px solid var(--warn)}
.rbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rbtn.seen::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--pass)}
.rdetail{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);min-width:0}
.rdetail .rid{font-family:var(--mono);font-size:13px;color:var(--muted)}
.rdetail h3{font-family:var(--font-display);font-size:21px;font-weight:600;margin:6px 0 10px}
.rdetail dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 14px;margin:14px 0 0;font-size:14.5px}
.rdetail dt{color:var(--muted)}
.rdetail dd{margin:0;color:var(--body)}

/* evaluator */
.evalgrid>*{min-width:0}
.evalgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
.evtable td{padding:9px 12px}
.evtable td:last-child{text-align:right;white-space:nowrap}
.evtable tr.pending .chip{opacity:.0}
.evtable tr .why{display:block;font-size:12.5px;color:var(--muted)}
.verdict{margin-top:12px;border-radius:var(--radius);padding:14px 16px;font-weight:600;display:flex;gap:10px;align-items:center;border:1px solid var(--line)}
.verdict.ok{background:var(--pass-soft);color:var(--pass);border-color:transparent}
.verdict.no{background:var(--fail-soft);color:var(--fail);border-color:transparent}
.verdict.wait{background:var(--panel2);color:var(--muted);font-weight:500}
.runrow{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.flip{background:none;border:0;padding:0;perspective:900px;min-height:230px;text-align:left}
.flip .in{position:relative;width:100%;height:100%;min-height:230px;transition:transform .5s;transform-style:preserve-3d}
.flip[aria-pressed="true"] .in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.flip .back{transform:rotateY(180deg);background:var(--panel2)}
.flip .name{font-family:var(--mono);font-size:17px;font-weight:500;color:var(--ink)}
.flip .tag{align-self:flex-start}
.flip .front p,.flip .back p{font-size:14px;margin:0}
.flip .turn{margin-top:auto;font-size:12.5px;color:var(--muted)}
.flip .back b{color:var(--ink);font-size:13px;display:block}
@media (prefers-reduced-motion:reduce){.flip .in{transition:none}}

/* quiz */
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;margin-bottom:14px}
.q fieldset{border:0;padding:0;margin:0;min-width:0}
.q legend{font-weight:600;color:var(--ink);padding:0;margin-bottom:6px}
.q label{display:flex;gap:10px;align-items:flex-start;padding:7px 6px;cursor:pointer;border-radius:6px}
.q label:hover{background:var(--panel2)}
.q input{margin-top:5px;accent-color:var(--accent)}
.fb{margin-top:6px;font-size:14.5px}
.fb.ok{color:var(--pass)}.fb.no{color:var(--fail)}
.score{font-size:19px;font-weight:600;margin-top:14px;color:var(--ink)}
.src{font-size:13px;color:var(--muted);margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
.disclaimer{font-size:12.5px;color:var(--faint);margin-top:18px}
.nextup{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}

@media (max-width:820px){
  .hero,.two,.dd,.explore,.rules,.evalgrid{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr 1fr}
  .flips{grid-template-columns:1fr 1fr}
  .detail{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:22px}
  .head{gap:14px}.head .hico{width:48px;height:48px}.head .hico svg{width:28px;height:28px}
}
/* tiles, record pairs, matrix, path toggles */
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:8px 0}
.tile3{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
.tile3 h4{margin:0 0 6px;display:flex;gap:8px;align-items:center}
.tile3 h4 svg{width:20px;height:20px;color:var(--accent);flex:none}
.tile3 p{font-size:14px;margin:0;color:var(--body)}
.pairs{display:grid;gap:14px}
.pair{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.pair .recs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.rec{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.6;overflow-x:auto;white-space:pre;color:var(--ink)}
.rec .k{color:var(--muted)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{background:var(--panel);border:1px solid var(--line-strong);border-radius:999px;padding:6px 14px;font-size:14px}
.choices button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pair .fb{margin-top:10px}
.matrix{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) minmax(0,1fr);gap:8px;margin:10px 0}
.matrix .mh{font-size:13px;font-weight:600;color:var(--muted);align-self:end;padding:4px 6px}
.matrix .ml{font-size:13px;font-weight:600;color:var(--ink);align-self:center;padding:4px 6px}
.mcell{background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--radius);padding:14px;text-align:left;min-height:92px;display:flex;flex-direction:column;gap:6px}
.mcell[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mcell b{color:var(--ink);font-size:14.5px}
.mcell span{font-size:13px;color:var(--muted)}
.hops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:6px 0 10px}
.hops .lab{font-size:13px;color:var(--muted);margin-bottom:4px}
.hops .seg{margin:0;width:100%}
.hops .seg button{flex:1;text-align:center}
.pathres{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pathres>div{border-radius:var(--radius);padding:12px 14px;font-size:14.5px;border:1px solid var(--line);background:var(--panel)}
.pathres b{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}
.pathres .good{background:var(--pass-soft);color:var(--pass);border-color:transparent}
.pathres .bad{background:var(--fail-soft);color:var(--fail);border-color:transparent}
.hop-pass{stroke:var(--pass);fill:none}.hop-fail{stroke:var(--fail);fill:none}
@media (max-width:820px){.tiles3{grid-template-columns:1fr 1fr}.hops{grid-template-columns:1fr}.pathres{grid-template-columns:1fr}}
@media (max-width:560px){.tiles3,.pair .recs{grid-template-columns:1fr}.matrix{grid-template-columns:minmax(0,90px) minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:460px){.flips{grid-template-columns:1fr}.flip,.flip .in{min-height:200px}.circ .c{width:88px;height:88px}}
@media (prefers-reduced-motion:no-preference){.screen{animation:fade .25s ease}@keyframes fade{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}}
/* A1 */
.a1-test{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:0 8px 8px 0;padding:12px 16px;margin-top:6px;color:var(--ink)}
.a1-test .eyebrow{color:var(--warn)}
.a1-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center}
.a1-row .rec{white-space:normal}
.a1-row .fb{grid-column:1/-1;margin-top:0}
.a1-row .fb:empty{display:none}
@media (max-width:560px){.a1-row{grid-template-columns:1fr}}
.btn[disabled]{opacity:.4;cursor:default}

/* A3: let code snippets in the location exercise scroll inside their card at phone width */
.a3-locs{grid-template-columns:minmax(0,1fr)}
.a3-locs .pair,.a3-locs .rec{min-width:0}

.rbtn.r{border-left:4px solid var(--warn)}
.c2grid td{vertical-align:middle}
.c2cell{background:none;border:1px solid transparent;border-radius:999px;padding:2px;cursor:pointer}
.c2cell[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

.c4dl{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr);gap:8px 14px;margin:0;font-size:14.5px}
.c4dl dt{color:var(--muted)}.c4dl dd{margin:0}
@media (max-width:560px){.c4dl{grid-template-columns:1fr}}

 I2:{g:'i',t:'protocolVersion',lvl:'MUST',why:'Names the version. An advisory usually names one.'},
 I3:{g:'i',t:'keyExchange',lvl:'MUST',why:'Says how the session key is agreed.'},
 I4:{g:'i',t:'encryption',lvl:'MUST',why:'Says what protects the traffic once the key is agreed.'},
 I5:{g:'i',t:'authentication',lvl:'MUST',why:'Says how each end proves who it is.'},
 I6:{g:'i',t:'endpointRoles',lvl:'MUST',why:'Says who is at each end, so the reader can place the interface in a topology.'},
 I7:{g:'i',t:'interfaceType',lvl:'MUST',why:'One of five values, including service, management and interconnect. Product rule P2 is checked against this attribute.'},
 I8:{g:'i',t:'lifecycleStage',lvl:'MUST',why:'Says whether the values were implemented, configured or observed. This tells the reader how much weight to give them. It must agree with the stage the document declares under P6. The baseline does not accept intended.'},

const LESSONS={
 harm:{t:'Harmonization',prob:'Many vendor-specific formats and delivery methods made reconciliation at scale impossible.',impl:'Agree how each attribute is expressed, rather than mandating one format. A profile says what must be disclosed. A mapping fixes how each attribute is encoded in each format. Several formats can then coexist and still be reconciled.'},
 prof:{t:'Profiling',prob:'Listing everything did not make a bill of materials more useful. The many entries hid the few that mattered for a decision.',impl:'Define a minimum, purpose-specific set of attributes for each objective. That is what a profile does.'},
 seq:{t:'Sequencing',prob:'Producers read the published minimum elements as the most they had to supply. They met the minimum and stopped. Consumers had no basis for asking for more, because nothing said what came next.',impl:'A profile may defer part of the information. When it does, it must place an obligation on the deferred part. Otherwise the first stage becomes the permanent answer.'},
 norm:{t:'Normalization',prob:'Different producers wrote the same value in different ways, which blocked automated processing.',impl:'Agree identifiers (syntactic normalization) and attribute meanings (semantic normalization), so that CBOMs from different producers can be compared.'}
};
const GAPS={
 life:{t:'Lifecycle state',icon:'lifecycle',html:`<p>"The product uses AES-256-GCM" can mean four things. The algorithm may be <b>intended</b> in the design, <b>implemented</b> in the binary, <b>configured</b> in a deployment, or <b>observed</b> on the wire.</p>${dash(['A vendor build CBOM and an operator runtime scan can both be correct and still differ.','Without an explicit stage, a consumer cannot tell capability from use. Module F5 covers this in depth.','The baseline asks for one stage per document and does not accept <span class="mono">intended</span>. A vendor states an intention as a capability status instead.'])}`},
 depth:{t:'Depth of disclosure',icon:'ladder',html:`<p><b>Too much detail</b> hides what matters and can expose intellectual property. <b>Too little</b> hides risk. A profile sets a minimum, and its scope limits how much the producer is asked to disclose.</p>${dash(['<b>Time is the third factor.</b> Few suppliers can answer a mature profile at the start. A profile pitched at what suppliers produce today will still be pitched there in three years.','So a profile that defers a subject still asks the producer to say where that subject stands.'])}`},
 four:{t:'Missing values',icon:'withheld',html:`<p>Most tooling treats an attribute as present or missing. That merges four situations: <span class="mono">value</span>, <span class="mono">withheld</span>, <span class="mono">unknown</span> and <span class="mono">undeclared</span>.</p>${dash(['<b>Unknown</b> points to a limit of the producing process. It may justify better tooling, or less weight on the result.','<b>Withheld</b> is a policy decision. The information exists and could be released on other terms, such as under an NDA.','A vendor whose scanner cannot see hardware cryptography is not in the same position as one that chose not to publish a library version. An empty field treats them the same.','Neither CycloneDX nor SPDX has a native field for these markers, so the mapping defines a convention.'])}`},
 tool:{t:'Tooling confidence',icon:'advisory',html:`<p>Automated tools can miss cryptography that is <b>loaded dynamically</b>, <b>driven by configuration</b> or <b>provided by hardware</b>.</p>${dash(['A CBOM is no more reliable than the process that produced it.','Provenance matters, and so does signing where it is feasible.','Confidence also depends on the lifecycle stage at which the CBOM was captured.'])}`}
};

F3.push({min:1.5,render:()=>`${head('standards','Lessons from SBOM adoption','What separated successful SBOM deployments from difficult ones')}

F3.push({min:1.5,render:()=>`${head('ladder','Sequencing: when the minimum becomes the maximum','A deferred subject still needs an obligation')}
  <p>The SBOM minimum elements were meant as a floor. Producers read them as a ceiling. A CBOM profile that asks for part of the information first has the same risk.</p>
  ${fig(FIG_SEQ,'<b>Figure 1.</b> The same minimum, with and without a status on the deferred subject. Only the second gives the consumer a reason and a basis to ask for more.')}
  <div class="tbl"><table><thead><tr><th>How the profile treats a deferred subject</th><th>Cost to the producer</th><th>What the consumer learns</th></tr></thead><tbody>
   <tr><td>States it is out of scope</td><td>Nothing</td><td>Nothing</td></tr>
   <tr><td>Requires a one-word status, such as <span class="mono">planned</span> or <span class="mono">in progress</span></td><td>Almost nothing</td><td>How far the work has progressed</td></tr>
  </tbody></table></div>
  <div class="box"><h3>Coverage is a separate question</h3><p style="margin:0">The 2026 minimum elements require an SBOM to include every component, including transitive dependencies, with no minimum depth. A profile does something different. It says which attributes are mandatory for a purpose. It never permits a producer to leave components out.</p></div>`});

F3.push({min:1.5,render:()=>`${head('relation','The edge gap','The standards describe what a component contains, not where it is used')}
  <p>Current CBOM standards model cryptographic assets as nodes: algorithms, keys, certificates and protocols. They have no object for the <b>relationship</b>, the point at which cryptography is applied between two parties. A TLS connection is an example. It is where assets are used, not an asset in itself.</p>
  ${fig(FIG_EDGE,'<b>Figure 2.</b> Some classifiers belong to the connection, such as the endpoint roles in a session. With no object for the connection, they are attached to the protocol asset. The edge is represented as though it were a node.')}
  ${dash(['<b>Why it matters:</b> the questions buyers ask are about connections. Which interfaces negotiate a classical key exchange? Who is at the far end?','<b>How the methodology responds:</b> it models interfaces explicitly and states, in the mapping, where each relationship attribute is written. A connection between two parties is the join of its two ends: a deployment record can name the far end, and an evaluation reads both records together. Module C1 covers the relationship model.'])}`});

F3.push({min:1.5,render:()=>`${head('mapping','Naming, encoding and format coverage','Three reasons two correct CBOMs cannot be compared')}
  ${fig(FIG_NORM,'<b>Figure 3.</b> Naming normalization fixes the value. Encoding normalization fixes where the value sits. A consumer needs both to read CBOMs from different producers with one parser.')}
  <div class="tiles3">
   <div class="tile3"><h4>${I.list} Inconsistent names</h4><p>Deployments show one algorithm written several ways. The CycloneDX 1.7 Cryptography Registry gives stable identifiers. CBOMs written to earlier versions carry free text, which the consumer normalizes on intake.</p></div>
   <div class="tile3"><h4>${I.mapping} Several valid encodings</h4><p>CycloneDX and SPDX both allow one fact to sit in different valid places. The mapping defines one canonical location per profile attribute, so a consumer reads each value from one place.</p></div>
   <div class="tile3"><h4>${I.standards} Uneven format coverage</h4><p>SPDX 3.0.1 has no cryptographic model like CycloneDX's, so SPDX users often link a CycloneDX CBOM. SPDX is adding one. When it lands, only the SPDX column of the mapping changes. The profile stays the same.</p></div>
  </div>
  <p class="note">Positions described as of the methodology draft. Check the current state of each specification.</p>`});

  <p style="font-size:18px">CBOMs inherit the SBOM lessons and add problems of their own: no object for relationships, several names and encodings for one fact, unclear lifecycle state, and no shared identity for some assets.</p>
  <h3 style="margin-top:22px">Follow these practices</h3>
  ${dash(['Ask for consistent information through a profile and mapping, not for one format.','When a profile defers a subject, require a status for it.','Normalize names on intake, and read each value from the location the mapping defines.','Require an explicit lifecycle stage and the four disclosure outcomes.','State the identifier form you need for each asset class in the profile you cite.'])}

A1.push({min:1.5,render:()=>`${head('rules','Stage 3: rules','Levels, absence, structure and context')}
  <p>Give every attribute a BCP 14 level. Then decide what happens when its value is missing. A procurement profile may let a producer withhold nothing. A supply-chain disclosure profile will allow several values to be withheld. The PQC migration profile tightens one inherited rule: the implementing library, which the baseline lets a producer withhold, must be disclosed.</p>

  <div class="two">
   <div class="box"><h3>Structural rules come first</h3><p style="margin:0">Declaring that an interface exists costs a producer little. Describing it in detail is what takes effort. If a profile leaves its structural rules to a deeper depth to look less demanding, a supplier can conform while leaving out a whole interface. Put them in the earliest version and the shallowest depth.</p></div>
   <div class="box"><h3>Exclusions are written down</h3><p style="margin:0">State what the profile does not ask for, and why. The list answers in advance the objection that something obvious was forgotten. It also means that any later expansion has to be a deliberate decision.</p></div>

  <div class="two">
   <div class="box"><h3>Every depth supports a decision of its own</h3><p style="margin:0">A depth is a profile, so it names a consumer, a decision and the options. It is tempting to build the first depth from the cheapest attributes. A supplier could be certified against it, but nobody could use it to decide anything.</p></div>
   <div class="box"><h3>What a depth defers, it still asks about</h3><p style="margin:0">A depth may leave the detail of a subject to a deeper profile. It should still require a one-word status for that subject. The status costs one value and gives the next depth a starting point.</p></div>
  </div>
  <p style="margin-top:16px">A profile does not set the date after which a depth stops being acceptable. It cannot know a consumer's risk position. The contract between the parties sets when a particular depth is required.</p>

  </ul>`});

A2.push({min:1.5,render:()=>`${head('decision','The decision being supported','An inventory says what is in use. A migration plan needs more.')}
  <p>An operator is evaluating a product it did not build and cannot inspect. It has to decide how and when that product can move to post-quantum cryptography, one interface at a time.</p>
  <div class="two">
   <div class="box"><h3>The decision, as the profile records it</h3><p>For each interface a product exposes: whether it can be made quantum-safe, what enabling it requires, what enabling it costs in interoperability, and, where the capability is not yet available, what prevents it and who controls that.</p></div>
   <div class="box"><h3>The options the operator chooses between</h3><ul class="checks"><li>Enable the capability on the deployed product.</li><li>Schedule a software update to obtain it.</li><li>Replace the product, where no update path reaches it.</li><li>Accept the interface and revisit at the next review.</li><li>Escalate to the supplier, where the blocker is theirs to clear.</li></ul></div>
  </div>
  <p style="margin-top:16px">The questions behind that decision cover capability, the route to enabling it, whether the operator can enforce it, what breaks when it is switched on, what blocks it, module validation, and the key management and services around the interface. An inventory of the algorithms in use today answers none of them.</p>
  ${concept('Keycloak signs every token its relying parties verify. Its migration therefore sets the timetable for many other systems as well as its own.')}`});

A2.push({min:1.5,render:()=>`${head('iface','The black-box constraint','Ask only for what can be declared at the boundary')}
  <p>The consumer cannot see inside the product, and the vendor will not expose its internals. Everything the profile asks for must be observable at an interface, or stated by the vendor as a property of the product it ships. Requests for source, design or internal architecture are out of scope, and would not be answered anyway.</p>
  ${fig(A2_FIG_IFACES,'<b>Figure 1.</b> The subject is the container image at its defaults, which fixes the Java runtime and so the TLS capability. An operator plans against these thirteen interfaces, because that is all it can verify and all the supplier will state.')}
  <div class="two">
   <div class="box"><h3>An interface is a logical boundary</h3><p style="margin:0">Signed tokens and the TLS that carries them are two interfaces, because they migrate on different timetables and depend on different standards. A service counts as an interface when it applies cryptography of its own, or when it has no transport protection.</p></div>

A3.push({min:1.5,render:()=>`${head('mapping','One profile, several carriers','The profile says what. The mapping says where.')}
  <p>A PKIC CBOM profile is defined without reference to any file format. A mapping then places each attribute, and the count of interfaces, at one location in a concrete document. CycloneDX 2.0 is the target carrier. The validator still reads CycloneDX 1.6 and 1.7, as legacy, because the tools that produce CBOMs today emit 1.x.</p>
  ${A3_fig(A3_FIG_CARRIERS,'<b>Figure 1.</b> One profile, three carrier situations. SPDX 3.0.1 has no cryptographic object model, so an SPDX SBOM references a CBOM written in CycloneDX.')}
  <div class="two">
   <div class="box"><h3>Pinned to a development commit</h3><p style="margin:0">CycloneDX 2.0 is not yet released. The profiles are pinned to the 2.0-dev branch at commit <span class="mono">76f185c</span> (23 October 2026). Ecma is expected to ratify the release in December 2026. The working group will then swap the pinned schema for the released one and regenerate the examples.</p></div>
   <div class="box"><h3>One location per fact</h3><p style="margin:0">Both formats let a producer write the same fact in more than one valid place. The mapping names a single canonical location for each attribute. A consumer that follows the mapping reads each value from one place and does not have to handle every variant.</p></div>
  </div>
  ${concept('When a format gains capability, the mapping changes and the profile rules stay the same. Keeping the profile separate from any format is what makes that possible.')}`});

A3.push({min:2,render:()=>`${head('iface','Two locations, two meanings','Offered and used are different facts')}

  ${A3_fig(A3_FIG_TWOLOC,'<b>Figure 2.</b> One algorithm, two valid locations. Without an agreed rule, a consumer cannot tell whether X25519 is merely offered or actually used. In CycloneDX 1.x, location B is <span class="mono">cryptoRefArray</span>.')}

A3.push({min:1.5,render:()=>`${head('relation','How an interface is carried','The format sees an asset. The profile sees a relationship.')}
  <p>A security protocol instance such as TLS is a cryptographic-asset component with <span class="mono">assetType: protocol</span>. An application protocol such as OIDC, SAML or the Keycloak Admin API is a service, which in CycloneDX 2.0 is a component with <span class="mono">type: "service"</span>. The dependency graph carries the layering.</p>
  ${A3_fig(A3_FIG_LAYERS,'<b>Figure 3.</b> In the Keycloak product record, OIDC depends on HTTPS and HTTPS depends on TLS. The TLS component carries the interface attributes and points to the algorithms it uses.')}
  ${dash(['The document never lists its interfaces directly. The validator finds every component that carries <span class="mono">interfaceType</span> and counts them. Rules P1 and P2 run against that derived set.','A service declared only for layering, such as HTTPS under OIDC, has no <span class="mono">interfaceType</span>. That attribute is how the validator tells an interface from a supporting record, so the profile requires it on every interface.','Inside one document an interface is identified by its <span class="mono">bom-ref</span>. From another document it is named by a BOM-Link: <span class="mono">urn:cdx:&lt;serial&gt;/&lt;version&gt;#&lt;bom-ref&gt;</span>.','Algorithms are reached by reference. If a reference is broken, the attribute looks absent.','A product and an operator each describe the same connection in their own records. The deployment record names the product interface it realises with <span class="mono">pkic:profile:correspondsTo</span>. The two records are joined, never merged.'])}`});

A3.push({min:1.5,render:()=>`${head('rules','The mapping table and the edge gap','Where each rule is read, and what has no home')}
  <div class="tbl wide"><table><thead><tr><th>Rule</th><th>Requirement</th><th>CycloneDX 2.0</th><th>SPDX 3.0.1</th></tr></thead><tbody>
   <tr><td class="mono">P1</td><td>At least one cryptographic interface</td><td>count of components carrying <span class="mono">interfaceType</span></td><td><span class="chip c-mute">unresolved</span></td></tr>

  <div class="two">
   <div class="box"><h3>The edge gap</h3><p style="margin:0">In the relationship model an interface is an edge between two endpoints. Neither format has an object for the edge, so interface type and endpoint roles are attached to a node: the protocol component or the service. That is enough for the disclosure baseline. It cannot hold a finding that belongs to one connection, such as the group a particular session negotiated. CycloneDX 2.0 blueprint flows describe a deployed system for threat analysis and do not close the gap.</p></div>

A3.push({min:1.5,render:()=>`${head('list','Normalization: one value, one spelling','Matches are exact, and a miss reports no error')}
  <p>Every automated use of a CBOM matches a value against something: a policy, a deprecation list, a vulnerability feed, or another CBOM. A policy engine looking for <span class="mono">AES-256-GCM</span> that meets <span class="mono">AES256</span> finds no match. Depending on how its rule is written, it reports the interface as compliant or as having no encryption. Both answers are wrong and both look like ordinary output.</p>
  ${A3_fig(A3_FIG_NORM,'<b>Figure 4.</b> Three common spellings of one curve, and four spellings of one protocol version. Compared as text, each set looks like unrelated values.')}
  <div class="two">
   <div class="box"><h3>Algorithms and curves</h3><p style="margin:0">Prefer Cryptography Registry identifiers for key exchange, encryption and authentication (I3 to I5). In CycloneDX 2.0, <span class="mono">ellipticCurve</span> takes an enumerated value such as <span class="mono">nist/P-256</span>. For 1.6 files with free-text names, the adapter applies a versioned name map before any rule runs.</p></div>
   <div class="box"><h3>Protocols and versions</h3><p style="margin:0">Profiles gate on protocol version, and guidance withdraws TLS 1.0 and 1.1 by version. Version comparison needs an ordering that strings do not give: as text, 1.10 sorts before 1.9. The mapping fixes the expected form, and the adapter normalizes what it receives.</p></div>
  </div>
  ${concept('The mapping also normalizes identity where a scheme exists: a package URL for the subject (P3) and the implementing library (I9), and registry identifiers for algorithms. Across documents, the deployment record supplies the join itself with <span class="mono">correspondsTo</span>.')}`});

A4.push({min:2,render:()=>`${head('ladder','Change, stewardship and retention','Profiles change. Old claims must still be checkable.')}
  <div class="two">
   <div class="box"><h3>Change control</h3><p style="margin:0">Profiles, vocabulary and the methodology change through explicit versions and lazy consensus in the working group: a proposal is accepted unless someone objects. A tightened rule takes effect after a dated grace window, during which the validator warns before it fails. Vocabulary values are deprecated, never removed.</p></div>
   <div class="box"><h3>Retention and immutability</h3><p style="margin:0">Published CBOM revisions do not change. A correction is a new revision that supersedes the old one, and the old one is kept for audit. Profiles follow the same rule: every published version is retained and served by its version identifier, because a claim made years ago can be reproduced only against the text it cited.</p></div>
  </div>

C1.push({min:1.5,render:()=>`${head('relation','Three terms','Questions about use, not about inventory')}
  <p>"Which algorithms does this product implement?" is an inventory question, and current CBOM standards answer it well. "Which of our connections would still be readable if someone recorded them today?" is a question about use. Migration planning, procurement and incident response mostly ask the second kind.</p>
  ${fig(C1_FIG_TERMS,'<b>Figure 1.</b> The connection details a browser shows for Keycloak\'s HTTPS listener describe the relationship. The browser and Keycloak are the endpoints. Each algorithm, the certificate and the library are assets.')}

   <tr><td><b>Endpoint</b></td><td>A party to a relationship.</td><td>Browser and Keycloak for TLS; Keycloak as issuer and the client application as relying party for the token</td></tr>

C1.push({min:1.5,render:()=>`${head('iface','An interface is a boundary, not a port','Count what applies cryptography, not what listens')}
  <p>Two layers of cryptography can protect traffic on one port. Each layer is then its own interface, and the producer describes each in its own terms.</p>
  ${fig(C1_FIG_LAYERS,'<b>Figure 2.</b> Keycloak\'s HTTPS listener carries three interfaces. They migrate on different timetables and wait on different standards.')}
  <div class="two">
   <div class="box"><h3>What counts as an interface</h3><p style="margin:0">An application-layer interface counts when it applies cryptography of its own, or when anyone can reach it without transport protection. Keycloak\'s plaintext HTTP listener is reachable without protection, so it counts and declares <span class="mono">none</span> for every algorithm.</p></div>
   <div class="box"><h3>What does not</h3><p style="margin:0">Keycloak\'s health and metrics endpoints apply no cryptography of their own. They ride the management listener, and that listener\'s interface covers them. Without this rule, interface counts would depend on how many services a producer chose to list.</p></div>
  </div>
  ${concept('In CycloneDX 2.0 an application-layer interface such as OIDC, SAML or an admin API is a component of type service. The protocol types cover security protocols only. The mapping records which transport carries each service.')}`});

C1.push({min:1,render:()=>`${head('decision','What the cryptography is for','A purpose is a job, and the job sets the timetable')}
  <p>A relationship says where cryptography is applied. An asset says what is applied. A <b>cryptographic purpose</b> says what job it does: establishing a key, encrypting, proving identity, protecting a message from change, signing something that must verify years later, protecting keys, or deriving keys.</p>
  <div class="dd">
   <div class="dont"><h3>${I.x} An operation</h3><p>CycloneDX records operations in <span class="mono">cryptoFunctions</span>: sign, verify, encrypt, keyagreement.</p><p style="margin:0">A TLS certificate signature and a firmware signature are both sign and verify. The operation tells you nothing about when either can change.</p></div>
   <div class="do"><h3>${I.ok} A purpose</h3><p>The TLS certificate signature proves identity during a session and can change with the certificate hierarchy.</p><p style="margin:0">The firmware signature must verify long after it was written. It can change only when the last verifier in the field is upgraded.</p></div>
  </div>

C4.push({min:1.5,render:()=>`${head('ladder','Start where a producer can','One demanding profile, and nothing to conform to')}
  <p>A profile sets one requirement. A document meets it or it does not. Suppose a producer can list its interfaces this quarter but cannot name the algorithms until it changes its build tooling. Against one demanding profile, that producer conforms to nothing and has nothing to show.</p>
  <p>The answer is a family of profiles, each asking for more than the one before. The methodology calls each step a <b>depth</b>. The shallowest one, the entry profile, is within reach of most producers today.</p>
  ${fig(C4_FIG_LADDER,'<b>Figure 1.</b> Keycloak examples placed against the two depths of the interface family. The entry depth asks for more than raw scanner output and less than the baseline.')}
  ${concept('A depth is a profile. It needs no new field, artifact type or verdict. Monotonic extension already guarantees that a derived profile only adds and tightens. A claim already names the profile and version it met, so it already says which depth was reached.')}`});

C4.push({min:1.5,render:()=>`${head('standards','Depth, not maturity level','One term per meaning')}
  <p>The PKI Consortium's PQC Maturity Model grades a product from 0 to 5. A level there is a judgement, which an external, versioned policy derives from disclosed facts. A profile defines the facts that such a judgement reads. Calling both "maturity level" would give one phrase two meanings, and profiles exclude one of them on principle.</p>
  <div class="tbl"><table><thead><tr><th>Word</th><th>Already means, in this methodology</th></tr></thead><tbody>
   <tr><td>level</td><td>How binding one rule is: MUST, SHOULD or MAY</td></tr>
   <tr><td>stage</td><td>Where a document's facts came from: intended, implemented, configured or observed</td></tr>
   <tr><td>band</td><td>A range of carrier versions a profile accepts: target, legacy, newer, refused</td></tr>
   <tr><td>tier</td><td>Position in a supply chain, and a pattern of profile ownership</td></tr>
   <tr><td>maturity level</td><td>A judgement derived from disclosed facts by external policy</td></tr>
  </tbody></table></div>
  <div class="box"><h3>Where the two efforts meet</h3><p style="margin:0">Level 4 of the PQC Maturity Model requires CBOM support, and does not say what a CBOM must contain. A profile is that definition, written so that a document can be checked against it mechanically. The maturity model consumes the facts. The profile specifies them.</p></div>`});

C4.push({min:1.5,render:()=>`${head('rules','What makes a family a ladder','Publishing profiles in order is not enough')}
  <p>A ladder claims that a document conforming at one depth also conforms at every shallower depth. The claim holds only under these conditions.</p>
  <div class="tbl wide"><table><thead><tr><th>Condition</th><th>What goes wrong without it</th></tr></thead><tbody>
   <tr><td>A deeper profile drops no rule</td><td>A document can conform to the deeper profile and fail the shallower one.</td></tr>
   <tr><td>A shared rule is identical, or tightened through an overrides block</td><td>Two rules with one id and different constraints are two rules. A citation of the id no longer names one requirement.</td></tr>
   <tr><td>Shared rules resolve against identical vocabularies</td><td>The same rule text can permit different values at two depths. Nobody sees it by reading the rule.</td></tr>
   <tr><td>The disclosure marker convention is identical</td><td>A producer's "withheld" marker at one depth reads as silence at the other.</td></tr>
   <tr><td>Scope and carrier range do not widen</td><td>A deeper profile accepting a stage or version the shallower one rejects breaks the containment.</td></tr>
   <tr><td>Orientation is the same</td><td>The derived profile is a branch, not a depth.</td></tr>
  </tbody></table></div>
  <p>Branches declare <span class="mono">extends</span>, so the validator refuses any that relax their base. The entry profile and the baseline are siblings: neither extends the other. For them, <span class="mono">tests/check-family.py</span> checks every condition in the table. It also checks that every committed document conforming to the baseline conforms to the entry profile, and it lists the documents that sit between the depths.</p>

C5.push({min:1.5,render:()=>`${head('rules','A profile sets a floor and cannot set a maximum','No rule fails a document for saying more')}
  <p>Every count in the constraint vocabulary is a minimum: <span class="mono">minCount</span>, <span class="mono">minInterfaces</span>, <span class="mono">minInterfacesOfType</span>, <span class="mono">minProviders</span>. There is no maximum of any kind, so a profile cannot say "do not disclose X". That is deliberate.</p>
  <ol class="steps">
   <li><span class="n">1</span><div><b>A maximum would break monotonicity</b>A document that conforms to a derived profile also conforms to its base, because a derived profile only adds or tightens rules. A deeper profile could not tighten a maximum, and a document could pass the derived profile while failing the base for containing something extra.</div></li>
   <li><span class="n">2</span><div><b>It is outside the methodology's scope</b>A profile is a minimum reporting requirement. What a producer may not say belongs to its own policy and to the contract it discloses under.</div></li>
   <li><span class="n">3</span><div><b>The wrong party would enforce it</b>The consumer holds the document and runs the validator. A producer cannot rely on someone else's validator to protect its secrets.</div></li>

  ${concept('Confidentiality is controlled where the document is produced, in the select, filter and redact step. The profile is the acceptance test when the document is released. A profile can still state its side of the bargain. It cannot say "this must not be disclosed". It can say "this rule may be satisfied by a marker".')}`});

  <div class="tiles3">

  <div class="dd">
   <div class="dont"><h3>${I.x} Not a reason for</h3>
    <h4>Dropping the marker</h4><p>Silent redaction produces <span class="mono">undeclared</span> and fails the rule. It is the one option that costs the producer conformance.</p>
    <h4>Publishing nothing</h4><p>"We cannot publish our library versions" is an argument about one rule. Interfaces, protocols and protocol versions are rarely the sensitive part, and the entry profile exists so that a reachable bar is there.</p>
    <h4>A floor set to nothing</h4><p>If every contested rule in the public profile is withholdable, a conforming public variant answers no question. Check that it still separates the consumer's options when every permitted withholding is used.</p>
    <h4>Excluding key material</h4><p>Private keys and seeds are outside every profile, at every depth and in every variant. That exclusion is permanent. It is not a confidentiality decision, and a restricted variant is not where keys go.</p></div>

    <h4>Combining documents</h4><p>One product's CBOM says little that its datasheet and release notes do not. Correlate the documents for a whole estate and you have a list of targets ordered by weakness. That combined artifact is the inventory, which is why the inventory is the asset to protect.</p>

C7.push({min:1.5,render:()=>`${head('chain','Point to it, do not carry it','Joined, not merged')}
  <p>A consumer usually needs more than the cryptographic facts: the SBOM of the same product, the vendor's vulnerability statements, the configuration a deployment record was read from, the evidence behind an observation. Each changes on its own schedule, or another party holds it. So the CBOM points to it.</p>

  ${concept('Vulnerability data is joined to a CBOM, not merged into it, and the same holds for all context. A CBOM records facts that change when the product or the deployment changes. Anything that changes on another trigger, or that someone else holds, is joined and not merged.')}`});

C7.push({min:1.5,render:()=>`${head('mapping','Three kinds of reference','Only the third is a context pointer')}

C7.push({min:1.5,render:()=>`${head('rules','Context kinds and reference rules','A third kind of rule, beside P and I')}
  <p>A profile declares two things. Its <span class="mono">contextKinds</span> block defines each kind of context, the CycloneDX <span class="mono">externalReferences</span> types that can carry it, and its form. Its reference rules, numbered with the letter R, require a pointer to one of those kinds. They are cited like any other rule, for example <span class="mono">interface-disclosure#R2</span>.</p>
  <div class="tiles3">
   <div class="tile3"><h4>${I.doc}document</h4><p>A fixed artefact. The pointer binds it by hash, so a consumer can tell whether it changed.</p></div>
   <div class="tile3"><h4>${I.iface}endpoint</h4><p>A feed, API or web page whose content changes. The pointer names its access protocol.</p></div>
   <div class="tile3"><h4>${I.mapping}document-or-endpoint</h4><p>Either one, as the producer chooses.</p></div>
  </div>
  <div class="two" style="margin-top:6px">

}</pre></div>
   <div class="box"><h3>Reading the fields</h3><p style="margin:0">The rule asks for a pointer to vulnerability statements on the document, at MUST, for products. A document target needs a hash. The producer may state instead that no such artefact exists, using <span class="mono">not-published</span> or <span class="mono">not-applicable-to-subject</span>. It may not withhold the pointer. Profile check C18 makes sure every rule names a kind the family defines, carried by real CycloneDX reference types.</p></div>

  <p>A document-level pointer sits on the subject. An interface-level pointer, such as configuration guidance, sits on the interface's component. CycloneDX 2.0 allows properties on external references, which is what makes the second and third items possible.</p>

   <li><span class="n">1</span><div>A CycloneDX reference <b>type</b> from the kind's carrier types.</div></li>

C7.push({min:0,next:null,render:()=>`${head('chain','Context pointers','Summary')}
  <p style="font-size:18px">A context pointer names an artefact the CBOM needs and does not carry. Profiles define the kinds, and reference rules say which pointers a document must contain. Conformance checks the pointer and never the target.</p>
  <h3 style="margin-top:22px">Follow these practices</h3>
  ${dash(['Point to the SBOM, VEX, configuration and evidence. Do not copy them into the CBOM.','Bind every document target by SHA-256, and name the access protocol of every endpoint.','State an absence such as not-published instead of leaving a required pointer out.','Pass targets with --with when you validate, so their hashes are checked.','Read and judge a target yourself before you rely on it.','Let claims and results point to the record by digest, never the other way round.'])}

const COURSES={F1,F2,F3,F4,F5,A1,A2,A3,A4,C1,C2,C3,C4,C5,C6,C7};

/* ---------- hub ---------- */
let pathSel=store.get('path')||'all';
function hub(){
  const done=store.get('done')||{};const pos=store.get('pos')||{};
  const ids=PATHS[pathSel].ids;
  const tot=ids?ids.reduce((a,id)=>a+MODULES.find(m=>m.id===id).min,0):MODULES.reduce((a,m)=>a+m.min,0);
  const card=m=>{const inPath=!ids||ids.includes(m.id);
    const st=m.ready?(done[m.id]?'<span class="status done">Completed ✓</span>':pos[m.id]?`<span class="status go">Resume at screen ${pos[m.id]+1} →</span>`:'<span class="status go">Start →</span>'):'<span class="status plan">In preparation</span>';
    const inner=`<span class="ico">${I[m.icon]}</span><span><span class="code">${m.id} · ${m.min} min</span><h3>${m.t}</h3><p>${m.s}</p><span class="row">${st}</span></span>`;
    return m.ready?`<button class="card${inPath?'':' dim'}" data-open="${m.id}">${inner}</button>`:`<div class="card planned${inPath?'':' dim'}">${inner}</div>`};
  document.getElementById('app').innerHTML=`<section class="screen">
   <div class="hero"><div><div class="eyebrow">PKI Consortium · CBOM Profiles Working Group</div><h1 style="margin-top:10px">Cryptographic bills of materials, profile by profile</h1>
    <p class="lede">A series of short modules that follows the CBOM profiles methodology. Each takes 10 to 15 minutes and ends with a knowledge check.</p></div>
    <div class="pilot"><b>Three tracks ready.</b> Foundation, Concepts and Applying it can be taken now. The ${MODULES.filter(m=>!m.ready).length} electives show what comes next. Your progress is saved in this browser only.</div></div>
   <div class="eyebrow" style="margin-bottom:10px">Learning path</div>
   <div class="paths">${Object.entries(PATHS).map(([k,p])=>`<button class="pathbtn" data-path="${k}" aria-pressed="${k===pathSel}">${p.label}</button>`).join('')}</div>
   <div class="pathnote">${PATHS[pathSel].note?PATHS[pathSel].note+' ':''}${ids?ids.length:MODULES.length} modules, about ${Math.round(tot/6)/10} hours.${ids?' Order: '+ids.join(' → '):''}</div>
   ${TRACKS.map(t=>{const ms=MODULES.filter(m=>m.id[0]===t.id);return `<div class="track"><div class="track-head"><h2>${t.name}</h2><span>${t.blurb}</span></div><div class="cards">${ms.map(card).join('')}</div></div>`}).join('')}
   <p class="disclaimer" style="margin-top:36px">Built from the <a href="../methodology/">CBOM profiles methodology</a>, which is illustrative and not a normative deliverable of the working group. Send comments and corrections through the <a href="https://github.com/pkic/cbom/issues">working group issues</a>.</p>
  </section>`;
  document.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>{pathSel=b.dataset.path;store.set('path',pathSel);hub()});
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openModule(b.dataset.open));
}

/* ---------- course player ---------- */
let mod=null,cur=0;
function openModule(id,at){mod=id;const pos=store.get('pos')||{};cur=at??pos[id]??0;try{history.replaceState(null,'','#'+id.toLowerCase())}catch(e){}go(cur)}
function toHub(){mod=null;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}document.getElementById('back-hub').hidden=true;hub();window.scrollTo(0,0)}
function go(to){const S=COURSES[mod];cur=Math.max(0,Math.min(S.length-1,to));const s=S[cur];const m=MODULES.find(x=>x.id===mod);
  document.getElementById('back-hub').hidden=false;
  const left=S.slice(cur).reduce((a,b)=>a+b.min,0);
  const nav=`<div class="nav">${cur>0?'<button class="btn ghost" id="prev">← Back</button>':'<span></span>'}${s.next===null?'<button class="btn ghost" id="restart">Restart module</button>':`<button class="btn" id="next">${s.next||'Next →'}</button>`}</div>`;
  document.getElementById('app').innerHTML=`<div class="progress" aria-hidden="true">${S.map((_,i)=>`<span class="${i<=cur?'on':''}"></span>`).join('')}</div>
   <div class="meta-top"><span><b>${m.id}</b> · ${m.t}</span><span>Screen ${cur+1} of ${S.length}${left?` · about ${Math.ceil(left)} min left`:''}</span></div>
   <section class="screen">${s.render()}${nav}</section>`;
  s.init&&s.init();
  const p=document.getElementById('prev');if(p)p.onclick=()=>go(cur-1);
  const n=document.getElementById('next');if(n)n.onclick=()=>go(cur+1);
  const r=document.getElementById('restart');if(r)r.onclick=()=>go(0);
  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>b.dataset.goto==='hub'?toHub():openModule(b.dataset.goto,0));
  const pos=store.get('pos')||{};pos[mod]=cur;store.set('pos',pos);
  window.scrollTo(0,0);}
document.getElementById('home').onclick=toHub;
document.getElementById('back-hub').onclick=toHub;
document.addEventListener('keydown',e=>{if(!mod||e.target.closest('input,textarea'))return;if(e.key==='ArrowRight'&&COURSES[mod][cur].next!==null)go(cur+1);if(e.key==='ArrowLeft'&&cur>0)go(cur-1)});
const h=(location.hash||'').slice(1).toUpperCase();
if(COURSES[h])openModule(h);else hub();
</script>
