<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 676" width="1050" height="676"
     role="img" aria-label="All twenty-five readiness gaps the report identifies, grouped into six categories. Ten are answered by the profile specification alone, twelve need the specification and something else as well, two need something else entirely, and one, the absence of any way to express cryptography applied between two parties, is raised with the specification bodies rather than solved. A profile is strong where the problem is incommensurability and weak where the problem is absence." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g font-family="Cambria, Caladea, Georgia, 'Times New Roman', serif" fill="#1a1a1a">
    <text x="30" y="46" font-size="13" font-weight="bold" fill="#5a5a55">Standards</text>
    <line x1="30" y1="54" x2="185" y2="54" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="30" y="68" width="155" height="58" rx="3" fill="#BCD3E9"/>
    <text x="41" y="85" font-size="10.5" font-weight="bold" fill="#16232E">STD-01</text>
    <text x="41" y="101" font-size="11.5" fill="#3D4A56">Format asymmetry</text>
    <rect x="30" y="134" width="155" height="58" rx="3" fill="#BCD3E9"/>
    <text x="41" y="151" font-size="10.5" font-weight="bold" fill="#16232E">STD-02</text>
    <text x="41" y="167" font-size="11.5" fill="#3D4A56">Thin registry</text>
    <text x="41" y="180" font-size="11.5" fill="#3D4A56">coverage</text>
    <rect x="30" y="200" width="155" height="58" rx="3" fill="#FFFFFF" stroke="#B3512F" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text x="41" y="217" font-size="10.5" font-weight="bold" fill="#B3512F">STD-03</text>
    <text x="41" y="233" font-size="11.5" fill="#B3512F">No relationship</text>
    <text x="41" y="246" font-size="11.5" fill="#B3512F">expression</text>
    <rect x="30" y="266" width="155" height="58" rx="3" fill="#1F5FA9"/>
    <text x="41" y="283" font-size="10.5" font-weight="bold" fill="#FFFFFF">STD-04</text>
    <text x="41" y="299" font-size="11.5" fill="#D6E4F4">Roadmap commitments</text>
    <text x="41" y="312" font-size="11.5" fill="#D6E4F4">unstructured</text>
    <rect x="30" y="332" width="155" height="58" rx="3" fill="#1F5FA9"/>
    <text x="41" y="349" font-size="10.5" font-weight="bold" fill="#FFFFFF">STD-05</text>
    <text x="41" y="365" font-size="11.5" fill="#D6E4F4">No conformance path</text>
    <rect x="30" y="398" width="155" height="58" rx="3" fill="#BCD3E9"/>
    <text x="41" y="415" font-size="10.5" font-weight="bold" fill="#16232E">STD-06</text>
    <text x="41" y="431" font-size="11.5" fill="#3D4A56">Fragmented PKI</text>
    <text x="41" y="444" font-size="11.5" fill="#3D4A56">models</text>
    <rect x="30" y="464" width="155" height="58" rx="3" fill="#BCD3E9"/>
    <text x="41" y="481" font-size="10.5" font-weight="bold" fill="#16232E">STD-07</text>
    <text x="41" y="497" font-size="11.5" fill="#3D4A56">Protocol profiling</text>
    <text x="41" y="510" font-size="11.5" fill="#3D4A56">still landing</text>
    <text x="197" y="46" font-size="13" font-weight="bold" fill="#5a5a55">Discovery and tooling</text>
    <line x1="197" y1="54" x2="352" y2="54" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="197" y="68" width="155" height="58" rx="3" fill="#1F5FA9"/>
    <text x="208" y="85" font-size="10.5" font-weight="bold" fill="#FFFFFF">TOOL-01</text>
    <text x="208" y="101" font-size="11.5" fill="#D6E4F4">Scanners miss</text>
    <text x="208" y="114" font-size="11.5" fill="#D6E4F4">configuration</text>
    <rect x="197" y="134" width="155" height="58" rx="3" fill="#1F5FA9"/>
    <text x="208" y="151" font-size="10.5" font-weight="bold" fill="#FFFFFF">TOOL-02</text>
    <text x="208" y="167" font-size="11.5" fill="#D6E4F4">Opaque firmware</text>
    <text x="208" y="180" font-size="11.5" fill="#D6E4F4">and modules</text>
    <rect x="197" y="200" width="155" height="58" rx="3" fill="#BCD3E9"/>
    <text x="208" y="217" font-size="10.5" font-weight="bold" fill="#16232E">TOOL-03</text>
    <text x="208" y="233" font-size="11.5" fill="#3D4A56">Observed state</text>
    <text x="208" y="246" font-size="11.5" fill="#3D4A56">unmeasurable</text>
    <rect x="197" y="266" width="155" height="58" rx="3" fill="#1F5FA9"/>
    <text x="208" y="283" font-size="10.5" font-weight="bold" fill="#FFFFFF">TOOL-04</text>
    <text x="208" y="299" font-size="11.5" fill="#D6E4F4">False positives</text>
    <text x="208" y="312" font-size="11.5" fill="#D6E4F4">unusable</text>
    <text x="364" y="46" font-size="13" font-weight="bold" fill="#5a5a55">Commercial</text>
    <line x1="364" y1="54" x2="519" y2="54" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="364" y="68" width="155" height="58" rx="3" fill="#1F5FA9"/>
    <text x="375" y="85" font-size="10.5" font-weight="bold" fill="#FFFFFF">COM-01</text>
    <text x="375" y="101" font-size="11.5" fill="#D6E4F4">No procurement</text>
    <text x="375" y="114" font-size="11.5" fill="#D6E4F4">language</text>
    <rect x="364" y="134" width="155" height="58" rx="3" fill="#BCD3E9"/>
    <text x="375" y="151" font-size="10.5" font-weight="bold" fill="#16232E">COM-02</text>
    <text x="375" y="167" font-size="11.5" fill="#3D4A56">No obligation</text>
    <text x="375" y="180" font-size="11.5" fill="#3D4A56">to supply</text>
    <rect x="364" y="200" width="155" height="58" rx="3" fill="#1F5FA9"/>
    <text x="375" y="217" font-size="10.5" font-weight="bold" fill="#FFFFFF">COM-03</text>
    <text x="375" y="233" font-size="11.5" fill="#D6E4F4">Disclosure resistance</text>
    <rect x="364" y="266" width="155" height="58" rx="3" fill="#BCD3E9"/>
    <text x="375" y="283" font-size="10.5" font-weight="bold" fill="#16232E">COM-04</text>
    <text x="375" y="299" font-size="11.5" fill="#3D4A56">Tier-2 opacity</text>
    <rect x="364" y="332" width="155" height="58" rx="3" fill="#DCDCD4"/>
    <text x="375" y="349" font-size="10.5" font-weight="bold" fill="#5A5A55">COM-05</text>
    <text x="375" y="365" font-size="11.5" fill="#6B6B6B">Legacy products</text>
    <text x="375" y="378" font-size="11.5" fill="#6B6B6B">never get one</text>
    <text x="531" y="46" font-size="13" font-weight="bold" fill="#5a5a55">Organisational</text>
    <line x1="531" y1="54" x2="686" y2="54" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="531" y="68" width="155" height="58" rx="3" fill="#BCD3E9"/>
    <text x="542" y="85" font-size="10.5" font-weight="bold" fill="#16232E">ORG-01</text>
    <text x="542" y="101" font-size="11.5" fill="#3D4A56">Crypto outside</text>
    <text x="542" y="114" font-size="11.5" fill="#3D4A56">asset management</text>
    <rect x="531" y="134" width="155" height="58" rx="3" fill="#BCD3E9"/>
    <text x="542" y="151" font-size="10.5" font-weight="bold" fill="#16232E">ORG-02</text>
    <text x="542" y="167" font-size="11.5" fill="#3D4A56">No named owner</text>
    <rect x="531" y="200" width="155" height="58" rx="3" fill="#BCD3E9"/>
    <text x="542" y="217" font-size="10.5" font-weight="bold" fill="#16232E">ORG-03</text>
    <text x="542" y="233" font-size="11.5" fill="#3D4A56">Data sits away</text>
    <text x="542" y="246" font-size="11.5" fill="#3D4A56">from skills</text>
    <text x="698" y="46" font-size="13" font-weight="bold" fill="#5a5a55">Lifecycle</text>
    <line x1="698" y1="54" x2="853" y2="54" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="698" y="68" width="155" height="58" rx="3" fill="#DCDCD4"/>
    <text x="709" y="85" font-size="10.5" font-weight="bold" fill="#5A5A55">LIFE-01</text>
    <text x="709" y="101" font-size="11.5" fill="#6B6B6B">Decade-long</text>
    <text x="709" y="114" font-size="11.5" fill="#6B6B6B">service lives</text>
    <rect x="698" y="134" width="155" height="58" rx="3" fill="#BCD3E9"/>
    <text x="709" y="151" font-size="10.5" font-weight="bold" fill="#16232E">LIFE-02</text>
    <text x="709" y="167" font-size="11.5" fill="#3D4A56">Hardware cannot</text>
    <text x="709" y="180" font-size="11.5" fill="#3D4A56">move on software</text>
    <rect x="698" y="200" width="155" height="58" rx="3" fill="#1F5FA9"/>
    <text x="709" y="217" font-size="10.5" font-weight="bold" fill="#FFFFFF">LIFE-03</text>
    <text x="709" y="233" font-size="11.5" fill="#D6E4F4">Backward</text>
    <text x="709" y="246" font-size="11.5" fill="#D6E4F4">compatibility</text>
    <text x="865" y="46" font-size="13" font-weight="bold" fill="#5a5a55">Policy</text>
    <line x1="865" y1="54" x2="1020" y2="54" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="865" y="68" width="155" height="58" rx="3" fill="#1F5FA9"/>
    <text x="876" y="85" font-size="10.5" font-weight="bold" fill="#FFFFFF">POL-01</text>
    <text x="876" y="101" font-size="11.5" fill="#D6E4F4">Format named,</text>
    <text x="876" y="114" font-size="11.5" fill="#D6E4F4">not content</text>
    <rect x="865" y="134" width="155" height="58" rx="3" fill="#1F5FA9"/>
    <text x="876" y="151" font-size="10.5" font-weight="bold" fill="#FFFFFF">POL-02</text>
    <text x="876" y="167" font-size="11.5" fill="#D6E4F4">Member State</text>
    <text x="876" y="180" font-size="11.5" fill="#D6E4F4">divergence</text>
    <rect x="865" y="200" width="155" height="58" rx="3" fill="#BCD3E9"/>
    <text x="876" y="217" font-size="10.5" font-weight="bold" fill="#16232E">POL-03</text>
    <text x="876" y="233" font-size="11.5" fill="#3D4A56">Suppliers</text>
    <text x="876" y="246" font-size="11.5" fill="#3D4A56">rationally wait</text>
    <rect x="531" y="306" width="26" height="26" rx="3" fill="#1F5FA9"/>
    <text x="567" y="317" font-size="13" font-weight="bold">Answered by the specification</text>
    <text x="567" y="334" font-size="12.5" fill="#5a5a55">10 gaps</text>
    <rect x="781" y="306" width="26" height="26" rx="3" fill="#BCD3E9"/>
    <text x="817" y="317" font-size="13" font-weight="bold">Specification, plus something else</text>
    <text x="817" y="334" font-size="12.5" fill="#5a5a55">12 gaps</text>
    <rect x="531" y="380" width="26" height="26" rx="3" fill="#DCDCD4"/>
    <text x="567" y="391" font-size="13" font-weight="bold">Needs something else entirely</text>
    <text x="567" y="408" font-size="12.5" fill="#5a5a55">2 gaps</text>
    <rect x="781" y="380" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#B3512F" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text x="817" y="391" font-size="13" font-weight="bold">Raised, not solved</text>
    <text x="817" y="408" font-size="12.5" fill="#5a5a55">1 gap</text>
    <line x1="30" y1="556" x2="1020" y2="556" stroke="#c9c9c2" stroke-width="1"/>
    <text x="30" y="582" font-size="14.5">Read the pattern rather than the cells. A profile is strong where the problem is incommensurability, meaning parties answering different questions</text>
    <text x="30" y="602" font-size="14.5">in different words. It is weak or useless where the problem is absence: absent visibility, absent obligation, absent budget, absent hardware.</text>
    <text x="30" y="622" font-size="14.5">Ten gaps are answered by the specification. Twelve need it and something else. Two need something else entirely, and one has to be raised</text>
    <text x="30" y="642" font-size="14.5">where the models are made. That split is what shapes the recommendations in chapter 12.</text>
    <text x="30" y="668" font-size="12" fill="#6b6b6b">The four levels are read from the third column of &#167;8.2. The report itself states only what a profile does and what it does not do.</text>
  </g>
</svg>
