<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690"
     role="img" aria-label="The profile needs to express a cryptographic relationship: two named endpoints, a direction, a purpose, algorithms, a lifecycle stage and a classical retirement state. CycloneDX carries the cryptographic vocabulary in detail but models everything as components, so a relationship has to be simulated by a protocol component whose participant array is unordered and loses the direction. SPDX has a first-class directional Relationship element that can carry extensions and timestamps, but has no cryptography profile and no algorithm vocabulary. Neither format has both halves. Six attributes are unmappable natively in both, and all six describe the status of an assertion rather than a cryptographic fact." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g font-family="Cambria, Caladea, Georgia, 'Times New Roman', serif" fill="#1a1a1a">

    <!-- ============ what must be expressed ============ -->
    <rect x="250" y="30" width="400" height="118" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
    <text x="450" y="56" font-size="16" font-weight="bold" text-anchor="middle">What the profile needs to express</text>
    <line x1="272" y1="68" x2="628" y2="68" stroke="#c9c9c2" stroke-width="1"/>
    <g font-size="13.5" fill="#3d3d3d">
      <text x="272" y="90">two named endpoints, and which is which</text>
      <text x="272" y="110">purpose, algorithms and parameters</text>
      <text x="272" y="130">lifecycle stage, and a classical retirement state</text>
    </g>

    <line x1="330" y1="152" x2="250" y2="186" stroke="#6b6b6b" stroke-width="1.4"/>
    <line x1="570" y1="152" x2="650" y2="186" stroke="#6b6b6b" stroke-width="1.4"/>

    <!-- ============ CycloneDX ============ -->
    <rect x="20" y="190" width="410" height="270" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="225" y="218" font-size="17" font-weight="bold" text-anchor="middle">CycloneDX 1.7</text>
    <text x="225" y="240" font-size="14.5" text-anchor="middle" fill="#1f5fa9" font-weight="bold">has the vocabulary</text>
    <line x1="42" y1="254" x2="408" y2="254" stroke="#c9c9c2" stroke-width="1"/>

    <text x="42" y="278" font-size="13.5" font-weight="bold" fill="#1f5fa9">Carries natively</text>
    <g font-size="13" fill="#3d3d3d">
      <text x="42" y="298">algorithm primitive, parameter set, curve, mode,</text>
      <text x="42" y="316">padding, security levels, OID, crypto functions</text>
      <text x="42" y="334">certificate and key material properties</text>
      <text x="42" y="352">protocol type, version and cipher suites</text>
    </g>

    <text x="42" y="382" font-size="13.5" font-weight="bold" fill="#5a5a55">What it costs</text>
    <g font-size="13" fill="#5a5a55">
      <text x="42" y="402">Cryptography is modelled as components, so a</text>
      <text x="42" y="420">relationship must be simulated by a protocol</text>
      <text x="42" y="438">component pointing at its participants. That</text>
      <text x="42" y="456">array is unordered: the direction is lost.</text>
    </g>

    <!-- ============ SPDX ============ -->
    <rect x="470" y="190" width="410" height="270" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="675" y="218" font-size="17" font-weight="bold" text-anchor="middle">SPDX 3.0.1</text>
    <text x="675" y="240" font-size="14.5" text-anchor="middle" fill="#1f5fa9" font-weight="bold">has the object model</text>
    <line x1="492" y1="254" x2="858" y2="254" stroke="#c9c9c2" stroke-width="1"/>

    <text x="492" y="278" font-size="13.5" font-weight="bold" fill="#1f5fa9">Carries natively</text>
    <g font-size="13" fill="#3d3d3d">
      <text x="492" y="298">Relationship is an Element in its own right</text>
      <text x="492" y="316">from and to, so the direction survives</text>
      <text x="492" y="334">completeness, startTime and endTime</text>
      <text x="492" y="352">it can carry extensions and annotations</text>
    </g>

    <text x="492" y="382" font-size="13.5" font-weight="bold" fill="#5a5a55">What it costs</text>
    <g font-size="13" fill="#5a5a55">
      <text x="492" y="402">There is no cryptography profile among the</text>
      <text x="492" y="420">nine compliance points, and no algorithm</text>
      <text x="492" y="438">vocabulary. Every cryptographic attribute</text>
      <text x="492" y="456">goes into the Extension profile.</text>
    </g>

    <!-- ============ the finding ============ -->
    <rect x="20" y="486" width="860" height="52" rx="4" fill="#e8eff7"/>
    <text x="450" y="508" font-size="15.5" font-weight="bold" text-anchor="middle" fill="#1f5fa9">Neither format has both halves. That is GAP-STD-01 and GAP-STD-03 meeting in one table,</text>
    <text x="450" y="528" font-size="15.5" font-weight="bold" text-anchor="middle" fill="#1f5fa9">and it is why RDY-09 asks that the modelling gap be raised where the models are made.</text>

    <!-- ============ unmappable in both ============ -->
    <rect x="20" y="558" width="860" height="94" rx="4" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="6 3"/>
    <text x="42" y="582" font-size="15" font-weight="bold">Six attributes are unmappable natively in both formats</text>
    <g font-size="13.5" fill="#3d3d3d">
      <text x="42" y="606">declared orientation</text>
      <text x="230" y="606">endpoint role</text>
      <text x="390" y="606">non-security justification</text>
      <text x="620" y="606">classical retirement state</text>
      <text x="42" y="626">roadmap commitment</text>
      <text x="230" y="626">statement kind</text>
    </g>
    <text x="390" y="626" font-size="13.5" font-style="italic" fill="#5a5a55">Every one of them describes the status of an assertion,</text>
    <text x="390" y="644" font-size="13.5" font-style="italic" fill="#5a5a55">not a cryptographic fact. That is one upstream request, not six.</text>

    <text x="20" y="678" font-size="13" fill="#6b6b6b">Field names read from the CycloneDX 1.7 schema and the SPDX 3.0.1 specification in September 2026.</text>
  </g>
</svg>
