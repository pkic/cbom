<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424"
     role="img" aria-label="A buyer contracts with one supplier and can question only that supplier. The cryptography that determines the buyer's exposure is chosen two and three tiers further up, by parties the buyer has no contract with. Each tier can answer correctly for itself, and no tier can answer for the chain." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="f7a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#6b6b6b"/>
    </marker>
    <marker id="f7b" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#1f5fa9"/>
    </marker>
  </defs>

  <g font-family="Cambria, Caladea, Georgia, 'Times New Roman', serif" fill="#1a1a1a">

    <!-- ============ visibility band ============ -->
    <text x="25" y="30" font-size="14" font-weight="bold" fill="#5a5a55">What the buyer can see and question</text>
    <line x1="25" y1="56" x2="424" y2="56" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#f7a)"/>
    <line x1="438" y1="40" x2="438" y2="72" stroke="#1a1a1a" stroke-width="2.6"/>
    <text x="452" y="61" font-size="14" font-style="italic" fill="#5a5a55">visibility stops at the contract</text>

    <!-- ============ the four tiers ============ -->
    <rect x="25" y="88" width="190" height="112" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
    <text x="120" y="116" font-size="18" font-weight="bold" text-anchor="middle">Buyer</text>
    <text x="120" y="140" font-size="13.5" text-anchor="middle" fill="#5a5a55">operator, integrator or</text>
    <text x="120" y="158" font-size="13.5" text-anchor="middle" fill="#5a5a55">contracting authority</text>
    <text x="120" y="182" font-size="13.5" text-anchor="middle" fill="#5a5a55">holds one contract</text>

    <rect x="245" y="88" width="190" height="112" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="340" y="116" font-size="17" font-weight="bold" text-anchor="middle">Tier 1 supplier</text>
    <text x="340" y="140" font-size="13.5" text-anchor="middle" fill="#5a5a55">ships the product</text>
    <text x="340" y="158" font-size="13.5" text-anchor="middle" fill="#5a5a55">the buyer bought</text>
    <text x="340" y="182" font-size="13.5" text-anchor="middle" fill="#5a5a55">under contract</text>

    <rect x="465" y="88" width="190" height="112" rx="4" fill="#f2f2ef" stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="560" y="116" font-size="17" font-weight="bold" text-anchor="middle">Tier 2 component</text>
    <text x="560" y="140" font-size="13.5" text-anchor="middle" fill="#5a5a55">an embedded module</text>
    <text x="560" y="158" font-size="13.5" text-anchor="middle" fill="#5a5a55">or third-party service</text>
    <text x="560" y="182" font-size="13.5" text-anchor="middle" fill="#5a5a55">no contract with the buyer</text>

    <rect x="685" y="88" width="190" height="112" rx="4" fill="#f2f2ef" stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="780" y="116" font-size="17" font-weight="bold" text-anchor="middle">Tier 3 library</text>
    <text x="780" y="140" font-size="13.5" text-anchor="middle" fill="#5a5a55">where the algorithm</text>
    <text x="780" y="158" font-size="13.5" text-anchor="middle" fill="#5a5a55">is actually chosen</text>
    <text x="780" y="182" font-size="13.5" text-anchor="middle" fill="#5a5a55">no contract with anyone here</text>

    <!-- ============ what each tier can truthfully say ============ -->
    <text x="120" y="226" font-size="13" text-anchor="middle" font-style="italic" fill="#3d3d3d">&#8220;is this product safe</text>
    <text x="120" y="243" font-size="13" text-anchor="middle" font-style="italic" fill="#3d3d3d">to deploy?&#8221;</text>
    <text x="340" y="226" font-size="13" text-anchor="middle" font-style="italic" fill="#3d3d3d">&#8220;true for what I ship&#8221;</text>
    <text x="560" y="226" font-size="13" text-anchor="middle" font-style="italic" fill="#3d3d3d">&#8220;true for my component&#8221;</text>
    <text x="780" y="226" font-size="13" text-anchor="middle" font-style="italic" fill="#3d3d3d">&#8220;true for my library&#8221;</text>

    <!-- ============ exposure band ============ -->
    <line x1="868" y1="286" x2="132" y2="286" stroke="#1f5fa9" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#f7b)"/>
    <text x="875" y="266" font-size="14" font-weight="bold" fill="#1f5fa9" text-anchor="end">Cryptographic exposure is inherited all the way back</text>
    <text x="875" y="310" font-size="13.5" fill="#5a5a55" text-anchor="end">The algorithm chosen at tier 3 sets the buyer&#8217;s risk at tier 0</text>

    <!-- ============ the claim ============ -->
    <line x1="25" y1="348" x2="875" y2="348" stroke="#c9c9c2" stroke-width="1"/>
    <text x="25" y="374" font-size="15">All four answers are correct, and none of them answers the buyer&#8217;s question. Exposure travels down the chain</text>
    <text x="25" y="394" font-size="15">while visibility does not travel up it. The buyer cannot ask, because there is no contract to ask under, and no</text>
    <text x="25" y="414" font-size="15">common form the answer could take even if there were.</text>
  </g>
</svg>
