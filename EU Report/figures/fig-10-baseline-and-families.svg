<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 556" width="920" height="556"
     role="img" aria-label="One EU baseline profile carries the shared vocabulary, obligation levels and conformance rules. Four profile families sit above it, one for each decision: procurement, vulnerability response, migration and compliance. Sector profiles extend a family rather than forking from the baseline. A single supplier artefact can be checked against several profiles at once." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="f10a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#6b6b6b"/>
    </marker>
  </defs>

  <g font-family="Cambria, Caladea, Georgia, 'Times New Roman', serif" fill="#1a1a1a">

    <!-- ============ sector layer ============ -->
    <text x="25" y="34" font-size="13" font-weight="bold" fill="#5a5a55">SECTOR PROFILES extend a family below. They never fork from the baseline.</text>

    <rect x="25" y="48" width="176" height="72" rx="4" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="113" y="76" font-size="16" font-weight="bold" text-anchor="middle">Finance</text>
    <text x="113" y="98" font-size="13" text-anchor="middle" fill="#5a5a55">adds payment HSM</text>
    <text x="113" y="114" font-size="13" text-anchor="middle" fill="#5a5a55">and DORA attributes</text>

    <rect x="217" y="48" width="176" height="72" rx="4" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="305" y="76" font-size="16" font-weight="bold" text-anchor="middle">Energy</text>
    <text x="305" y="98" font-size="13" text-anchor="middle" fill="#5a5a55">adds long-lived field</text>
    <text x="305" y="114" font-size="13" text-anchor="middle" fill="#5a5a55">device attributes</text>

    <rect x="409" y="48" width="176" height="72" rx="4" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="497" y="76" font-size="16" font-weight="bold" text-anchor="middle">Public sector</text>
    <text x="497" y="98" font-size="13" text-anchor="middle" fill="#5a5a55">adds national</text>
    <text x="497" y="114" font-size="13" text-anchor="middle" fill="#5a5a55">primitive vocabularies</text>

    <g stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#f10a)">
      <line x1="113" y1="122" x2="95" y2="204"/>
      <line x1="305" y1="122" x2="374" y2="204"/>
      <line x1="497" y1="122" x2="520" y2="204"/>
    </g>

    <!-- ============ family layer ============ -->
    <rect x="25" y="210" width="134" height="104" rx="4" fill="#e8eff7" stroke="#1f5fa9" stroke-width="2.2"/>
    <text x="92" y="238" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f5fa9">Procurement</text>
    <text x="92" y="262" font-size="13" text-anchor="middle" fill="#3d3d3d">should we buy it?</text>
    <text x="92" y="288" font-size="13" text-anchor="middle" font-style="italic" fill="#1f5fa9">build this one first</text>
    <text x="92" y="305" font-size="13" text-anchor="middle" font-style="italic" fill="#1f5fa9">as the pathfinder</text>

    <rect x="169" y="210" width="134" height="104" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="236" y="238" font-size="16" font-weight="bold" text-anchor="middle">Vulnerability</text>
    <text x="236" y="257" font-size="16" font-weight="bold" text-anchor="middle">response</text>
    <text x="236" y="282" font-size="13" text-anchor="middle" fill="#3d3d3d">are we exposed</text>
    <text x="236" y="299" font-size="13" text-anchor="middle" fill="#3d3d3d">to this break?</text>

    <rect x="313" y="210" width="134" height="104" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="380" y="238" font-size="16" font-weight="bold" text-anchor="middle">Migration</text>
    <text x="380" y="264" font-size="13" text-anchor="middle" fill="#3d3d3d">can we deploy it,</text>
    <text x="380" y="281" font-size="13" text-anchor="middle" fill="#3d3d3d">and what will</text>
    <text x="380" y="298" font-size="13" text-anchor="middle" fill="#3d3d3d">it take?</text>

    <rect x="457" y="210" width="134" height="104" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="524" y="238" font-size="16" font-weight="bold" text-anchor="middle">Compliance</text>
    <text x="524" y="264" font-size="13" text-anchor="middle" fill="#3d3d3d">can a supervisor</text>
    <text x="524" y="281" font-size="13" text-anchor="middle" fill="#3d3d3d">check the claim</text>
    <text x="524" y="298" font-size="13" text-anchor="middle" fill="#3d3d3d">by machine?</text>

    <g stroke="#6b6b6b" stroke-width="1.2">
      <line x1="92" y1="314" x2="92" y2="368"/>
      <line x1="236" y1="314" x2="236" y2="368"/>
      <line x1="380" y1="314" x2="380" y2="368"/>
      <line x1="524" y1="314" x2="524" y2="368"/>
    </g>

    <!-- ============ the baseline ============ -->
    <rect x="25" y="370" width="566" height="92" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
    <text x="308" y="400" font-size="19" font-weight="bold" text-anchor="middle">EU baseline CBOM profile</text>
    <text x="308" y="424" font-size="13.5" text-anchor="middle" fill="#5a5a55">the shared attribute vocabulary, the obligation levels, the conformance rules,</text>
    <text x="308" y="442" font-size="13.5" text-anchor="middle" fill="#5a5a55">and one custodian with a published change process</text>

    <!-- ============ one artefact, several profiles ============ -->
    <line x1="608" y1="48" x2="608" y2="462" stroke="#c9c9c2" stroke-width="1"/>

    <text x="634" y="34" font-size="13" font-weight="bold" fill="#5a5a55">WHAT THE SUPPLIER PRODUCES</text>

    <rect x="634" y="60" width="96" height="124" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <g stroke="#6b6b6b" stroke-width="1.3">
      <line x1="652" y1="88" x2="712" y2="88"/>
      <line x1="652" y1="106" x2="712" y2="106"/>
      <line x1="652" y1="124" x2="712" y2="124"/>
      <line x1="652" y1="142" x2="694" y2="142"/>
      <line x1="652" y1="160" x2="704" y2="160"/>
    </g>
    <text x="682" y="206" font-size="15" font-weight="bold" text-anchor="middle">One artefact</text>
    <text x="682" y="226" font-size="13" text-anchor="middle" fill="#5a5a55">produced once,</text>
    <text x="682" y="243" font-size="13" text-anchor="middle" fill="#5a5a55">at build time</text>

    <line x1="682" y1="262" x2="682" y2="300" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#f10a)"/>
    <text x="700" y="286" font-size="13" font-style="italic" fill="#5a5a55">checked by machine</text>

    <g font-size="13.5" fill="#1a1a1a">
      <text x="634" y="326">against the procurement profile</text>
      <text x="634" y="350">against the migration profile</text>
      <text x="634" y="374">against the finance profile</text>
      <text x="634" y="398">against any future family</text>
    </g>
    <g fill="#1f5fa9">
      <circle cx="624" cy="321" r="3.4"/>
      <circle cx="624" cy="345" r="3.4"/>
      <circle cx="624" cy="369" r="3.4"/>
      <circle cx="624" cy="393" r="3.4"/>
    </g>
    <text x="634" y="432" font-size="13.5" font-style="italic" fill="#5a5a55">The supplier answers once. Each</text>
    <text x="634" y="449" font-size="13.5" font-style="italic" fill="#5a5a55">reader validates what they need.</text>

    <!-- ============ the claim ============ -->
    <line x1="25" y1="484" x2="895" y2="484" stroke="#c9c9c2" stroke-width="1"/>
    <text x="25" y="510" font-size="15">Four families because there are four decisions, not because four sounds thorough. A sector extends a family</text>
    <text x="25" y="530" font-size="15">rather than starting again, so the shared vocabulary holds across all of them. That is what turns regulatory</text>
    <text x="25" y="550" font-size="15">divergence from a duplication problem into a mapping problem.</text>
  </g>
</svg>
