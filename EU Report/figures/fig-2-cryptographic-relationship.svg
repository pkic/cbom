<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 648" width="840" height="648"
     role="img" aria-label="One mutually authenticated connection contains three cryptographic relationships: the connection itself, and each party's reliance on the trust anchor that vouches for the other. Key establishment on the connection is post-quantum while authentication on all three is classical. Both endpoints hold complete and correct inventories of what they implement, and none of the three relationships appears in either inventory." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#6b6b6b"/>
    </marker>
    <marker id="a2s" viewBox="0 0 10 8" refX="1" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <polygon points="10,0 0,4 10,8" fill="#6b6b6b"/>
    </marker>
  </defs>

  <g font-family="Cambria, Caladea, Georgia, 'Times New Roman', serif" fill="#1a1a1a">

    <!-- ============ trust anchors ============ -->
    <rect x="30" y="44" width="220" height="76" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="140" y="70" font-size="17" font-weight="bold" text-anchor="middle">Trust anchor</text>
    <text x="140" y="91" font-size="14" text-anchor="middle" fill="#5a5a55">root the product relies on</text>
    <text x="140" y="110" font-size="14" text-anchor="middle" fill="#5a5a55">to validate the client</text>

    <rect x="590" y="44" width="220" height="76" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="700" y="70" font-size="17" font-weight="bold" text-anchor="middle">Trust anchor</text>
    <text x="700" y="91" font-size="14" text-anchor="middle" fill="#5a5a55">root the client relies on</text>
    <text x="700" y="110" font-size="14" text-anchor="middle" fill="#5a5a55">to validate the product</text>

    <!-- ============ endpoints ============ -->
    <rect x="30" y="366" width="220" height="176" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
    <text x="140" y="394" font-size="18" font-weight="bold" text-anchor="middle">Supplier's product</text>
    <text x="140" y="414" font-size="13.5" text-anchor="middle" fill="#5a5a55">its inventory records</text>
    <g font-size="14" fill="#3d3d3d">
      <text x="48" y="443">ML-KEM-768 implemented</text>
      <text x="48" y="465">ECDHE implemented</text>
      <text x="48" y="487">ECDSA P-256 implemented</text>
      <text x="48" y="509">certificate: ECDSA P-256</text>
      <text x="48" y="531">library: OpenSSL 3.5</text>
    </g>

    <rect x="590" y="366" width="220" height="176" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.4"/>
    <text x="700" y="394" font-size="18" font-weight="bold" text-anchor="middle">Client</text>
    <text x="700" y="414" font-size="13.5" text-anchor="middle" fill="#5a5a55">its inventory records</text>
    <g font-size="14" fill="#3d3d3d">
      <text x="608" y="443">ML-KEM-768 implemented</text>
      <text x="608" y="465">ECDHE implemented</text>
      <text x="608" y="487">ECDSA P-256 implemented</text>
      <text x="608" y="509">certificate: ECDSA P-256</text>
      <text x="608" y="531">library: platform TLS</text>
    </g>

    <!-- ============ relationship 2 and 3: trust anchors ============ -->
    <line x1="140" y1="362" x2="140" y2="124" stroke="#6b6b6b" stroke-width="1.6"
          marker-end="url(#a2)" marker-start="url(#a2s)"/>
    <line x1="700" y1="362" x2="700" y2="124" stroke="#6b6b6b" stroke-width="1.6"
          marker-end="url(#a2)" marker-start="url(#a2s)"/>

    <text x="152" y="210" font-size="15" font-weight="bold" fill="#3d3d3d">Relationship 2</text>
    <text x="152" y="230" font-size="14" fill="#5a5a55">reliance on a root</text>
    <text x="152" y="249" font-size="14" fill="#5a5a55">authentication: classical</text>

    <text x="688" y="210" font-size="15" font-weight="bold" fill="#3d3d3d" text-anchor="end">Relationship 3</text>
    <text x="688" y="230" font-size="14" fill="#5a5a55" text-anchor="end">reliance on a root</text>
    <text x="688" y="249" font-size="14" fill="#5a5a55" text-anchor="end">authentication: classical</text>

    <!-- ============ relationship 1: the connection ============ -->
    <line x1="254" y1="454" x2="586" y2="454" stroke="#1a1a1a" stroke-width="1.8"
          marker-end="url(#a2)" marker-start="url(#a2s)"/>
    <text x="420" y="396" font-size="16" font-weight="bold" text-anchor="middle">Relationship 1</text>
    <text x="420" y="416" font-size="14" text-anchor="middle" fill="#5a5a55">the connection</text>
    <text x="420" y="440" font-size="14.5" text-anchor="middle" fill="#1f5fa9">key establishment: ECDHE + ML-KEM</text>
    <text x="420" y="478" font-size="14.5" text-anchor="middle" fill="#5a5a55">authentication: ECDSA via X.509</text>
    <text x="420" y="504" font-size="14" text-anchor="middle" fill="#3d3d3d" font-style="italic">classical retirement state:</text>
    <text x="420" y="522" font-size="14" text-anchor="middle" fill="#3d3d3d" font-style="italic">classical present</text>

    <!-- post-quantum / classical marks -->
    <text x="420" y="304" font-size="15" font-weight="bold" fill="#1f5fa9" text-anchor="middle">post-quantum on one half,</text>
    <text x="420" y="324" font-size="15" font-weight="bold" fill="#1f5fa9" text-anchor="middle">classical on the other</text>
    <line x1="420" y1="336" x2="420" y2="382" stroke="#1f5fa9" stroke-width="1.2" stroke-dasharray="4 3"/>

    <!-- ============ the claim ============ -->
    <line x1="30" y1="574" x2="810" y2="574" stroke="#c9c9c2" stroke-width="1"/>
    <text x="30" y="600" font-size="15" fill="#1a1a1a">Both inventories are complete and correct. Neither of them contains any of the three relationships, because</text>
    <text x="30" y="620" font-size="15" fill="#1a1a1a">a relationship is a property of the connection rather than of either party. So the buyer's question &#8212; is this</text>
    <text x="30" y="640" font-size="15" fill="#1a1a1a">exchange protected against harvest-now-decrypt-later &#8212; cannot be answered from either side alone.</text>
  </g>
</svg>
