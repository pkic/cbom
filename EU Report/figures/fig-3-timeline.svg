<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 596" width="990" height="596"
     role="img" aria-label="A timeline of the dates that bound this report's recommendations. EU dates above the axis: CRA reporting obligations applied on 11 September 2026, EN 40000-1-4 goes out for enquiry around October 2026, the roadmap's First Steps are due on 31 December 2026, EN 40000-1-4 publishes on 30 October 2027, the CRA applies in full on 11 December 2027, and the roadmap completes high-risk use cases by 2030 and medium-risk by 2035. US dates below: CISA and NIST guidance on minimum elements for a cryptographic bill of materials is due around March 2027 under Executive Order 14412 section 5(d), with post-quantum key establishment on high value assets by 2030, signatures by 2031, and RSA and elliptic curve disallowed after 2035. The window in which a European baseline shapes rather than inherits runs from now to about March 2027." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="t-ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#1a1a1a"/>
    </marker>
  </defs>

  <g font-family="Cambria, Caladea, Georgia, 'Times New Roman', serif" fill="#1a1a1a">

    <!-- the decision window -->
    <rect x="54" y="62" width="250" height="436" fill="#e8eff7"/>
    <text x="179" y="48" font-size="15.5" font-weight="bold" text-anchor="middle" fill="#1f5fa9">the window</text>

    <!-- axis -->
    <line x1="54" y1="330" x2="968" y2="330" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#t-ah)"/>
    <rect x="718" y="320" width="28" height="20" fill="#ffffff"/>
    <path d="M 720 320 L 728 340 M 733 320 L 741 340" stroke="#1a1a1a" stroke-width="1.6" fill="none"/>
    <text x="732" y="356" font-size="12.5" text-anchor="middle" fill="#6b6b6b">scale change</text>

    <!-- lane labels -->
    <text x="18" y="150" font-size="15" font-weight="bold" fill="#3d3d3d" transform="rotate(-90 18 150)" text-anchor="middle">European Union</text>
    <text x="18" y="440" font-size="15" font-weight="bold" fill="#3d3d3d" transform="rotate(-90 18 440)" text-anchor="middle">United States</text>

    <!-- ==================== EU ==================== -->
    <g stroke="#1a1a1a" stroke-width="1.2">
      <line x1="60" y1="330" x2="60" y2="170"/>
      <line x1="100" y1="330" x2="100" y2="244"/>
      <line x1="208" y1="330" x2="208" y2="298"/>
      <line x1="608" y1="330" x2="608" y2="170"/>
      <line x1="660" y1="330" x2="660" y2="244"/>
      <line x1="814" y1="330" x2="814" y2="298"/>
      <line x1="949" y1="330" x2="949" y2="298"/>
    </g>
    <g fill="#1a1a1a">
      <circle cx="60" cy="330" r="4"/><circle cx="100" cy="330" r="4"/><circle cx="208" cy="330" r="4"/>
      <circle cx="608" cy="330" r="4"/><circle cx="660" cy="330" r="4"/>
      <circle cx="814" cy="330" r="4"/><circle cx="949" cy="330" r="4"/>
    </g>

    <text x="60" y="104" font-size="14.5" font-weight="bold">11 Sep 2026</text>
    <text x="60" y="122" font-size="14" fill="#5a5a55">CRA reporting applies</text>

    <text x="608" y="104" font-size="14.5" font-weight="bold">30 Oct 2027</text>
    <text x="608" y="122" font-size="14" fill="#5a5a55">EN 40000-1-4 published</text>

    <text x="100" y="196" font-size="14.5" font-weight="bold">Oct 2026</text>
    <text x="100" y="214" font-size="14" fill="#5a5a55">EN 40000-1-4 goes out</text>
    <text x="100" y="232" font-size="14" fill="#5a5a55">for enquiry</text>

    <text x="660" y="196" font-size="14.5" font-weight="bold">11 Dec 2027</text>
    <text x="660" y="214" font-size="14" fill="#5a5a55">CRA applies in full</text>

    <text x="208" y="268" font-size="14.5" font-weight="bold">31 Dec 2026</text>
    <text x="208" y="286" font-size="14" fill="#5a5a55">roadmap First Steps due</text>

    <text x="962" y="250" font-size="14" font-weight="bold" text-anchor="end" fill="#3d3d3d">roadmap milestones</text>
    <text x="962" y="270" font-size="14" text-anchor="end" fill="#5a5a55">2030 &#8212; high-risk use cases complete</text>
    <text x="962" y="288" font-size="14" text-anchor="end" fill="#5a5a55">2035 &#8212; medium-risk complete</text>

    <!-- ==================== US ==================== -->
    <g stroke="#1f5fa9" stroke-width="1.2">
      <line x1="300" y1="330" x2="300" y2="366"/>
      <line x1="814" y1="330" x2="814" y2="366"/>
      <line x1="841" y1="330" x2="841" y2="366"/>
      <line x1="949" y1="330" x2="949" y2="366"/>
    </g>
    <g fill="#1f5fa9">
      <circle cx="300" cy="330" r="4"/><circle cx="814" cy="330" r="4"/>
      <circle cx="841" cy="330" r="4"/><circle cx="949" cy="330" r="4"/>
    </g>

    <text x="300" y="386" font-size="14.5" font-weight="bold" fill="#1f5fa9">~Mar 2027</text>
    <text x="300" y="404" font-size="14" fill="#1f5fa9">CISA and NIST guidance on minimum</text>
    <text x="300" y="422" font-size="14" fill="#1f5fa9">elements for a cryptographic bill of</text>
    <text x="300" y="440" font-size="14" fill="#1f5fa9">materials (EO 14412, section 5(d))</text>

    <text x="962" y="386" font-size="14" font-weight="bold" text-anchor="end" fill="#1f5fa9">EO 14412 and NIST</text>
    <text x="962" y="406" font-size="14" text-anchor="end" fill="#1f5fa9">2030 &#8212; PQ key establishment on high value assets</text>
    <text x="962" y="424" font-size="14" text-anchor="end" fill="#1f5fa9">2031 &#8212; PQ signatures</text>
    <text x="962" y="442" font-size="14" text-anchor="end" fill="#1f5fa9">2035 &#8212; RSA and ECC disallowed (IR 8547, draft)</text>

    <!-- ==================== footer ==================== -->
    <line x1="30" y1="530" x2="962" y2="530" stroke="#c9c9c2" stroke-width="1"/>
    <text x="30" y="556" font-size="15">A baseline defined inside the window shapes what suppliers build against. One defined after it inherits a</text>
    <text x="30" y="576" font-size="15">specification written elsewhere and spends its effort on mapping.</text>
    <text x="30" y="592" font-size="13" fill="#6b6b6b">Scale is not linear: 2028 onward is compressed. Committee timetables slip, so the 2026 and 2027 standards dates are expectations.</text>
  </g>
</svg>
