<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 866 742" width="866" height="742"
     role="img" aria-label="The post-quantum migration as a chain of six dependent stages, each owned by a different party and blocked until the stage above it completes. Three tracks run on their own timelines: hardware and public key infrastructure converge at deployment, while validation and certification gates entry to products. Seven constraints bound every stage. EU instruments land at the product and deployment stages." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#1a1a1a"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#6b6b6b"/>
    </marker>
  </defs>

  <g font-family="Cambria, Caladea, Georgia, 'Times New Roman', serif" fill="#1a1a1a">

    <!-- ============ constraints band ============ -->
    <rect x="18" y="58" width="186" height="558" rx="6" fill="#f2f2ef" stroke="#c9c9c2" stroke-width="1.2"/>
    <text x="111" y="84" font-size="18" font-weight="bold" text-anchor="middle">Constraints</text>
    <text x="111" y="105" font-size="13.5" text-anchor="middle" fill="#5a5a55">bound every stage</text>
    <g font-size="14">
      <text x="34" y="144">Legacy and budget</text>
      <text x="34" y="174">Expertise and capacity</text>
      <text x="34" y="204">Performance and key sizes</text>
      <text x="34" y="234">Confidence in new</text><text x="34" y="251">algorithms</text>
      <text x="34" y="281">Operational risk and</text><text x="34" y="298">change windows</text>
      <text x="34" y="328">Incentive and threat-</text><text x="34" y="345">timeline uncertainty</text>
      <text x="34" y="375">Regulatory divergence</text><text x="34" y="392">and sovereignty</text>
    </g>
    <line x1="34" y1="424" x2="188" y2="424" stroke="#c9c9c2" stroke-width="1"/>
    <g font-size="13.5" fill="#5a5a55">
      <text x="34" y="450">No profile removes any</text>
      <text x="34" y="468">of these. Six of the seven</text>
      <text x="34" y="486">cost less to operate under</text>
      <text x="34" y="504">once the questions are</text>
      <text x="34" y="522">asked by machine.</text>
    </g>

    <!-- ============ the core chain ============ -->
    <rect x="250" y="58" width="336" height="72" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="266" y="84" font-size="19" font-weight="bold">Algorithm standardisation</text>
    <text x="266" y="106" font-size="14.5" fill="#5a5a55">standards bodies</text>
    <text x="570" y="106" font-size="14.5" text-anchor="end" fill="#5a5a55">substantially complete</text>

    <rect x="250" y="154" width="336" height="72" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="266" y="180" font-size="19" font-weight="bold">Protocol profiling</text>
    <text x="266" y="202" font-size="14.5" fill="#5a5a55">IETF, sector bodies</text>
    <text x="570" y="202" font-size="14.5" text-anchor="end" fill="#5a5a55">TLS done, others not</text>

    <rect x="250" y="250" width="336" height="72" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="266" y="276" font-size="19" font-weight="bold">Library implementation</text>
    <text x="266" y="298" font-size="14.5" fill="#5a5a55">implementers</text>

    <rect x="250" y="346" width="336" height="72" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
    <text x="266" y="372" font-size="19" font-weight="bold">Adoption in products</text>
    <text x="266" y="394" font-size="14.5" fill="#5a5a55">suppliers, through three or four tiers</text>

    <rect x="250" y="442" width="336" height="72" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
    <text x="266" y="468" font-size="19" font-weight="bold">System deployment</text>
    <text x="266" y="490" font-size="14.5" fill="#5a5a55">integrators, operators</text>

    <rect x="250" y="538" width="336" height="78" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
    <text x="266" y="564" font-size="19" font-weight="bold">Classical algorithms off</text>
    <text x="266" y="586" font-size="14.5" fill="#5a5a55">operators</text>
    <text x="266" y="605" font-size="14.5" fill="#5a5a55">the stage most often deferred</text>

    <g stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)">
      <line x1="418" y1="130" x2="418" y2="150"/>
      <line x1="418" y1="226" x2="418" y2="246"/>
      <line x1="418" y1="322" x2="418" y2="342"/>
      <line x1="418" y1="418" x2="418" y2="438"/>
      <line x1="418" y1="514" x2="418" y2="534"/>
    </g>
    <g font-size="13.5" fill="#5a5a55" font-style="italic">
      <text x="428" y="145">blocked until</text>
      <text x="428" y="241">blocked until</text>
      <text x="428" y="337">blocked until</text>
      <text x="428" y="433">blocked until</text>
      <text x="428" y="529">blocked until</text>
    </g>

    <!-- ============ where instruments land ============ -->
    <path d="M 238 346 L 228 346 L 228 514 L 238 514" fill="none" stroke="#1f5fa9" stroke-width="2"/>
    <text x="220" y="430" font-size="14.5" fill="#1f5fa9" font-weight="bold"
          transform="rotate(-90 220 430)" text-anchor="middle">EU instruments land here</text>

    <!-- ============ the three tracks ============ -->
    <rect x="646" y="58" width="164" height="72" rx="4" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="660" y="82" font-size="16" font-weight="bold" fill="#3d3d3d">Hardware and</text>
    <text x="660" y="100" font-size="16" font-weight="bold" fill="#3d3d3d">roots of trust</text>
    <text x="660" y="120" font-size="13.5" fill="#6b6b6b">silicon, HSM, TPM</text>

    <rect x="646" y="154" width="164" height="72" rx="4" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="660" y="178" font-size="16" font-weight="bold" fill="#3d3d3d">PKI and trust</text>
    <text x="660" y="196" font-size="16" font-weight="bold" fill="#3d3d3d">infrastructure</text>
    <text x="660" y="216" font-size="13.5" fill="#6b6b6b">CAs, trust stores</text>

    <rect x="646" y="250" width="164" height="72" rx="4" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="660" y="274" font-size="16" font-weight="bold" fill="#3d3d3d">Validation and</text>
    <text x="660" y="292" font-size="16" font-weight="bold" fill="#3d3d3d">certification</text>
    <text x="660" y="312" font-size="13.5" fill="#6b6b6b">schemes, labs</text>

    <g stroke="#6b6b6b" stroke-width="1.3" marker-end="url(#ahg)">
      <line x1="586" y1="94" x2="642" y2="94"/>
      <line x1="586" y1="190" x2="642" y2="190"/>
      <line x1="586" y1="286" x2="642" y2="286"/>
    </g>

    <path d="M 828 94 L 838 94 L 838 470 L 590 470" fill="none" stroke="#6b6b6b" stroke-width="1.3"
          stroke-dasharray="5 3" marker-end="url(#ahg)"/>
    <path d="M 828 190 L 832 190 L 832 458 L 590 458" fill="none" stroke="#6b6b6b" stroke-width="1.3"
          stroke-dasharray="5 3" marker-end="url(#ahg)"/>
    <text x="852" y="300" font-size="13.5" fill="#6b6b6b" font-style="italic"
          transform="rotate(90 852 300)" text-anchor="middle">converge at deployment</text>

    <path d="M 728 322 L 728 336 L 606 336 L 606 382 L 590 382" fill="none" stroke="#6b6b6b"
          stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ahg)"/>
    <text x="662" y="352" font-size="13.5" fill="#6b6b6b" font-style="italic">gates entry</text>

    <!-- ============ footer note ============ -->
    <line x1="18" y1="650" x2="848" y2="650" stroke="#c9c9c2" stroke-width="1"/>
    <text x="18" y="676" font-size="14.5" fill="#3d3d3d">Each stage is owned by a different party, blocked by the stage above it, and invisible to the parties that</text>
    <text x="18" y="696" font-size="14.5" fill="#3d3d3d">depend on it. That invisibility, not the cryptography, is what a CBOM profile addresses.</text>
    <text x="18" y="722" font-size="13" fill="#6b6b6b">Solid outline: the core chain. Dashed: tracks running on their own timelines. Positions as at September 2026.</text>
  </g>
</svg>
