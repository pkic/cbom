<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 606" width="880" height="606"
     role="img" aria-label="A grid with lifecycle stage on one axis and classical retirement state on the other. A product that has configured post-quantum key establishment while its classical algorithm is still present sits in the lower right of the grid. Migration is complete only in the top right cell, where the classical algorithm has been removed. A scheme that records only the lifecycle axis reports the lower-right position as done." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="f9a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#1f5fa9"/>
    </marker>
  </defs>

  <g font-family="Cambria, Caladea, Georgia, 'Times New Roman', serif" fill="#1a1a1a">

    <!-- ============ shaded bottom row: classical still present ============ -->
    <rect x="220" y="330" width="600" height="110" fill="#f2f2ef"/>

    <!-- ============ grid ============ -->
    <g stroke="#c9c9c2" stroke-width="1">
      <line x1="220" y1="110" x2="820" y2="110"/>
      <line x1="220" y1="220" x2="820" y2="220"/>
      <line x1="220" y1="330" x2="820" y2="330"/>
      <line x1="220" y1="440" x2="820" y2="440"/>
      <line x1="220" y1="110" x2="220" y2="440"/>
      <line x1="370" y1="110" x2="370" y2="440"/>
      <line x1="520" y1="110" x2="520" y2="440"/>
      <line x1="670" y1="110" x2="670" y2="440"/>
      <line x1="820" y1="110" x2="820" y2="440"/>
    </g>

    <!-- ============ y axis: classical retirement state ============ -->
    <text transform="translate(34,275) rotate(-90)" font-size="14" font-weight="bold" fill="#5a5a55" text-anchor="middle">CLASSICAL RETIREMENT STATE</text>
    <g font-size="14.5" text-anchor="end">
      <text x="206" y="160">classical</text>
      <text x="206" y="178">removed</text>
      <text x="206" y="270">classical</text>
      <text x="206" y="288">disabled</text>
      <text x="206" y="380">classical</text>
      <text x="206" y="398">present</text>
    </g>

    <!-- ============ x axis: lifecycle stage ============ -->
    <g font-size="14.5" text-anchor="middle">
      <text x="295" y="466">intended</text>
      <text x="445" y="466">implemented</text>
      <text x="595" y="466">configured</text>
      <text x="745" y="466">observed</text>
    </g>
    <text x="520" y="494" font-size="14" font-weight="bold" fill="#5a5a55" text-anchor="middle">LIFECYCLE STAGE</text>

    <!-- ============ where a 2026 deployment sits ============ -->
    <circle cx="595" cy="385" r="9" fill="#1f5fa9"/>
    <text x="580" y="372" font-size="14.5" font-weight="bold" fill="#1f5fa9" text-anchor="end">the ordinary 2026 position</text>
    <text x="580" y="396" font-size="13.5" fill="#3d3d3d" text-anchor="end">post-quantum key establishment configured,</text>
    <text x="580" y="413" font-size="13.5" fill="#3d3d3d" text-anchor="end">classical authentication still in use</text>

    <!-- ============ the target cell ============ -->
    <rect x="672" y="112" width="146" height="106" fill="#e8eff7" stroke="#1f5fa9" stroke-width="1.8"/>
    <text x="745" y="152" font-size="15" font-weight="bold" fill="#1f5fa9" text-anchor="middle">migration</text>
    <text x="745" y="172" font-size="15" font-weight="bold" fill="#1f5fa9" text-anchor="middle">complete</text>
    <text x="745" y="196" font-size="13" fill="#3d3d3d" text-anchor="middle">nothing classical remains</text>

    <!-- ============ the distance between them ============ -->
    <path d="M 608 372 C 660 330 700 280 728 226" fill="none" stroke="#1f5fa9" stroke-width="2"
          stroke-dasharray="7 4" marker-end="url(#f9a)"/>
    <text x="700" y="300" font-size="13.5" font-style="italic" fill="#1f5fa9">the part that</text>
    <text x="700" y="317" font-size="13.5" font-style="italic" fill="#1f5fa9">has not happened</text>

    <!-- ============ what a one-axis scheme sees ============ -->
    <line x1="520" y1="88" x2="820" y2="88" stroke="#6b6b6b" stroke-width="1.4"/>
    <line x1="520" y1="82" x2="520" y2="94" stroke="#6b6b6b" stroke-width="1.4"/>
    <line x1="820" y1="82" x2="820" y2="94" stroke="#6b6b6b" stroke-width="1.4"/>
    <text x="670" y="72" font-size="14" text-anchor="middle" fill="#5a5a55">everything in this band is reported as &#8220;post-quantum enabled&#8221;</text>

    <!-- ============ the claim ============ -->
    <line x1="30" y1="522" x2="850" y2="522" stroke="#c9c9c2" stroke-width="1"/>
    <text x="30" y="548" font-size="15">The two axes are independent, and almost every reporting scheme carries only the horizontal one. A system</text>
    <text x="30" y="568" font-size="15">that has added a post-quantum algorithm and kept the classical one is genuinely at the dot, and is counted as</text>
    <text x="30" y="588" font-size="15">finished. Only an artefact carrying both axes can say how far the shaded row still extends.</text>
  </g>
</svg>
