<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" height="486"
     role="img" aria-label="Regulation solved the production of software bills of materials but not their use. Four in five organisations rarely or never receive an artefact from their suppliers, and two in three report a gap between producing artefacts and using them. ENISA concludes the artefacts serve compliance rather than security." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="f8h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#b8b8b0" stroke-width="2"/>
    </pattern>
  </defs>

  <g font-family="Cambria, Caladea, Georgia, 'Times New Roman', serif" fill="#1a1a1a">

    <!-- ============ solved / not solved ============ -->
    <rect x="25" y="26" width="400" height="128" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="45" y="54" font-size="16" font-weight="bold">Regulation solved this</text>
    <g font-size="14" fill="#3d3d3d">
      <text x="45" y="82">Artefacts are generated in build pipelines</text>
      <text x="45" y="104">Formats exist and tools emit them</text>
      <text x="45" y="126">Investment followed the obligation, decisively</text>
    </g>

    <rect x="475" y="26" width="400" height="128" rx="4" fill="#f2f2ef" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="495" y="54" font-size="16" font-weight="bold">It did not solve this</text>
    <g font-size="14" fill="#3d3d3d">
      <text x="495" y="82">Buyers do not receive what suppliers produce</text>
      <text x="495" y="104">Those who receive one rarely read it</text>
      <text x="495" y="126">No obligation attached to the consuming side</text>
    </g>

    <line x1="450" y1="60" x2="450" y2="120" stroke="#c9c9c2" stroke-width="1"/>

    <!-- ============ statistic 1 ============ -->
    <text x="25" y="206" font-size="13" font-weight="bold" fill="#5a5a55">ORGANISATIONS RECEIVING AN ARTEFACT FROM THEIR SUPPLIERS</text>
    <text x="25" y="256" font-size="38" font-weight="bold" fill="#1f5fa9">4 in 5</text>

    <g>
      <!-- the four that do not -->
      <rect x="180" y="218" width="34" height="46" rx="2" fill="url(#f8h)" stroke="#b8b8b0" stroke-width="1.4"/>
      <rect x="230" y="218" width="34" height="46" rx="2" fill="url(#f8h)" stroke="#b8b8b0" stroke-width="1.4"/>
      <rect x="280" y="218" width="34" height="46" rx="2" fill="url(#f8h)" stroke="#b8b8b0" stroke-width="1.4"/>
      <rect x="330" y="218" width="34" height="46" rx="2" fill="url(#f8h)" stroke="#b8b8b0" stroke-width="1.4"/>
      <!-- the one that does -->
      <rect x="380" y="218" width="34" height="46" rx="2" fill="#e8eff7" stroke="#1f5fa9" stroke-width="1.8"/>
      <line x1="388" y1="231" x2="406" y2="231" stroke="#1f5fa9" stroke-width="1.4"/>
      <line x1="388" y1="241" x2="406" y2="241" stroke="#1f5fa9" stroke-width="1.4"/>
      <line x1="388" y1="251" x2="400" y2="251" stroke="#1f5fa9" stroke-width="1.4"/>
    </g>
    <text x="440" y="238" font-size="15">rarely or never receive one from their suppliers.</text>
    <text x="440" y="258" font-size="15">The one that does is the exception, not the norm.</text>

    <!-- ============ statistic 2 ============ -->
    <text x="25" y="326" font-size="13" font-weight="bold" fill="#5a5a55">ORGANISATIONS THAT DO PRODUCE ARTEFACTS</text>
    <text x="25" y="376" font-size="38" font-weight="bold" fill="#1f5fa9">2 in 3</text>

    <g>
      <rect x="180" y="338" width="34" height="46" rx="2" fill="url(#f8h)" stroke="#b8b8b0" stroke-width="1.4"/>
      <rect x="230" y="338" width="34" height="46" rx="2" fill="url(#f8h)" stroke="#b8b8b0" stroke-width="1.4"/>
      <rect x="280" y="338" width="34" height="46" rx="2" fill="#e8eff7" stroke="#1f5fa9" stroke-width="1.8"/>
      <line x1="288" y1="351" x2="306" y2="351" stroke="#1f5fa9" stroke-width="1.4"/>
      <line x1="288" y1="361" x2="306" y2="361" stroke="#1f5fa9" stroke-width="1.4"/>
      <line x1="288" y1="371" x2="300" y2="371" stroke="#1f5fa9" stroke-width="1.4"/>
    </g>
    <text x="440" y="358" font-size="15">report a gap between producing artefacts and</text>
    <text x="440" y="378" font-size="15">actually using them.</text>

    <text x="25" y="406" font-size="12.5" fill="#6b6b6b">Hatched: the organisations on the wrong side of each figure. Outlined in blue: the remainder.</text>

    <!-- ============ the claim ============ -->
    <line x1="25" y1="424" x2="875" y2="424" stroke="#c9c9c2" stroke-width="1"/>
    <text x="25" y="450" font-size="15">ENISA concludes that the artefacts serve compliance rather than security. An artefact produced under an</text>
    <text x="25" y="470" font-size="15">obligation and then not read is the default outcome here, not the failure case.</text>
  </g>
</svg>
